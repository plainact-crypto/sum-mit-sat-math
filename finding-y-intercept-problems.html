<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Finding Y-Intercept — Practice Problems | SUMMIT SAT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Equations in Two Variables</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Finding Y-Intercept</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[['01 · SKILL CHECK','Use x = 0 to locate the y-intercept',[['What is the y-intercept of 2x + 3y = 18?',['(0, 6)','(6, 0)','(0, 9)','(9, 0)'],0],['What is the y-intercept of y = −4x + 12?',['(−4, 0)','(0, −4)','(12, 0)','(0, 12)'],3],['What is the y-coordinate of the y-intercept of x − 2y = −7?',['−7','−7/2','7/2','7'],2]]],['02 · CORE PRACTICE','Find y-intercepts in several linear forms',[['Find the y-intercept of 5x + 2y = 30.',['(0, 6)','(0, 15)','(6, 0)','(15, 0)'],1],['Find the y-intercept of 3x − y = −15.',['(0, −15)','(0, 15)','(−5, 0)','(5, 0)'],1],['Find the y-intercept of y = (1/2)x − 4.',['(0, −4)','(−4, 0)','(0, 1/2)','(1/2, 0)'],0],['Find the y-intercept of y = −3x − 9.',['(0, 3)','(−3, 0)','(0, −9)','(−9, 0)'],2],['Find the y-intercept of 8x + 6y = 7.',['(0, 7/8)','(0, 8/7)','(0, 7/6)','(7/6, 0)'],2],['What is the y-intercept of the horizontal line y = 4?',['No y-intercept','(0, 4)','(4, 0)','Every point on the line'],1],['How many y-intercepts does the vertical line x = 4 have?',['0','1','4','Infinitely many'],0],['How many points does the line x = 0 share with the y-axis?',['0','1','2','Infinitely many'],3]]],['03 · SAT-STYLE PRACTICE','Use y-intercepts in equations and contexts',[['The line 4x + 5y = 60 crosses the y-axis at (0, b). What is b?',['12','15','20','60'],0],['A quantity is modeled by y = −2x + 18. What is its value when x = 0?',['−2','0','9','18'],3],['The equation 3y = 12 − 6x represents a line. What is its y-intercept?',['(0, 2)','(0, 4)','(2, 0)','(4, 0)'],1],['A tank contains y = 120 − 8x liters after x minutes. According to the model, how many liters are in the tank at x = 0?',['8','15','120','128'],2],['For the line Ax + 7y = −21, where A is a constant, what is the y-coordinate of the y-intercept?',['−7','−3','3','21'],1]]],['04 · CHALLENGE PROBLEMS','Work backward from y-intercept information',[['The line 4x + ky = 24 has y-intercept (0, 6). What is k?',['2','4','6','8'],1],['A line has y-intercept (0, 6) and x-intercept (−2, 0). If its equation is y = mx + 6, what is m?',['−3','−1/3','1/3','3'],3]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)};</script></body></html>
