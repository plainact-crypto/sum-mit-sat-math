<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Systems of Inequalities Word Problems — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Systems of Linear Inequalities</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Systems of Inequalities Word Problems</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Model · test · interpret constraints</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Translate everyday limits into inequalities",[["A theater sells x adult tickets and y student tickets. It can seat at most 120 people, and at least 30 adult tickets must be sold. Which system models the situation?",["x + y ≤ 120 and x ≥ 30","x + y ≥ 120 and x ≥ 30","x + y ≤ 120 and y ≥ 30","x + y = 120 and x ≤ 30"],0],["A student buys x notebooks at $3 each and y folders at $2 each. The student can spend at most $42 and wants at least 10 items. Which purchase satisfies both conditions?",["8 notebooks and 6 folders","12 notebooks and 4 folders","4 notebooks and 5 folders","10 notebooks and 8 folders"],0],["A fundraiser sells x large packs for $5 and y small packs for $3. It needs at least $90 in sales and can sell no more than 24 packs. Which system models the constraints?",["5x + 3y ≥ 90 and x + y ≤ 24","5x + 3y ≤ 90 and x + y ≤ 24","5x + 3y ≥ 90 and x + y ≥ 24","5x + 3y = 90 and x + y = 24"],0]]],["CORE PRACTICE","Check plans against two or more constraints",[["A field trip uses x vans with 8 seats each and y buses with 20 seats each. At least 120 seats are needed, using at most 8 vehicles. Which plan works?",["2 vans and 6 buses","5 vans and 3 buses","7 vans and 1 bus","5 vans and 4 buses"],0],["A bakery makes x muffins earning $2 profit each and y cookies earning $1.50 each. It can make at most 60 items and wants at least $90 profit. Which plan is feasible?",["30 muffins and 20 cookies","20 muffins and 30 cookies","45 muffins and 20 cookies","25 muffins and 20 cookies"],0],["A study plan uses x hours for algebra and y hours for geometry. The total is at most 8 hours, and algebra time must be at least twice geometry time. Which plan satisfies both conditions?",["x = 6, y = 2","x = 5, y = 3","x = 4, y = 3","x = 3, y = 2"],0],["Adult tickets cost $12 and child tickets cost $7. A school event can admit at most 60 people and must collect at least $500. Which system models the ticket constraints?",["x + y ≤ 60 and 12x + 7y ≥ 500","x + y ≥ 60 and 12x + 7y ≥ 500","x + y ≤ 60 and 12x + 7y ≤ 500","x + y = 60 and 12x + 7y = 500"],0],["An art kit contains x red pieces and y blue pieces. It may contain at most 25 pieces, at least 8 red pieces, and at least 10 blue pieces. Which combination is allowed?",["(10, 12)","(16, 10)","(8, 9)","(7, 15)"],0],["A delivery cart carries x small boxes weighing 4 kg each and y large boxes weighing 7 kg each. The load must be at most 140 kg and contain at least 24 boxes. Which load is feasible?",["14 small and 10 large","20 small and 3 large","10 small and 15 large","18 small and 4 large"],0],["A garden uses x rose plots needing 3 m² each and y herb plots needing 2 m² each. It has at most 48 m², needs at least 12 plots total, and at least 4 herb plots. Which plan works?",["8 rose and 8 herb plots","13 rose and 6 herb plots","6 rose and 5 herb plots","4 rose and 7 herb plots"],0],["A data plan counts each video unit as 2 usage points and each music unit as 1 point. A user may use at most 18 points but wants at least 10 total units. Which pair is allowed?",["6 video and 5 music units","7 video and 5 music units","4 video and 5 music units","8 video and 3 music units"],0]]],["EXAM-STYLE PRACTICE","Interpret constraints, strict limits, and parameters",[["A concert sells x VIP tickets at $50 and y regular tickets at $30. Attendance is at most 200, revenue must be at least $7,000, and at least 40 VIP tickets must be sold. Which plan is feasible?",["50 VIP and 150 regular","60 VIP and 120 regular","40 VIP and 160 regular","100 VIP and 110 regular"],0],["A shipping plan uses x = 20 standard boxes and y = 10 express boxes. It must satisfy x + y ≤ 35 and 2x + ky ≤ 70. What is the greatest integer value of k that keeps this plan feasible?",["1","2","3","4"],2],["A school orders x basic kits and y advanced kits. The constraints are 4x + 6y ≤ 120 and x + y ≥ 24. If x = 12, what value of y satisfies both constraints?",["10","11","12","13"],2],["An event has x adult guests and y student guests. The room requires x + y < 50, while ticket revenue must satisfy 10x + 5y ≥ 350. Which attendance plan is allowed?",["20 adults and 30 students","25 adults and 20 students","10 adults and 35 students","30 adults and 20 students"],1],["A workshop plan (10, 12) is tested against x + 2y ≤ 40 and 3x + y ≤ 45. What is the correct conclusion?",["It satisfies only the first constraint","It satisfies only the second constraint","It satisfies both constraints","It satisfies neither constraint"],2]]],["CHALLENGE PROBLEMS","Reason across integer solution regions and optimization",[["For nonnegative integers x and y, how many ordered pairs satisfy x + y ≤ 10, x ≥ 4, and y ≥ 3?",["7","8","9","10"],3],["A scoring model uses nonnegative integers x and y with x + y ≤ 12 and 2x + 3y ≤ 30. What is the greatest possible value of 3x + 4y?",["38","40","42","44"],2]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});if(n!==18||groups[0][2].length!==3||groups[1][2].length!==8||groups[2][2].length!==5||groups[3][2].length!==2)throw new Error('Problems format must be exactly 3/8/5/2 = 18 questions');document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
