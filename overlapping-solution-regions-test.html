<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Overlapping Solution Regions — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Systems of Linear Inequalities</div><div class="page-type">LESSON TEST</div><h1>Overlapping Solution Regions</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Which point lies in the overlap of y ≥ x + 1 and y ≤ -x + 7?',c:['(2, 4)','(4, 6)','(0, 0)','(5, 1)'],a:0,why:'At (2,4), 4 ≥ 3 and 4 ≤ 5, so both inequalities are true. Every other choice violates at least one inequality.'},{level:'EASY-MEDIUM',q:'For the system y ≥ -x + 6 and y ≤ 2x, for which x-values can an overlapping y-value exist?',c:['x ≥ 2','x ≤ 2','x > 6','All real x'],a:0,why:'The lower bound must not exceed the upper bound: -x+6 ≤ 2x. Thus 6 ≤ 3x, so x ≥ 2. Equality is allowed because both inequalities include their boundaries.'},{level:'MEDIUM',q:'The boundaries y = 2x - 1 and y = -x + 8 meet at one point. What is that point?',c:['(2, 3)','(3, 5)','(4, 7)','(5, 3)'],a:1,why:'Set 2x-1=-x+8. Then 3x=9, so x=3 and y=5. Substitution gives 5 in both equations.'},{level:'HARD',q:'A feasible region satisfies y ≥ x + 1, y ≤ -2x + 10, and x ≥ 1. What is the greatest possible x-value?',c:['2','3','4','5'],a:1,why:'For the y-bounds to overlap, x+1 ≤ -2x+10. Therefore 3x ≤ 9 and x ≤ 3. At x=3, y=4 satisfies both y-bounds and x≥1, so 3 is attainable.'},{level:'HARD / EXAM-STYLE',q:'A workshop makes x small kits and y large kits. It must make at least 7 kits total and can use at most 18 labor units, where a small kit uses 3 units and a large kit uses 2. Which nonnegative pair is feasible?',c:['(4, 3)','(5, 2)','(3, 3)','(6, 1)'],a:0,why:'The constraints are x+y ≥ 7 and 3x+2y ≤ 18. For (4,3), the total is 7 and labor use is 18, so both limits are met. Each other choice violates at least one constraint.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
