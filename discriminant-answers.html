<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Discriminant — Answers | SUMMIT MATH</title></head><body><main class="page-shell"><section class="lesson-card"><div class="crumb">Advanced Math · Quadratic Equations</div><div class="page-type">ANSWERS</div><div class="lesson-title">Discriminant</div><p>Exact answers to the 18 current Practice Problems.</p><div id="answers"></div><a href="../problems/">← Back to Practice Problems</a></section></main><script>const groups=[["SKILL CHECK",[["Find the discriminant of x² − 6x + 5 = 0.","16","D=(−6)²−4(1)(5)=36−20=16."],["How many real solutions does 2x² + 3x + 5 = 0 have?","0","D=3²−4(2)(5)=9−40=−31<0, so there are no real solutions."],["Which discriminant value means a quadratic equation has one repeated real solution?","0","A quadratic has one repeated real root exactly when D=0."]]],["CORE PRACTICE",[["Find the discriminant of 3x² − 4x − 2 = 0.","40","D=(−4)²−4(3)(−2)=16+24=40."],["How many distinct real solutions does x² + 10x + 25 = 0 have?","1","D=10²−4(1)(25)=100−100=0, so there is one repeated real solution."],["Which equation has two distinct real solutions?","x² + 2x − 8 = 0","Its discriminant is 2²−4(1)(−8)=36>0. The other three choices have discriminants 0, −16, and −24."],["Find the discriminant of 5x² + x + 1 = 0.","−19","D=1²−4(5)(1)=1−20=−19."],["For 4x² − 12x + 9 = 0, which statement is true?","The discriminant is 0, so there is one repeated real solution.","D=(−12)²−4(4)(9)=144−144=0."],["If the discriminant of a quadratic is 49, what can you conclude?","It has two distinct real solutions.","Since 49>0, the quadratic has two distinct real roots. The discriminant alone does not determine the roots as ±7."],["Find the discriminant of −2x² + 7x − 3 = 0.","25","D=7²−4(−2)(−3)=49−24=25."],["Which value of c makes x² + 8x + c = 0 have exactly one real solution?","16","Set D=0: 8²−4c=0, so 64−4c=0 and c=16."]]],["EXAM-STYLE PRACTICE",[["The equation 2x² + kx + 8 = 0 has one repeated real solution. Which values of k are possible?","k = ±8","Set D=0: k²−4(2)(8)=k²−64=0, so k=±8."],["For what range of k does x² + 4x + k = 0 have two distinct real solutions?","k < 4","Two distinct real roots require D>0: 16−4k>0, hence k<4."],["The quadratic 3x² − 6x + p = 0 has no real solutions. Which condition must p satisfy?","p > 3","No real roots require D<0: 36−12p<0, so p>3."],["A test-style equation is x(x + 6) = m. For the equation to have exactly one real solution, what must m equal?","−9","Rewrite as x²+6x−m=0. Set D=0: 36+4m=0, giving m=−9."],["A quadratic has coefficients a = 2, b = −5, c = q. If it has no real solutions, which inequality is correct?","q > 25/8","D=25−8q. No real roots require 25−8q<0, so q>25/8."]]],["CHALLENGE PROBLEMS",[["The equation (k + 1)x² − 4x + 1 = 0 is quadratic and has exactly one real solution. What is k?","3","Set D=0: 16−4(k+1)=0, so 12−4k=0 and k=3. Then k+1=4≠0, so the equation remains quadratic."],["A ball's height is modeled by h(t) = −5t² + 20t + s. For the graph to touch ground at exactly one time value, what must s be?","−20","Touching ground once means −5t²+20t+s=0 has D=0. Thus 20²−4(−5)s=400+20s=0, so s=−20. The repeated time is t=2, and h(2)=0."]]]];let n=0,root=document.getElementById('answers');groups.forEach(g=>{let s=document.createElement('section');s.className='lesson-section';s.innerHTML='<h2>'+g[0]+'</h2>';g[1].forEach(a=>{n++;s.innerHTML+='<div class="question"><b>'+n+'. '+a[0]+'</b><p><strong>Answer:</strong> '+a[1]+'</p><p>'+a[2]+'</p></div>'});root.appendChild(s)});if(n!==18||groups[0][1].length!==3||groups[1][1].length!==8||groups[2][1].length!==5||groups[3][1].length!==2)throw Error('Answers must match current Problems 3/8/5/2');</script></body></html>
