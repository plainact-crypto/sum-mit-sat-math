<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Zero Slope — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Zero Slope</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[["01 · SKILL CHECK","Recognize and calculate zero slope",[["A line passes through (2, 5) and (8, 5). What is its slope?",["−3","0","1","3"],1],["What is the slope of the line y = 4?",["Undefined","−4","0","4"],2],["A table contains the points (−2, 7), (1, 7), and (6, 7). What is the slope?",["−1","0","1","7"],1]]],["02 · CORE PRACTICE","Work with horizontal lines, equations, tables, and rates",[["Find the slope through (−3, −2) and (5, −2).",["−8","−1/4","0","8"],2],["What is the slope of y = 12?",["0","1","12","Undefined"],0],["For a line, Δx = 7 and Δy = 0. What is the slope?",["−7","0","7","Undefined"],1],["Two distinct points on a horizontal line are (1, k) and (9, k). What is the slope?",["−8","0","8","k"],1],["Which equation is the horizontal line passing through (4, −6)?",["x = −6","x = 4","y = −6","y = 4"],2],["A linear function has f(−2) = 13, f(3) = 13, and f(10) = 13. What is its rate of change?",["−13","0","1","13"],1],["A room stays at 68°F from 2 p.m. to 7 p.m. If temperature is modeled linearly over that interval, what is the rate of change?",["0°F per hour","5°F per hour","13.6°F per hour","68°F per hour"],0],["Which equation represents a line with zero slope?",["x = 7","2y = 14","y = 3x + 1","x + y = 9"],1]]],["03 · EXAM-STYLE PRACTICE","Interpret zero slope in algebraic and real-world settings",[["An account balance is $240 at the start of week 3 and still $240 at the start of week 8. If the balance is modeled linearly between those times, what is the slope?",["−48 dollars/week","0 dollars/week","5 dollars/week","48 dollars/week"],1],["The line through (3, 7) and (11, p) has slope 0. What is p?",["0","3","7","11"],2],["Which description matches a graph with zero slope?",["A vertical line","A line rising left to right","A horizontal line","A line falling left to right"],2],["Which equation represents the line through (−5, 4) and (6, 4)?",["x = 4","y = 4","y = 11x + 4","y = −11x + 4"],1],["A horizontal line passes through (−2, 11). If its equation is y = c, what is c?",["−2","0","2","11"],3]]],["04 · CHALLENGE PROBLEMS","Use zero slope to determine unknown values",[["A line through (a, −3) and (a + 12, b) has slope 0. What is b?",["−12","−3","0","9"],1],["The line through (−8, k) and (5, 2k − 6) has slope 0. What is k?",["−6","0","5","6"],3]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
