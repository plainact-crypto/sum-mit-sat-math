<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Building an Equation from Slope and One Point — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">LESSON TEST</div><h1>Building an Equation from Slope and One Point</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers & Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'A line has slope 3 and passes through (2, 4). Which equation represents the line?',c:['y = 3x − 2','y = 3x + 2','y = 2x','y = −3x + 10'],a:0,why:'Use y = mx + b. Substituting (2, 4) and m = 3 gives 4 = 6 + b, so b = −2. Therefore y = 3x − 2.'},{level:'EASY-MEDIUM',q:'A line has slope −2 and passes through (−3, 5). Which equation represents the line?',c:['y = −2x − 1','y = −2x + 1','y = 2x + 11','y = −3x − 4'],a:0,why:'5 = −2(−3) + b = 6 + b, so b = −1. Therefore y = −2x − 1.'},{level:'MEDIUM',q:'A line has slope 1/2 and passes through (4, −1). What is the value of y when x = 10?',c:['1','2','3','4'],a:1,why:'First find b: −1 = (1/2)(4) + b = 2 + b, so b = −3. At x = 10, y = 5 − 3 = 2.'},{level:'HARD',q:'A quantity decreases by 6 units per hour. After 5 hours, its value is 22. Which equation models its value y after x hours?',c:['y = −6x + 52','y = 6x − 8','y = −6x + 22','y = −5x + 47'],a:0,why:'The slope is −6. Using the point (5, 22), 22 = −6(5) + b = −30 + b, so b = 52. The model is y = −6x + 52.'},{level:'HARD / EXAM-STYLE',q:'A line has slope 4/3 and passes through (−3, 7). Which standard-form equation represents the line?',c:['4x − 3y = −33','4x + 3y = 9','3x − 4y = −37','4x − 3y = 33'],a:0,why:'Using y = (4/3)x + b and the point (−3, 7): 7 = −4 + b, so b = 11. Thus 3y = 4x + 33, which rearranges to 4x − 3y = −33.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
