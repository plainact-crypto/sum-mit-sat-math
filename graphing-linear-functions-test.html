<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Graphing Linear Functions — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">LESSON TEST</div><h1>Graphing Linear Functions</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers & Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Which point is the y-intercept of y = −3x + 7?',c:['(0, 7)','(7, 0)','(0, −3)','(−3, 0)'],a:0,why:'At the y-intercept, x = 0. Substitution gives y = 7, so the point is (0, 7).'},{level:'EASY-MEDIUM',q:'Which two points both lie on y = (1/2)x − 2?',c:['(0, −2) and (4, 0)','(0, 2) and (4, 4)','(−2, 0) and (0, 4)','(0, −2) and (2, 2)'],a:0,why:'For x = 0, y = −2. For x = 4, y = 2 − 2 = 0. Both points satisfy the equation.'},{level:'MEDIUM',q:'A line passes through (−2, 6) and (2, −2). Which equation represents its graph?',c:['y = −2x + 2','y = 2x + 2','y = −2x − 2','y = −x + 4'],a:0,why:'The slope is (−2 − 6)/(2 − (−2)) = −8/4 = −2. Using (2, −2), −2 = −4 + b, so b = 2.'},{level:'HARD',q:'The line kx + 2y = 12 has x-intercept (3, 0). What is k?',c:['2','3','4','6'],a:2,why:'Substitute (3, 0): 3k + 0 = 12, so k = 4.'},{level:'HARD / EXAM-STYLE',q:'A tank contains 42 liters initially and drains at a constant rate. After 6 minutes it contains 27 liters. If time is graphed on the x-axis and volume on the y-axis, which equation models the line?',c:['y = −2.5x + 42','y = 2.5x + 27','y = −15x + 42','y = −2.5x + 27'],a:0,why:'The slope is (27 − 42)/(6 − 0) = −15/6 = −2.5 liters per minute, and the initial value is 42, so y = −2.5x + 42.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
