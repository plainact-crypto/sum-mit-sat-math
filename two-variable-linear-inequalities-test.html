<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Two-Variable Linear Inequalities — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Inequalities</div><div class="page-type">LESSON TEST</div><h1>Two-Variable Linear Inequalities</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Which ordered pair satisfies y > x + 1?',c:['(0, 0)','(1, 3)','(2, 2)','(-1, -1)'],a:1,why:'Substitute each point. For (1,3), 3 > 1 + 1, so 3 > 2 is true. The other choices do not satisfy the inequality.'},{level:'EASY-MEDIUM',q:'How should the boundary line for y ≤ -2x + 4 be drawn?',c:['Dashed, because equality is excluded','Solid, because equality is included','Vertical, because x is missing','No boundary line is needed'],a:1,why:'The symbol ≤ includes equality, so points on y = -2x + 4 are part of the solution set. The boundary must be solid.'},{level:'MEDIUM',q:'Rewrite 2x - y > 6 in slope-intercept form.',c:['y > 2x - 6','y < 2x - 6','y > -2x + 6','y < -2x + 6'],a:1,why:'Subtract 2x to get -y > 6 - 2x. Multiplying by -1 reverses the inequality: y < 2x - 6.'},{level:'HARD',q:'Which point satisfies 3x + 2y ≤ 12?',c:['(4, 1)','(2, 3)','(0, 7)','(3, 2)'],a:1,why:'For (2,3), 3(2)+2(3)=6+6=12, so the inequality is true. The other totals are 14, 14, and 13.'},{level:'HARD / EXAM-STYLE',q:'A club has at most $80 for notebooks x costing $5 each and binders y costing $8 each. Which order is allowed by the budget?',c:['(8,5)','(10,4)','(6,7)','(12,3)'],a:0,why:'The budget is 5x + 8y ≤ 80. For (8,5), 5(8)+8(5)=40+40=80, so it is allowed. The other totals are 82, 86, and 84.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
