<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Two-Variable Linear Inequalities — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Inequalities</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Two-Variable Linear Inequalities</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Boundary lines, test points, solution regions</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Recognize solutions and graph features",[["Which ordered pair satisfies y > 2x − 1?",["(0, −2)","(1, 0)","(2, 4)","(3, 5)"],2],["For y < −x + 3, how should the boundary line y = −x + 3 be drawn?",["Solid","Dashed","Vertical","No boundary line"],1],["Which inequality includes its boundary line?",["y > 4x + 1","y < x − 6","y ≥ −2x + 5","y ≠ 3x"],2]]],["CORE PRACTICE","Test points, rearrange inequalities, and interpret regions",[["Does (2, 1) satisfy y ≤ x + 1?",["Yes","No","Only if x = 0","Cannot be determined"],0],["Which point does NOT satisfy y ≥ −x?",["(0, 0)","(2, −1)","(−2, 3)","(1, −2)"],3],["Rewrite 2x + y > 6 in slope-intercept form.",["y > −2x + 6","y < −2x + 6","y > 2x − 6","y < 2x − 6"],0],["Rewrite 3x − 2y ≤ 8 in slope-intercept form.",["y ≤ (3/2)x − 4","y ≥ (3/2)x − 4","y ≤ −(3/2)x + 4","y ≥ −(3/2)x + 4"],1],["The boundary of y > 3x − 2 crosses the y-axis at which point?",["(0, 3)","(0, −2)","(−2, 0)","(3, 0)"],1],["For y ≤ −2x + 4, which point lies on the boundary line?",["(0, 2)","(1, 2)","(2, 2)","(3, 0)"],1],["For y > x + 2, the test point (0, 0) is not a solution. Which side of the boundary should be shaded?",["The side containing (0,0)","The side not containing (0,0)","Both sides","Neither side"],1],["Which inequality has a horizontal boundary line?",["y < 5","y > 2x","x ≤ 4","y ≥ x − 1"],0]]],["EXAM-STYLE PRACTICE","Model limits and interpret two-variable constraints",[["A school club can spend at most $120 on notebooks x costing $4 each and folders y costing $6 each. Which inequality models the budget?",["4x + 6y ≤ 120","4x + 6y ≥ 120","6x + 4y < 120","4x − 6y ≤ 120"],0],["A delivery van must carry at least 500 kg. Boxes x weigh 20 kg and crates y weigh 50 kg. Which inequality models the requirement?",["20x + 50y ≤ 500","20x + 50y ≥ 500","50x + 20y > 500","20x − 50y ≥ 500"],1],["A student needs more than 180 total practice minutes. If x is math minutes and y is reading minutes, which inequality represents the condition?",["x + y < 180","x + y ≤ 180","x + y > 180","x + y ≥ 180"],2],["Tickets cost $8 for students and $12 for adults. Revenue must be at least $240. If s and a are the ticket counts, which inequality is correct?",["8s + 12a ≥ 240","8s + 12a ≤ 240","12s + 8a > 240","8s − 12a ≥ 240"],0],["A workshop has room for no more than 30 people. If x are beginners and y are advanced participants, which point violates x + y ≤ 30?",["(12,18)","(20,9)","(14,15)","(17,14)"],3]]],["CHALLENGE PROBLEMS","Combine algebraic form with solution-region reasoning",[["Which point satisfies both y > −2x + 1 and 2x + y < 7?",["(0,0)","(1,2)","(2,5)","(3,−6)"],1],["For 2x − 3y ≥ 12, which statement correctly describes the graph?",["Dashed boundary y = (2/3)x − 4; shade above","Solid boundary y = (2/3)x − 4; shade below","Solid boundary y = −(2/3)x + 4; shade above","Dashed boundary y = −(2/3)x + 4; shade below"],1]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
