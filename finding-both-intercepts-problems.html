<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Finding Both Intercepts — Practice Problems | SUMMIT SAT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Equations in Two Variables</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Finding Both Intercepts</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[['01 · SKILL CHECK','Find both axis intercepts by setting one variable equal to zero',[['What are the x- and y-intercepts of x + y = 10?',['(10, 0) and (0, 10)','(5, 0) and (0, 5)','(0, 10) and (10, 0)','(10, 10) and (0, 0)'],0],['What are the intercepts of 2x + 3y = 12?',['(4, 0) and (0, 6)','(6, 0) and (0, 4)','(12, 0) and (0, 12)','(3, 0) and (0, 2)'],1],['For y = −3x + 9, what are the intercepts?',['(−3, 0) and (0, 9)','(3, 0) and (0, 9)','(9, 0) and (0, 3)','(3, 0) and (0, −9)'],1]]],['02 · CORE PRACTICE','Work across standard form, slope-intercept form, fractions, and special cases',[['Find both intercepts of 4x + 5y = 20.',['(4, 0) and (0, 5)','(5, 0) and (0, 4)','(20, 0) and (0, 20)','(1, 0) and (0, 1)'],1],['Find both intercepts of 3x − 2y = 18.',['(6, 0) and (0, −9)','(−6, 0) and (0, 9)','(9, 0) and (0, −6)','(6, 0) and (0, 9)'],0],['Find both intercepts of y = (1/2)x − 4.',['(−8, 0) and (0, −4)','(8, 0) and (0, −4)','(4, 0) and (0, −8)','(8, 0) and (0, 4)'],1],['Find both intercepts of 6x + 8y = 24.',['(3, 0) and (0, 4)','(4, 0) and (0, 3)','(6, 0) and (0, 8)','(8, 0) and (0, 6)'],1],['Find both intercepts of 10x − 4y = 15.',['(3/2, 0) and (0, −15/4)','(15/10, 0) and (0, 15/4)','(2/3, 0) and (0, −4/15)','(15/4, 0) and (0, −3/2)'],0],['Which statement is true for the horizontal line y = 7?',['It has x-intercept (7, 0) and y-intercept (0, 7)','It has no x-intercept and y-intercept (0, 7)','It has x-intercept (7, 0) and no y-intercept','It has no intercepts'],1],['Which statement is true for the vertical line x = −5?',['It has x-intercept (−5, 0) and no y-intercept','It has no x-intercept and y-intercept (0, −5)','It has both intercepts at (−5, 0)','It has no intercepts'],0],['For the line y = 2x, what are the x- and y-intercepts?',['(2, 0) and (0, 2)','Both are (0, 0)','There is no x-intercept','There is no y-intercept'],1]]],['03 · SAT-STYLE PRACTICE','Interpret intercepts in equations and realistic models',[['The line 5x + 4y = 40 represents combinations of two item types that use all available resources. What are its intercepts?',['(8, 0) and (0, 10)','(10, 0) and (0, 8)','(5, 0) and (0, 4)','(40, 0) and (0, 40)'],0],['A budget model is 6x + 3y = 54. If the intercepts represent buying only one item type at a time, what are they?',['(18, 0) and (0, 9)','(9, 0) and (0, 18)','(6, 0) and (0, 3)','(54, 0) and (0, 54)'],1],['The equation 2y = 16 − 4x represents a line. What are its intercepts?',['(4, 0) and (0, 8)','(8, 0) and (0, 4)','(−4, 0) and (0, 8)','(4, 0) and (0, −8)'],0],['A line is modeled by Ax + 6y = 30, where A = 3. What are its intercepts?',['(5, 0) and (0, 10)','(10, 0) and (0, 5)','(3, 0) and (0, 6)','(30, 0) and (0, 30)'],1],['A company model is 12x + 8y = 48. Which pair gives the maximum x-value when y = 0 and the maximum y-value when x = 0?',['x = 6, y = 4','x = 4, y = 6','x = 12, y = 8','x = 8, y = 12'],1]]],['04 · CHALLENGE PROBLEMS','Use intercept information to recover missing constants',[['The line kx + 4y = 24 has x-intercept (3, 0) and y-intercept (0, 6). What is k?',['4','6','8','12'],2],['A line has intercepts (−6, 0) and (0, 3). Which equation represents the line?',['x − 2y = −6','x + 2y = −6','2x + y = −6','x − 3y = −6'],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)};</script></body></html>
