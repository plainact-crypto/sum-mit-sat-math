<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Solving Graphically — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">LESSON TEST</div><h1>Solving Graphically</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../problems/">Review Practice →</a></div></div></main><script>const qs=[{level:'EASY',q:'The graphs of y = x + 2 and y = -x + 6 intersect at which point?',c:['(1, 3)','(2, 4)','(3, 5)','(4, 2)'],a:1,why:'At the intersection, x + 2 = -x + 6. Thus 2x = 4, so x = 2 and y = 4. Substitution verifies both equations.'},{level:'EASY-MEDIUM',q:'What does it mean graphically if two distinct lines have the same slope but different y-intercepts?',c:['They intersect once','They are the same line','They are parallel, so the system has no solution','They intersect twice'],a:2,why:'Distinct lines with equal slopes are parallel. Because they never intersect, there is no ordered pair that satisfies both equations.'},{level:'MEDIUM',q:'Find the graphical solution of y = 2x - 3 and y = -x + 6.',c:['(2, 1)','(3, 3)','(4, 5)','(1, 5)'],a:1,why:'Set the y-values equal: 2x - 3 = -x + 6, giving 3x = 9 and x = 3. Then y = 3 in both equations.'},{level:'HARD',q:'The lines y = 0.5x + 1 and y = -0.25x + 7 intersect at which point?',c:['(6, 4)','(8, 5)','(10, 6)','(12, 7)'],a:1,why:'Solve 0.5x + 1 = -0.25x + 7. Then 0.75x = 6, so x = 8 and y = 5. Both original equations give 5.'},{level:'HARD / EXAM-STYLE',q:'Two study plans model total practice questions completed after d days by A(d) = 12d + 18 and B(d) = 8d + 42. On what day do their graphs intersect, meaning the totals are equal?',c:['Day 4','Day 5','Day 6','Day 8'],a:2,why:'At the intersection, 12d + 18 = 8d + 42. Thus 4d = 24, so d = 6. Each model then gives 90 questions.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
