<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Polynomial Subtraction — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Polynomial Operations</div><div class="page-type">LESSON TEST</div><h1>Polynomial Subtraction</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Subtract: (7x + 2) - (3x - 5)',c:['4x - 3','10x + 7','4x + 7','10x - 3'],a:2,why:'Distribute the subtraction first: 7x + 2 - 3x + 5 = 4x + 7.'},{level:'EASY-MEDIUM',q:'Subtract: (6y² - y + 4) - (-2y² + 5y - 3)',c:['4y² + 4y + 1','8y² - 6y + 7','8y² + 4y + 1','4y² - 6y + 7'],a:1,why:'Subtract every term in the second polynomial: 6y² - y + 4 + 2y² - 5y + 3 = 8y² - 6y + 7.'},{level:'MEDIUM',q:'If P(x)=4x³-2x²+3 and Q(x)=x³+5x²-4x+1, what is P(x)-Q(x)?',c:['3x³ + 3x² - 4x + 2','5x³ + 3x² - 4x + 4','3x³ - 7x² + 4x + 2','3x³ - 7x² - 4x + 4'],a:2,why:'Combine by degree after changing the signs of Q: (4-1)x³ + (-2-5)x² + (0-(-4))x + (3-1) = 3x³ - 7x² + 4x + 2.'},{level:'HARD',q:'A school plans (9n² + 4n + 30) practice tasks and has completed (5n² - n + 12). Which polynomial gives the number still to complete?',c:['4n² + 3n + 18','14n² + 3n + 42','4n² + 5n + 42','4n² + 5n + 18'],a:3,why:'Remaining means planned minus completed: (9-5)n² + (4-(-1))n + (30-12) = 4n² + 5n + 18 tasks.'},{level:'HARD / EXAM-STYLE',q:'If A(x)-B(x)=2x³+3x²-5x+4 and A(x)=6x³-x²+2x-1, which polynomial is B(x)?',c:['8x³ + 2x² - 3x + 3','4x³ - 4x² + 7x - 5','4x³ + 2x² - 3x - 5','-4x³ + 4x² - 7x + 5'],a:1,why:'Because B=A-(A-B), subtract the given difference from A: (6-2)x³ + (-1-3)x² + (2-(-5))x + (-1-4) = 4x³ - 4x² + 7x - 5.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
