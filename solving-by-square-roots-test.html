<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Solving by Square Roots — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Quadratic Equations</div><div class="page-type">LESSON TEST</div><h1>Solving by Square Roots</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Solve over the real numbers: x² = 81',c:['x = ±9','x = 9 only','x = ±40.5','x = 81'],a:0,why:'Take both square roots: x = ±√81 = ±9. Substitution gives 9² = 81 and (−9)² = 81.'},{level:'EASY-MEDIUM',q:'Solve: (x − 4)² = 25',c:['x = −1 or x = 9','x = 1 or x = 9','x = −9 or x = 1','x = 4 or x = 5'],a:0,why:'Take square roots: x−4 = ±5. Therefore x = 9 or x = −1. Both values make (x−4)² equal 25.'},{level:'MEDIUM',q:'Solve over the real numbers: 3x² = 75',c:['x = ±5','x = 5 only','x = ±25','x = ±√75'],a:0,why:'Divide by 3 to get x² = 25, then take both square roots: x = ±5. Each solution gives 3(25)=75.'},{level:'HARD',q:'Solve: (2x + 1)² = 49',c:['x = 3 or x = −4','x = 3 only','x = 4 or x = −3','x = 24 or x = −25'],a:0,why:'Set 2x+1 = ±7. From 2x+1=7, x=3; from 2x+1=−7, x=−4. Squaring either inner value gives 49.'},{level:'HARD / EXAM-STYLE',q:'A square has area 196 square units. Its side length is x + 3 units, where x is positive. What is x?',c:['11','14','193','−17'],a:0,why:'Area gives (x+3)²=196, so x+3=±14. A side length must be positive, so x+3=14 and x=11.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};</script></body></html>
