<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Factoring Trinomials — Practice Problems | SUMMIT MATH</title></head><body><main class="page-shell"><section class="lesson-card"><div class="crumb">Advanced Math · Factoring</div><div class="page-type">PRACTICE PROBLEMS</div><div class="lesson-title">Factoring Trinomials</div><p>18 original questions · Easy → Challenge</p><div id="sets"></div><a href="../explanation/">← Back to Explanation</a></section></main><script>const groups=[["SKILL CHECK",[["Factor completely: x² + 7x + 12",["(x + 3)(x + 4)","(x + 2)(x + 6)","(x - 3)(x - 4)","(x + 1)(x + 12)"],0],["Factor completely: x² - 9x + 20",["(x - 4)(x - 5)","(x + 4)(x + 5)","(x - 2)(x - 10)","(x + 2)(x - 10)"],0],["Factor completely: x² + 2x - 15",["(x + 5)(x - 3)","(x - 5)(x + 3)","(x + 5)(x + 3)","(x - 5)(x - 3)"],0]]],["CORE PRACTICE",[["Factor: x² + 11x + 24",["(x + 3)(x + 8)","(x + 4)(x + 6)","(x - 3)(x - 8)","(x + 2)(x + 12)"],0],["Factor: x² - 5x - 24",["(x - 8)(x + 3)","(x + 8)(x - 3)","(x - 6)(x + 4)","(x - 12)(x + 2)"],0],["Factor: x² - 13x + 40",["(x - 5)(x - 8)","(x + 5)(x + 8)","(x - 4)(x - 10)","(x - 2)(x - 20)"],0],["Factor: 2x² + 7x + 3",["(2x + 1)(x + 3)","(2x + 3)(x + 1)","(2x - 1)(x - 3)","(x + 1)(x + 3)"],0],["Factor: 3x² - 10x - 8",["(3x + 2)(x - 4)","(3x - 2)(x + 4)","(3x + 4)(x - 2)","(x + 2)(3x - 4)"],0],["Factor: 4x² + 12x + 5",["(2x + 1)(2x + 5)","(4x + 1)(x + 5)","(2x - 1)(2x - 5)","(4x + 5)(x + 1)"],0],["Factor completely: 6x² + 15x + 9",["3(2x + 1)(x + 3)","3(2x + 3)(x + 1)","6(x + 1)(x + 3)","3(2x - 1)(x - 3)"],0],["Factor: 5x² - 13x + 6",["(5x - 3)(x - 2)","(5x - 2)(x - 3)","(5x + 3)(x + 2)","(x - 1)(5x - 6)"],0]]],["EXAM-STYLE PRACTICE",[["Which is the complete factorization of 2x² - x - 6?",["(2x + 3)(x - 2)","(2x - 3)(x + 2)","(x + 3)(2x - 2)","(2x + 1)(x - 6)"],0],["A rectangle has area x² + 9x + 20 square units. If its side lengths are linear expressions with integer constants, what are the side lengths?",["x + 4 and x + 5","x + 2 and x + 10","x - 4 and x - 5","x + 1 and x + 20"],0],["For x² + kx + 18 = (x + 3)(x + 6), find k.",["9","18","3","6"],0],["Factor completely: 12x² - 11x - 5",["(3x + 1)(4x - 5)","(3x - 1)(4x + 5)","(6x + 5)(2x - 1)","(12x + 5)(x - 1)"],0],["The trinomial x² + bx - 28 factors as (x + 7)(x - 4). What is b?",["3","-3","11","-11"],0]]],["CHALLENGE PROBLEMS",[["Factor completely: 6x² - x - 12",["(3x + 4)(2x - 3)","(3x - 4)(2x + 3)","(6x + 3)(x - 4)","(2x + 4)(3x - 3)"],0],["For positive integer n, factor x^(2n) - 5x^n - 24.",["(x^n - 8)(x^n + 3)","(x^n + 8)(x^n - 3)","(x^n - 6)(x^n + 4)","(x^n - 12)(x^n + 2)"],0]]]];let n=0,root=document.getElementById('sets');groups.forEach(g=>{let s=document.createElement('section');s.className='lesson-section';s.innerHTML='<h2>'+g[0]+'</h2>';g[1].forEach(q=>{n++;s.innerHTML+='<div class="question"><b>'+n+'. '+q[0]+'</b><ol type="A">'+q[1].map(x=>'<li>'+x+'</li>').join('')+'</ol></div>'});root.appendChild(s)});if(n!==18||groups[0][1].length!==3||groups[1][1].length!==8||groups[2][1].length!==5||groups[3][1].length!==2)throw Error('3/8/5/2 required');</script></body></html>
