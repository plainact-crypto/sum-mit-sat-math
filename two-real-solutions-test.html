<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Two Real Solutions — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Quadratic Equations</div><div class="page-type">LESSON TEST</div><h1>Two Real Solutions</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Which equation has two distinct real solutions?',c:['x² − 7x + 10 = 0','x² − 6x + 9 = 0','x² + 9 = 0','x² + 4x + 4 = 0'],a:0,why:'x²−7x+10=(x−5)(x−2), so the distinct real solutions are x=5 and x=2. Its discriminant is 49−40=9>0.'},{level:'EASY-MEDIUM',q:'What are the solutions of 2x² + x − 6 = 0?',c:['x = 3/2 or −2','x = −3/2 or 2','x = 3 or −2','x = 2 or −3'],a:0,why:'2x²+x−6=(2x−3)(x+2). Setting each factor to zero gives x=3/2 or x=−2; substitution makes the original expression zero for both.'},{level:'MEDIUM',q:'For what values of c does x² − 12x + c = 0 have two distinct real solutions?',c:['c < 36','c ≤ 36','c > 36','c = 36'],a:0,why:'Two distinct real solutions require D>0. Here D=(−12)²−4c=144−4c>0, so c<36.'},{level:'HARD',q:'The equation (m−2)x² + 6x + 1 = 0 is quadratic and has two distinct real solutions. Which condition is equivalent?',c:['m < 11 and m ≠ 2','m < 11','m > 11','m = 11'],a:0,why:'The discriminant is 36−4(m−2)=44−4m, so D>0 gives m<11. The equation must also remain quadratic, so m−2≠0; therefore m<11 and m≠2.'},{level:'HARD / EXAM-STYLE',q:'A height model is h(t)=−4t²+16t+s. For its graph to cross h=0 at two distinct time values algebraically, what condition must s satisfy?',c:['s > −16','s = −16','s < −16','s > 16'],a:0,why:'Crossing h=0 twice requires D>0. D=16²−4(−4)s=256+16s>0, so s>−16. At s=−16 the graph only touches zero once.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
