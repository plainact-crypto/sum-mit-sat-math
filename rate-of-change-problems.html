<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Rate of Change — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Rate of Change</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[["01 · SKILL CHECK","Find rate of change from points and equations",[["What is the rate of change between (1, 4) and (5, 16)?",["2","3","4","12"],1],["What is the rate of change between (−2, 7) and (2, −1)?",["−4","−2","2","4"],1],["What is the rate of change of y = 5x − 9?",["−9","−5","5","9"],2]]],["02 · CORE PRACTICE","Work with fractions, signs, tables, decimals, and units",[["What is the rate of change between (3, 10) and (9, 22)?",["1/2","2","6","12"],1],["What is the rate of change between (2, 5) and (8, 8)?",["1/2","2","3","6"],0],["What is the rate of change between (−3, 12) and (1, 4)?",["−4","−2","2","8"],1],["A linear table shows x = 0, 3, 6 and y = 7, 7, 7. What is the rate of change?",["−7","0","3","undefined"],1],["What is the rate of change of y = (−3/4)x + 6?",["−6","−4/3","−3/4","3/4"],2],["What is the rate of change between (1.5, 2) and (3.5, 7)?",["1.5","2","2.5","5"],2],["A worker has earned $45 after 2 hours and $105 after 5 hours. What is the rate of change in earnings over this interval?",["$15 per hour","$20 per hour","$30 per hour","$60 per hour"],1],["A linear table shows x = −2, 2, 6 and y = 9, 3, −3. What is the rate of change?",["−3/2","−2/3","2/3","3/2"],0]]],["03 · EXAM-STYLE PRACTICE","Interpret rates and recover values in linear situations",[["A tank contains 84 liters at 3 minutes and 60 liters at 9 minutes. What is the rate of change of the amount of water?",["−6 liters per minute","−4 liters per minute","4 liters per minute","24 liters per minute"],1],["A cyclist has traveled 35 km after 0.5 hour and 95 km after 2.5 hours. What is the average rate of change in distance?",["24 km/h","30 km/h","35 km/h","60 km/h"],1],["A linear cost relationship gives a total cost of $38 for 4 items and $74 for 10 items. What is the rate of change of cost with respect to number of items?",["$4 per item","$6 per item","$8 per item","$12 per item"],1],["A quantity is modeled by C = 120 − 8t, where t is measured in minutes. Which statement correctly interprets the rate of change?",["C increases by 120 units each minute","C decreases by 120 units each minute","C increases by 8 units each minute","C decreases by 8 units each minute"],3],["A linear relationship has a rate of change of 5/2 and contains the point (2, 7). What is the y-value when x = 8?",["15","18","22","25"],2]]],["04 · CHALLENGE PROBLEMS","Use rate of change to recover missing values and extend patterns",[["A linear relationship has rate of change −3/4 and contains the points (−2, 11) and (6, y). What is y?",["3","5","7","9"],1],["A linear table contains the points (−5, 14), (−1, 8), and (3, 2). What is the y-value when x = 9?",["−9","−7","−4","1"],1]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
