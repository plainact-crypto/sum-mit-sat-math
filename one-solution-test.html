<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>One Solution — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">LESSON TEST</div><h1>One Solution</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Solve the system y = x + 4 and y = -x + 10.',c:['(2, 6)','(3, 7)','(4, 8)','(5, 9)'],a:1,why:'Set x + 4 = -x + 10. Then 2x = 6, so x = 3 and y = 7. Substitution gives 7 in both equations.'},{level:'EASY-MEDIUM',q:'Which system has exactly one solution?',c:['y = 3x + 2 and y = 3x - 5','y = -2x + 1 and 2y = -4x + 2','y = x + 6 and y = -3x + 2','2x + y = 8 and 4x + 2y = 16'],a:2,why:'The slopes are 1 and -3, so the lines are not parallel and intersect exactly once. The other choices are either parallel distinct lines or equivalent equations.'},{level:'MEDIUM',q:'Solve 2x + y = 11 and x - y = 1.',c:['(3, 5)','(4, 3)','(5, 1)','(6, -1)'],a:1,why:'From x - y = 1, y = x - 1. Substitute: 2x + x - 1 = 11, so 3x = 12 and x = 4; then y = 3.'},{level:'HARD',q:'A school club compares two printing plans: C = 5n + 18 and C = 8n + 6, where n is the number of posters. For what value of n do the plans cost the same?',c:['2','3','4','6'],a:2,why:'Set 5n + 18 = 8n + 6. Then 12 = 3n, so n = 4. Each plan then costs 38.'},{level:'HARD / EXAM-STYLE',q:'For what value of k does the system y = (k - 1)x + 4 and y = 2x - 5 have exactly one solution?',c:['1 only','3 only','Any real k except 3','Any real k'],a:2,why:'A unique solution requires different slopes. The slopes are k - 1 and 2, so k - 1 must not equal 2. Therefore k ≠ 3; every other real value gives exactly one intersection.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
