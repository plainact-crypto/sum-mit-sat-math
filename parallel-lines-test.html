<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Parallel Lines — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">LESSON TEST</div><h1>Parallel Lines</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers & Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Which equation is parallel to y = −7x + 2?',c:['y = −7x − 5','y = 7x − 5','y = −(1/7)x + 2','y = (1/7)x − 5'],a:0,why:'Parallel nonvertical lines have equal slopes. The given slope is −7, and only y = −7x − 5 has slope −7.'},{level:'EASY-MEDIUM',q:'A line parallel to 4x + 2y = 9 passes through (3, −1). Which equation represents it?',c:['4x + 2y = 10','4x + 2y = 14','2x + 4y = 2','4x − 2y = 14'],a:0,why:'A parallel line keeps the same x- and y-coefficients. At (3, −1), 4(3) + 2(−1) = 12 − 2 = 10.'},{level:'MEDIUM',q:'The line through (−2, 4) and (2, 12) is parallel to the line through (1, 5) and (5, k). What is k?',c:['11','12','13','14'],a:2,why:'The first slope is (12 − 4)/(2 − (−2)) = 8/4 = 2. Thus (k − 5)/(5 − 1) = 2, so k − 5 = 8 and k = 13.'},{level:'HARD',q:'For what value of a are 3x + 6y = 8 and ax − 4y = 1 parallel?',c:['−1','−2','2','4'],a:1,why:'The first line has slope −3/6 = −1/2. The second has slope a/4. Set a/4 = −1/2 to get a = −2.'},{level:'HARD / EXAM-STYLE',q:'A linear model has equation P = 1.8t + 12. A second model has a parallel graph and passes through (10, 35). Which equation is the second model?',c:['P = 1.8t + 17','P = 1.8t + 35','P = 2.3t + 12','P = −1.8t + 53'],a:0,why:'A parallel graph keeps slope 1.8. Write P = 1.8t + b and use (10, 35): 35 = 18 + b, so b = 17.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
