<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Compound Inequalities — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Inequalities</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Compound Inequalities</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">AND · OR · interval reasoning</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Solve and interpret basic compound inequalities",[["Solve 2 < x + 1 ≤ 6.",["1 < x ≤ 5","1 ≤ x < 5","3 < x ≤ 7","x < 1 or x ≥ 5"],0],["Which statement matches x < −3 or x ≥ 4?",["Values between −3 and 4","Values below −3 together with values at least 4","Values at most −3 together with values above 4","All real numbers"],1],["Solve −2 ≤ 3x + 1 < 10.",["−1 < x ≤ 3","−1 ≤ x < 3","−3 ≤ x < 1","x < −1 or x ≥ 3"],1]]],["CORE PRACTICE","Combine boundary solving with AND and OR logic",[["Solve 5 < 2x + 1 ≤ 13.",["2 < x ≤ 6","2 ≤ x < 6","3 < x ≤ 7","x ≤ 2 or x > 6"],0],["Solve −7 ≤ 2x − 1 < 9.",["−4 ≤ x < 4","−3 ≤ x < 5","−3 < x ≤ 5","x < −3 or x ≥ 5"],1],["Solve both 3x − 2 < 7 and x + 4 ≥ 2.",["−2 ≤ x < 3","−2 < x ≤ 3","x < −2 or x ≥ 3","x ≥ 3"],0],["Solve 2x + 5 ≤ 1 or 3x − 6 > 9.",["−2 ≤ x < 5","x ≤ −2 or x > 5","x < −2 or x ≥ 5","−2 < x ≤ 5"],1],["Solve −4 < −2x ≤ 8.",["−4 ≤ x < 2","−4 < x ≤ 2","−2 ≤ x < 4","x < −4 or x ≥ 2"],0],["Solve 1 ≤ (x − 2)/3 < 4.",["3 ≤ x < 12","5 ≤ x < 14","5 < x ≤ 14","−1 ≤ x < 10"],1],["Solve both 4x − 3 > 9 and 2x + 1 ≤ 11.",["3 < x ≤ 5","3 ≤ x < 5","x ≤ 3 or x > 5","x > 5"],0],["Solve x/2 − 1 ≤ 2 or 5 − x < 1.",["x ≤ 4","x > 6","4 < x ≤ 6","All real numbers"],3]]],["EXAM-STYLE PRACTICE","Translate ranges and constraints into compound inequalities",[["A training score starts at 50 and increases by 5 points per completed set. The target band is at least 70 but less than 90. If n is the number of sets, which range works?",["4 ≤ n < 8","4 < n ≤ 8","n < 4 or n ≥ 8","5 ≤ n < 9"],0],["A student starts with $100 and spends $8 on each workbook. The remaining balance must be more than $20 and at most $60. If b is the number of workbooks, which range satisfies both conditions?",["5 ≤ b < 10","5 < b ≤ 10","b < 5 or b ≥ 10","4 ≤ b < 9"],0],["A platform already carries 150 kg. Each crate adds 25 kg. The allowed total is from 300 kg through 500 kg, inclusive. What range of crate counts c satisfies the limit?",["5 ≤ c ≤ 13","6 ≤ c ≤ 14","6 < c < 14","c ≤ 6 or c ≥ 14"],1],["A contest advances entries whose rating is at most 12 or at least 18. Which compound inequality describes an advancing rating r?",["12 < r < 18","r ≤ 12 or r ≥ 18","r < 12 and r > 18","12 ≤ r ≤ 18"],1],["A sensor triggers an alert when its reading t is below −2 or above 6. Which set describes alert readings?",["−2 < t < 6","t ≤ −2 or t ≥ 6","t < −2 or t > 6","−2 ≤ t ≤ 6"],2]]],["CHALLENGE PROBLEMS","Handle sign reversal and multi-condition algebra carefully",[["Solve −3 < 2 − 5x ≤ 12.",["−2 ≤ x < 1","−2 < x ≤ 1","−1 ≤ x < 2","x < −2 or x ≥ 1"],0],["Solve both 2(3x − 1) ≤ 4x + 14 and −3(x − 5) < 6.",["3 < x ≤ 8","3 ≤ x < 8","x ≤ 3 or x > 8","x > 8"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
