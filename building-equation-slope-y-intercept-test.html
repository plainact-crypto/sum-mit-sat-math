<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Building an Equation from Slope and Y-Intercept — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">LESSON TEST</div><h1>Building an Equation from Slope and Y-Intercept</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers & Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'A line has slope 3 and y-intercept −4. Which equation represents the line?',c:['y = 3x − 4','y = −4x + 3','y = 3x + 4','y = −3x − 4'],a:0,why:'Use y = mx + b with m = 3 and b = −4, giving y = 3x − 4.'},{level:'EASY-MEDIUM',q:'A linear quantity starts at 12 and decreases by 2 for each 1-unit increase in x. Which equation models y?',c:['y = 2x + 12','y = −2x + 12','y = 12x − 2','y = −12x + 2'],a:1,why:'The initial value is 12 and the rate of change is −2, so y = −2x + 12.'},{level:'MEDIUM',q:'A line has y-intercept 6. When x increases by 4, y increases by 10. Which equation represents the line?',c:['y = (2/5)x + 6','y = (5/2)x + 6','y = (5/2)x − 6','y = −(5/2)x + 6'],a:1,why:'The slope is rise/run = 10/4 = 5/2. With b = 6, the equation is y = (5/2)x + 6.'},{level:'HARD',q:'A line has slope k + 2 and y-intercept 3k − 1. If its slope is 7, which equation represents the line?',c:['y = 7x + 14','y = 7x + 15','y = 5x + 14','y = 7x − 14'],a:0,why:'k + 2 = 7 gives k = 5. Then b = 3(5) − 1 = 14, so y = 7x + 14.'},{level:'HARD / EXAM-STYLE',q:'A storage container holds 250 liters initially and drains at a constant rate of 12.5 liters per minute. If V is the volume after t minutes, which equation models V?',c:['V = 12.5t + 250','V = −12.5t + 250','V = 250t − 12.5','V = −250t + 12.5'],a:1,why:'The initial value is 250 liters and the rate is −12.5 liters per minute, so V = −12.5t + 250.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
