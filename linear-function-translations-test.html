<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Linear Function Translations — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">LESSON TEST</div><h1>Linear Function Translations</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'The graph of y = 3x − 2 is shifted down 4 units. Which equation represents the translated line?',c:['y = 3x − 6','y = 3x + 2','y = 7x − 2','y = 3x − 4'],a:0,why:'A vertical shift down 4 subtracts 4 from every output: y = 3x − 2 − 4 = 3x − 6.'},{level:'EASY-MEDIUM',q:'Let f(x) = −2x + 5. Which equation represents a shift left 2 units?',c:['y = −2x + 1','y = −2x + 9','y = −2x + 3','y = 2x + 1'],a:0,why:'A left shift by 2 uses f(x + 2): −2(x + 2) + 5 = −2x + 1.'},{level:'MEDIUM',q:'A point (−1, 4) lies on a line. The line is shifted right 5 units and down 3 units. Which point lies on the translated line?',c:['(4, 1)','(−6, 1)','(4, 7)','(2, 1)'],a:0,why:'Right 5 changes x from −1 to 4. Down 3 changes y from 4 to 1, giving (4, 1).'},{level:'HARD',q:'Let f(x) = 4x + 3 and g(x) = f(x − 4) + 2. Which equation represents g?',c:['g(x) = 4x − 11','g(x) = 4x + 21','g(x) = 4x − 13','g(x) = 4x + 1'],a:0,why:'g(x) = 4(x − 4) + 3 + 2 = 4x − 16 + 5 = 4x − 11.'},{level:'HARD / EXAM-STYLE',q:'The line y = −2x + 7 is shifted right h units and then down 3 units. The final equation is y = −2x + 12. What is h?',c:['4','1','5/2','−4'],a:0,why:'After shifting right h, y = −2(x − h) + 7 = −2x + 2h + 7. Shifting down 3 gives y = −2x + 2h + 4. Set 2h + 4 = 12, so h = 4.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
