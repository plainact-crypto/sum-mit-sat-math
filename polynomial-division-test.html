<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Polynomial Division — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Polynomial Operations</div><div class="page-type">LESSON TEST</div><h1>Polynomial Division</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Divide: 18x⁴ ÷ 6x²',c:['3x²','3x⁶','12x²','3x'],a:0,why:'Divide coefficients and subtract exponents: 18÷6=3 and x⁴÷x²=x².'},{level:'EASY-MEDIUM',q:'Find the quotient: (x² + 7x + 10) ÷ (x + 5)',c:['x + 2','x + 5','x - 2','x² + 2'],a:0,why:'Factor x²+7x+10=(x+5)(x+2), then divide by x+5.'},{level:'MEDIUM',q:'What is the remainder when P(x)=2x³ - 3x + 7 is divided by x - 2?',c:['17','9','13','21'],a:0,why:'By the Remainder Theorem, P(2)=2(8)-3(2)+7=16-6+7=17.'},{level:'HARD',q:'A rectangle has area x² + 9x + 20 square meters and length x + 4 meters. What is its width?',c:['x + 5 m','x - 5 m','x + 4 m','x² + 5 m'],a:0,why:'Factor the area: x²+9x+20=(x+4)(x+5). Dividing by the length x+4 gives width x+5 meters.'},{level:'HARD / EXAM-STYLE',q:'The polynomial x³ + kx² - 4x + 8 is divisible by x + 2. What is k?',c:['-4','4','-2','2'],a:2,why:'Divisibility means P(-2)=0: -8+4k+8+8=4k+8=0, so k=-2.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};</script></body></html>
