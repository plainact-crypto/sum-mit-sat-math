<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Linear Function Tables — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Linear Function Tables</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Read constant rates from tables",[["A table contains the points (0, 2) and (2, 8). What is the rate of change?",["3","4","2","6"],0],["A table contains (1, 5), (3, 1), and (6, −5). Does it represent a linear function?",["Yes, because the slope is −2 in both intervals.","Yes, because the y-values decrease.","No, because the x-gaps are different.","No, because the slope changes from −2 to −3."],0],["A linear table contains (0, −4) and (2, 2). Which equation represents the function?",["y = 3x − 4","y = 2x − 4","y = 3x + 4","y = −3x − 4"],0]]],["CORE PRACTICE","Find slopes, equations, and missing values",[["A linear table contains (2, 7) and (5, 16). Which equation represents the function?",["y = 3x + 1","y = 3x − 1","y = 2x + 3","y = 9x − 11"],0],["A table contains (−1, 6), (2, 0), and (5, −6). What is the slope?",["−2","2","−6","−1/2"],0],["A linear table contains (0, 5), (4, 13), and (7, k). What is k?",["19","18","20","21"],0],["Which statement is true about the table with points (0, 1), (2, 5), and (5, 12)?",["It is not linear because the interval slopes are 2 and 7/3.","It is linear with slope 2.","It is linear with slope 7/3.","It is not linear because the x-values are unequal."],0],["A table contains (1, 2), (4, 8), and (10, 20). What is its rate of change?",["2","3","6","9/2"],0],["A linear table contains (−2, 9) and (2, 1). Which equation represents the function?",["y = −2x + 5","y = 2x + 5","y = −2x − 5","y = −4x + 1"],0],["A linear function has slope 1/2 and its table includes the point (6, 7). What is the y-intercept?",["4","10","1","7/2"],0],["A linear table contains (3, −1) and (7, 11). What is the output when x = 10?",["20","17","23","30"],0]]],["EXAM-STYLE PRACTICE","Apply table-based linear models",[["A service charge is $12 for 2 units and $27 for 5 units. The charge changes linearly. What is the charge for 8 units?",["$42","$39","$45","$47"],0],["A container holds 84 liters at 1 minute and 66 liters at 4 minutes. The amount changes linearly. How many liters remain at 7 minutes?",["48","54","42","36"],0],["A linear table contains (2, 11) and (6, 3). What is the x-intercept of the function?",["15/2","7","8","13/2"],0],["Table A contains (0, 4) and (3, 10). Table B contains (1, −1) and (5, 7). Which statement is correct?",["The two functions have the same rate of change, 2.","Table A has the greater rate of change.","Table B has the greater rate of change.","The rates of change are opposites."],0],["A linear table contains (1, 3), (4, 12), and (k, 21). What is k?",["7","6","8","9"],0]]],["CHALLENGE PROBLEMS","Solve hidden-input table conditions",[["A linear table contains (a, 4), (2, 10), and (6, 22). What is a?",["0","−2","1","4"],0],["A linear table contains (p, −8), (2, 4), and (5, 13). What is p?",["−2","−1","0","−3"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
