name: SUMMIT Female Chatterbox Voice Test

on:
  push:
    paths:
      - '.github/workflows/voice-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-female-voice-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chatterbox TTS
        run: |
          python -m pip install --upgrade pip
          pip install chatterbox-tts

      - name: Download official Chatterbox female reference
        run: |
          curl -L --fail --retry 3 \
            'https://storage.googleapis.com/chatterbox-demo-samples/prompts/female_random_podcast.wav' \
            -o female_reference.wav

      - name: Generate slower female narration
        run: |
          cat > /tmp/female_voice_test.py <<'PY'
          import os
          import torchaudio as ta
          from chatterbox.tts import ChatterboxTTS

          os.makedirs('voice-test-output', exist_ok=True)
          model = ChatterboxTTS.from_pretrained(device='cpu')

          text = (
              'Welcome to Summit SAT Math. In this lesson, we are solving one-step linear equations. '
              'The goal is simple: isolate the variable. If x plus seven equals twelve, subtract seven from both sides. '
              'That gives x equals five. On the SAT, identify the operation attached to the variable, then undo it carefully.'
          )

          wav = model.generate(
              text,
              audio_prompt_path='female_reference.wav',
              exaggeration=0.42,
              cfg_weight=0.48,
          )
          ta.save('voice-test-output/female_chatterbox_raw.wav', wav, model.sr)
          PY
          python /tmp/female_voice_test.py

      - name: Slow by 12 percent and master to MP3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -y \
            -i voice-test-output/female_chatterbox_raw.wav \
            -af 'atempo=0.88,loudnorm=I=-16:TP=-1.5:LRA=7' \
            -codec:a libmp3lame -b:a 160k \
            voice-test-output/female_chatterbox_slow.mp3

      - uses: actions/upload-artifact@v4
        with:
          name: summit-female-chatterbox-test
          path: voice-test-output/female_chatterbox_slow.mp3
          retention-days: 7
