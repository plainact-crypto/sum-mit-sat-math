name: SUMMIT Natural Voice Test

on:
  push:
    paths:
      - '.github/workflows/voice-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-voice-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Edge TTS
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Generate three natural narration voices
        run: |
          mkdir -p voice-test-output
          TEXT='Welcome to Summit SAT Math. In this lesson, we are solving one-step linear equations. The goal is simple: isolate the variable. If x plus seven equals twelve, subtract seven from both sides. That gives x equals five. On the SAT, identify the operation attached to the variable, then undo it carefully.'
          edge-tts --voice en-US-GuyNeural --rate=-5% --pitch=-2Hz --text "$TEXT" --write-media voice-test-output/voice_a_guy.mp3
          edge-tts --voice en-US-AndrewNeural --rate=-7% --pitch=-1Hz --text "$TEXT" --write-media voice-test-output/voice_b_andrew.mp3
          edge-tts --voice en-US-BrianNeural --rate=-6% --pitch=-2Hz --text "$TEXT" --write-media voice-test-output/voice_c_brian.mp3

      - uses: actions/upload-artifact@v4
        with:
          name: summit-natural-voice-tests
          path: voice-test-output/*.mp3
          retention-days: 7
