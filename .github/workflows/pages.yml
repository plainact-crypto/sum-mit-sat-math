name: Deploy SUMMIT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: npm run build
      - name: Ship mobile progress CSS
        shell: bash
        run: |
          cp mobile-progress-fix.css dist/mobile-progress-fix.css
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</head>'
          link = '<link rel="stylesheet" href="/mobile-progress-fix.css">'
          if link not in s:
              s = s.replace(marker, link + marker)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Adapt build for GitHub Pages project path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          base = '/sum-mit-sat-math'
          for p in Path('dist').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('href="/', f'href="{base}/')
              s = s.replace('src="/', f'src="{base}/')
              p.write_text(s, encoding='utf-8')
          p = Path('dist/app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('fetch("/curriculum.json")', f'fetch("{base}/curriculum.json")')
          s = s.replace('href="${l.base}', 'href="' + base + '${l.base}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
