name: Deploy SUMMIT broadcast function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/send-release-broadcast/**'
      - '.github/workflows/deploy-supabase-broadcast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secret
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Deploy send-release-broadcast
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy send-release-broadcast \
            --project-ref ymnawoeifbdnmxrsiaxa \
            --no-verify-jwt
