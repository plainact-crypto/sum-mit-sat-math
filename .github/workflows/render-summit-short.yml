name: Render SUMMIT Short

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Path to short spec JSON'
        required: true
        default: 'shorts/specs/compound-inequalities.json'
      voice:
        description: 'Kokoro voice (af_heart, am_adam, etc.)'
        required: false
        default: 'af_heart'
  push:
    branches: [main]
    paths:
      - 'shorts/specs/**'
      - 'shorts/render_short.py'
      - 'shorts/requirements.txt'
      - '.github/workflows/render-summit-short.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r shorts/requirements.txt
          pip install google-api-python-client google-auth google-auth-httplib2

      - name: Render short
        id: render_short
        run: |
          mkdir -p shorts/output
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SPEC="${{ github.event.inputs.spec }}"
            VOICE="${{ github.event.inputs.voice || 'af_heart' }}"
          else
            SPEC="$(git diff-tree --no-commit-id --name-only -r HEAD | grep '^shorts/specs/.*\.json$' | head -n 1)"
            VOICE="af_heart"
            if [ -z "$SPEC" ]; then
              echo "No short spec changed in this push; skipping render."
              echo "rendered=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Rendering spec: $SPEC"
          echo "Voice: $VOICE"
          echo "SPEC_PATH=$SPEC" >> "$GITHUB_ENV"
          python shorts/render_short.py "$SPEC" \
            --voice "$VOICE" \
            --out shorts/output/summit-short.mp4
          echo "rendered=true" >> "$GITHUB_OUTPUT"

      - name: Upload MP4 artifact
        if: ${{ steps.render_short.outputs.rendered == 'true' && hashFiles('shorts/output/summit-short.mp4') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: summit-short-mp4
          path: shorts/output/summit-short.mp4
          retention-days: 14

      - name: Upload private test to YouTube
        if: ${{ steps.render_short.outputs.rendered == 'true' && hashFiles('shorts/output/summit-short.mp4') != '' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          required = ["YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing GitHub secrets: {', '.join(missing)}")

          spec_path = os.environ.get("SPEC_PATH")
          if not spec_path or not Path(spec_path).is_file():
              raise SystemExit(f"Spec file not found: {spec_path}")

          spec = json.loads(Path(spec_path).read_text(encoding="utf-8"))
          title = str(spec.get("title") or "SUMMIT Math Short").strip()
          if "#Shorts" not in title:
              title = f"{title} #Shorts"
          title = title[:100]
          lesson_url = str(spec.get("lesson_url") or "https://summit.plain-act.com").strip()
          description = (
              "A concise math lesson from SUMMIT.\n\n"
              f"Full lesson: {lesson_url}\n\n"
              "#Math #Shorts #SUMMIT"
          )

          creds = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )
          youtube = build("youtube", "v3", credentials=creds, cache_discovery=False)
          media = MediaFileUpload(
              "shorts/output/summit-short.mp4",
              mimetype="video/mp4",
              resumable=True,
              chunksize=-1,
          )
          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": title,
                      "description": description,
                      "categoryId": "27"
                  },
                  "status": {
                      "privacyStatus": "private",
                      "selfDeclaredMadeForKids": False
                  }
              },
              media_body=media,
          )
          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"YouTube upload progress: {int(status.progress() * 100)}%")
          video_id = response["id"]
          print(f"YOUTUBE_VIDEO_ID={video_id}")
          print(f"Private test URL: https://youtu.be/{video_id}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## YouTube private test upload\n")
              f.write(f"- Video ID: `{video_id}`\n")
              f.write(f"- URL: https://youtu.be/{video_id}\n")
              f.write("- Privacy: `private`\n")
          PY

      - name: Persist MP4 for social publishing
        if: ${{ steps.render_short.outputs.rendered == 'true' && hashFiles('shorts/output/summit-short.mp4') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp shorts/output/summit-short.mp4 /tmp/summit-short.mp4
          git reset --hard HEAD
          git pull --rebase origin main
          cp /tmp/summit-short.mp4 shorts/output/summit-short.mp4
          git add -f shorts/output/summit-short.mp4
          if git diff --cached --quiet; then
            echo "Rendered MP4 unchanged; nothing to commit."
          else
            git commit -m "Store rendered SUMMIT short [skip ci]"
            git push origin HEAD:main
          fi
