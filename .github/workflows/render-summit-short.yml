name: Render SUMMIT Short

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Path to short spec JSON'
        required: true
        default: 'shorts/specs/slope-from-two-points.json'
      voice:
        description: 'Kokoro voice (af_heart, am_adam, etc.)'
        required: false
        default: 'am_adam'
  push:
    branches: [main]
    paths:
      - 'shorts/specs/**'
      - 'shorts/render_short.py'
      - 'shorts/requirements.txt'
      - '.github/workflows/render-summit-short.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r shorts/requirements.txt

      - name: Render short
        run: |
          mkdir -p shorts/output
          SPEC="${{ github.event.inputs.spec || 'shorts/specs/slope-from-two-points.json' }}"
          VOICE="${{ github.event.inputs.voice || 'am_adam' }}"
          python shorts/render_short.py "$SPEC" \
            --voice "$VOICE" \
            --out shorts/output/summit-short.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: summit-short-mp4
          path: shorts/output/summit-short.mp4
          retention-days: 14

      - name: Persist MP4 for social publishing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -f shorts/output/summit-short.mp4
          if git diff --cached --quiet; then
            echo "Rendered MP4 unchanged; nothing to commit."
          else
            git commit -m "Store rendered SUMMIT short [skip ci]"
            git push origin HEAD:main
          fi
