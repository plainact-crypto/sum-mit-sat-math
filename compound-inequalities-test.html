<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Compound Inequalities — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Inequalities</div><div class="page-type">LESSON TEST</div><h1>Compound Inequalities</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Solve: 2 < x + 1 ≤ 6',c:['1 < x ≤ 5','1 ≤ x < 5','3 < x ≤ 7','x ≤ 1 or x > 5'],a:0,why:'Subtract 1 from all three parts: 1 < x ≤ 5.'},{level:'EASY-MEDIUM',q:'Solve: x - 4 < -2 or x + 1 ≥ 6',c:['x < 2 or x ≥ 5','x > 2 and x ≤ 5','2 < x < 5','x ≤ 2 or x > 5'],a:0,why:'The first inequality gives x < 2. The second gives x ≥ 5. Because the connector is or, take the union: x < 2 or x ≥ 5.'},{level:'MEDIUM',q:'Solve: -6 ≤ 2x + 4 < 10',c:['-5 ≤ x < 3','-1 ≤ x < 7','-5 < x ≤ 3','x ≤ -5 or x > 3'],a:0,why:'Subtract 4: -10 ≤ 2x < 6. Divide all parts by 2: -5 ≤ x < 3.'},{level:'HARD',q:'Solve: 5 - 3x > 11 and 2x + 1 ≤ 9',c:['x < -2','x ≤ 4','-2 < x ≤ 4','No solution'],a:0,why:'From 5 - 3x > 11, we get -3x > 6, so x < -2 after reversing the sign. The second inequality gives x ≤ 4. Their intersection is x < -2.'},{level:'HARD / EXAM-STYLE',q:'A school club can spend at least $84 but no more than $132 on identical notebooks costing $12 each. Which compound inequality describes the possible whole-number values of n, the number of notebooks?',c:['7 ≤ n ≤ 11','7 < n < 11','n ≤ 7 or n ≥ 11','84 ≤ n ≤ 132'],a:0,why:'The cost condition is 84 ≤ 12n ≤ 132. Divide all three parts by 12: 7 ≤ n ≤ 11. The endpoints are included because spending exactly $84 or $132 is allowed.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
