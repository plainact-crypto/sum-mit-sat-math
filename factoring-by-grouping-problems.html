<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Factoring by Grouping — Practice Problems | SUMMIT MATH</title></head><body><main class="page-shell"><section class="lesson-card"><div class="crumb">Advanced Math · Factoring</div><div class="page-type">PRACTICE PROBLEMS</div><div class="lesson-title">Factoring by Grouping</div><p>18 original questions · Easy → Challenge</p><div id="sets"></div><a href="../explanation/">← Back to Explanation</a></section></main><script>const groups=[["SKILL CHECK",[["Factor completely: x³ + 3x² + 2x + 6",["(x + 3)(x² + 2)","(x + 2)(x² + 3)","(x + 3)(x² − 2)","(x − 3)(x² + 2)"],0],["Factor completely: x³ − 4x² + 2x − 8",["(x − 4)(x² + 2)","(x + 4)(x² − 2)","(x − 2)(x² + 4)","(x − 4)(x² − 2)"],0],["Factor completely: 2x³ + 6x² + x + 3",["(x + 3)(2x² + 1)","(x + 1)(2x² + 3)","(x − 3)(2x² − 1)","(2x + 3)(x² + 1)"],0]]],["CORE PRACTICE",[["Factor: 3x³ − 6x² + 5x − 10",["(x − 2)(3x² + 5)","(x + 2)(3x² − 5)","(3x − 2)(x² + 5)","(x − 5)(3x² + 2)"],0],["Factor: 4x³ + 8x² − 3x − 6",["(x + 2)(4x² − 3)","(x − 2)(4x² + 3)","(2x + 3)(2x² − 2)","(x + 3)(4x² − 2)"],0],["Factor: 6x³ − 9x² + 4x − 6",["(2x − 3)(3x² + 2)","(3x − 2)(2x² + 3)","(2x + 3)(3x² − 2)","(x − 3)(6x² + 2)"],0],["Factor completely: x³ + x² − 9x − 9",["(x + 1)(x − 3)(x + 3)","(x − 1)(x − 3)(x + 3)","(x + 1)(x − 9)","(x + 3)(x² − 3)"],0],["Factor: 2x³ − 8x² + 3x − 12",["(x − 4)(2x² + 3)","(x + 4)(2x² − 3)","(2x − 4)(x² + 3)","(x − 3)(2x² + 4)"],0],["Factor: 5a³ + 10a² + 3a + 6",["(a + 2)(5a² + 3)","(a + 3)(5a² + 2)","(a − 2)(5a² − 3)","(5a + 2)(a² + 3)"],0],["After reordering, factor 3m³ + 6m + 2m² + 4",["(3m + 2)(m² + 2)","(m + 2)(3m² + 2)","(3m − 2)(m² − 2)","(m + 3)(3m² + 4)"],0],["Factor completely: x³ − 5x² − 4x + 20",["(x − 5)(x − 2)(x + 2)","(x + 5)(x − 2)(x + 2)","(x − 5)(x² + 4)","(x − 4)(x − 5)(x + 1)"],0]]],["EXAM-STYLE PRACTICE",[["Which expression is equivalent to the complete factorization of 2x³ + 8x² + 3x + 12?",["(x + 4)(2x² + 3)","(x + 3)(2x² + 4)","(2x + 3)(x² + 4)","(x − 4)(2x² − 3)"],0],["Factor completely: x³ + 2x² − 16x − 32",["(x + 2)(x − 4)(x + 4)","(x − 2)(x − 4)(x + 4)","(x + 2)(x² + 16)","(x + 4)(x² − 8)"],0],["If x³ + kx² + 4x + 4k factors as (x + 3)(x² + 4), what is k?",["3","4","7","12"],0],["Which factorization matches 6x³ + 9x² + 4x + 6?",["(2x + 3)(3x² + 2)","(3x + 2)(2x² + 3)","(2x − 3)(3x² − 2)","(x + 3)(6x² + 2)"],0],["Factor: 4x³ − 12x² + x − 3",["(x − 3)(4x² + 1)","(x + 3)(4x² − 1)","(4x − 3)(x² + 1)","(x − 1)(4x² − 3)"],0]]],["CHALLENGE PROBLEMS",[["Factor completely: x⁵ + x⁴ − 16x − 16",["(x + 1)(x − 2)(x + 2)(x² + 4)","(x − 1)(x − 2)(x + 2)(x² + 4)","(x + 1)(x² − 4)²","(x + 4)(x⁴ − 4)"],0],["Factor completely: 4x⁵ − 8x⁴ − 9x + 18",["(x − 2)(2x² − 3)(2x² + 3)","(x + 2)(2x² − 3)(2x² + 3)","(x − 2)(4x² − 3)(x² + 3)","(2x − 3)(2x + 3)(x³ − 2)"],0]]]];let n=0,root=document.getElementById('sets');groups.forEach(g=>{let s=document.createElement('section');s.className='lesson-section';s.innerHTML='<h2>'+g[0]+'</h2>';g[1].forEach(q=>{n++;s.innerHTML+='<div class="question"><b>'+n+'. '+q[0]+'</b><ol type="A">'+q[1].map(x=>'<li>'+x+'</li>').join('')+'</ol></div>'});root.appendChild(s)});if(n!==18||groups[0][1].length!==3||groups[1][1].length!==8||groups[2][1].length!==5||groups[3][1].length!==2)throw Error('3/8/5/2 required');</script></body></html>
