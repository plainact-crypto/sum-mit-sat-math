<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Quadratic Formula — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Quadratic Equations</div><div class="page-type">LESSON TEST</div><h1>Quadratic Formula</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'For x² − 4x − 5 = 0, what is the discriminant?',c:['36','16','−4','20'],a:0,why:'With a=1, b=−4, c=−5, the discriminant is b²−4ac=16−4(1)(−5)=36.'},{level:'EASY-MEDIUM',q:'Solve 2x² + x − 3 = 0 using the quadratic formula.',c:['x = 1 or x = −3/2','x = −1 or x = 3/2','x = 3 or x = −1/2','x = 1/2 or x = −3'],a:0,why:'x=[−1±√(1+24)]/4=[−1±5]/4, so x=1 or x=−3/2. Both values satisfy the original equation.'},{level:'MEDIUM',q:'Solve exactly: 3x² − 2x − 4 = 0.',c:['x = (1 ± √13)/3','x = (−1 ± √13)/3','x = (2 ± √13)/3','x = (1 ± √7)/3'],a:0,why:'x=[2±√(4+48)]/6=[2±2√13]/6=(1±√13)/3.'},{level:'HARD',q:'The equation x² + kx + 9 = 0 has exactly one real solution and k < 0. What is k?',c:['−6','6','−3','−9'],a:0,why:'Exactly one real solution requires discriminant 0: k²−36=0, so k=±6. The condition k<0 gives k=−6.'},{level:'HARD / EXAM-STYLE',q:'A height model is h = −5t² + 20t + 25, where h is in meters and t is in seconds. When does the object reach the ground?',c:['5 seconds','4 seconds','1 second','6 seconds'],a:0,why:'Set h=0: −5t²+20t+25=0. Divide by −5 to get t²−4t−5=0, whose roots are 5 and −1. Time must be nonnegative, so t=5 seconds.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};</script></body></html>
