<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Testing Points in a System — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Systems of Linear Inequalities</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Testing Points in a System</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Substitute · compare · verify every inequality</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Test a point in every inequality",[["Which point satisfies both y ≥ x + 1 and y ≤ 5?",["(2, 4)","(4, 4)","(0, 0)","(5, 7)"],0],["Which point satisfies x + y < 6 and x ≥ 1?",["(2, 3)","(0, 4)","(4, 3)","(1, 5)"],0],["Which point satisfies both y > −x + 2 and y < x + 4?",["(0, 3)","(0, 2)","(2, 7)","(−3, 0)"],0]]],["CORE PRACTICE","Substitute coordinates and check all conditions",[["Which point satisfies 2x + y ≤ 8 and y ≥ x − 1?",["(2, 3)","(3, 3)","(4, 1)","(1, −2)"],0],["Which system is satisfied by the point (−1, 2)?",["y < x + 1 and y > −x + 4","y ≥ x + 2 and y ≤ −x + 2","y ≤ x − 2 and y ≥ 3","x ≥ 0 and y ≤ 0"],1],["A point lies on the line y = 2x + 1. Which statement must be true if one condition in a system is y > 2x + 1?",["The point always satisfies the condition","The point satisfies it only when x is positive","The point does not satisfy the strict inequality","The point satisfies it only when y is positive"],2],["When testing (0, 0) in y ≤ 3x + 4 and y > −x − 2, what conclusion is correct?",["It satisfies both inequalities","It satisfies only the first inequality","It satisfies only the second inequality","It satisfies neither inequality"],0],["Which point is in the system x ≥ 0, y ≥ 0, and x + y ≤ 7?",["(3, 4)","(−1, 4)","(5, 4)","(2, −1)"],0],["Which point satisfies 3x + 2y > 12 and y ≤ 4?",["(2, 4)","(1, 4)","(4, 5)","(0, 4)"],0],["Which system is satisfied by the point (1, −1)?",["y ≥ 2x and y ≤ −2","y ≤ 2x − 1 and y > −x − 1","y > x + 1 and y ≥ 0","x < 0 and y > 0"],1],["The point (4, 1) is tested in y ≥ x − 2 and x + y ≤ 6. Why is it not a solution of the system?",["It fails y ≥ x − 2 because 1 is not at least 2","It fails x + y ≤ 6 because 5 is greater than 6","It fails both inequalities","It satisfies both, so it is a solution"],0]]],["EXAM-STYLE PRACTICE","Use point testing in constraints and models",[["A club can choose x workshop seats and y lab seats with x + y ≤ 20 and 3x + 2y ≤ 48, where x and y are nonnegative. Which choice is allowed?",["(8, 10)","(12, 8)","(10, 12)","(16, 2)"],0],["Which point satisfies y ≥ 0.5x + 2 and y ≤ −x + 8?",["(4, 4)","(6, 4)","(2, 2)","(5, 6)"],0],["Which point satisfies x > 1, y ≥ 2, and 2x + y < 9?",["(2, 3)","(1, 3)","(3, 3)","(4, 2)"],0],["The point (2, 5) must satisfy y ≥ mx + 1 and y ≤ 7. What is the greatest integer value of m that works?",["0","1","2","3"],2],["Which point satisfies x − 2y ≤ −3 and 3x + y > 5?",["(2, 3)","(1, 2)","(0, 2)","(3, 0)"],0]]],["CHALLENGE PROBLEMS","Track strict boundaries and parameters carefully",[["The point (2, 5) must satisfy y ≥ 2x + k and y ≤ −x + 10. What is the greatest integer value of k that works?",["0","1","2","3"],1],["For the system y > x − 2 and y ≤ −2x + 7, set x = 2. How many integer y-values satisfy both inequalities?",["0","1","2","3"],3]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});if(n!==18||groups[0][2].length!==3||groups[1][2].length!==8||groups[2][2].length!==5||groups[3][2].length!==2)throw new Error('Problems format must be exactly 3/8/5/2 = 18 questions');document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
