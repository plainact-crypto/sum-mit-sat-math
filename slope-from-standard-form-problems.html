<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Slope from Standard Form — Practice Problems | SUMMIT SAT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Slope from Standard Form</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[["01 · SKILL CHECK","Use m = −A/B for equations in standard form",[["What is the slope of 3x + 4y = 20?",["3/4","−3/4","−4/3","4/3"],1],["What is the slope of −5x + 2y = 8?",["−5/2","−2/5","2/5","5/2"],3],["What is the slope of 7x − y = 9?",["−7","−1/7","1/7","7"],3]]],["02 · CORE PRACTICE","Track signs, simplify fractions, and recognize horizontal and vertical lines",[["What is the slope of 8x + 4y = 12?",["−2","2","−1/2","1/2"],0],["What is the slope of −6x − 3y = 15?",["−2","2","−1/2","1/2"],0],["What is the slope of x + 5y = 30?",["−5","−1/5","1/5","5"],1],["What is the slope of 9x − 12y = 24?",["−4/3","−3/4","3/4","4/3"],2],["What is the slope of 2y = 18?",["0","2","9","undefined"],0],["What is the slope of 5x = 25?",["0","1/5","5","undefined"],3],["What is the slope of 0.6x + 0.3y = 4.2?",["−2","−1/2","1/2","2"],0],["What is the slope of (3/2)x − (9/4)y = 6?",["−3/2","−2/3","2/3","3/2"],2]]],["03 · SAT-STYLE PRACTICE","Interpret slope and recover coefficients from standard-form equations",[["A relationship between x and y is modeled by 4x + 2y = 100. If x increases by 1, how does y change?",["y increases by 2","y decreases by 2","y increases by 1/2","y decreases by 1/2"],1],["A temperature model is 5t + 2T = 60, where t is time in hours and T is temperature in degrees. What is the slope of T with respect to t?",["−5/2 degrees per hour","−2/5 degrees per hour","5/2 degrees per hour","2/5 degrees per hour"],0],["Which equation represents a line with slope 3/4?",["3x + 4y = 8","4x + 3y = 8","3x − 4y = 8","4x − 3y = 8"],2],["The line ax + 6y = 18 has slope −2/3. What is a?",["−4","−2","2","4"],3],["The line 2x + ky = 14 has slope 1/4. What is k?",["−8","−2","2","8"],0]]],["04 · CHALLENGE PROBLEMS","Use slope conditions to solve for unknown parameters",[["The line (2p − 1)x + (p + 3)y = 10 has slope −1. What is p?",["−4","1","3","4"],3],["The line (q + 2)x − (q − 1)y = 8 has undefined slope. What is q?",["−2","0","1","2"],2]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)};</script></body></html>
