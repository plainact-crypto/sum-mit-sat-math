<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Greatest Common Factor — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Factoring</div><div class="page-type">LESSON TEST</div><h1>Greatest Common Factor</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Factor completely: 18x + 24',c:['6(3x + 4)','3(6x + 8)','2(9x + 12)','6(3x + 6)'],a:0,why:'The greatest common factor of 18x and 24 is 6. Dividing both terms by 6 gives 3x + 4.'},{level:'EASY-MEDIUM',q:'Factor completely: 21a²b - 14ab² + 35ab',c:['7ab(3a - 2b + 5)','7a(3ab - 2b² + 5b)','14ab(3a - b + 5)','7ab(3a - 2b + 35)'],a:0,why:'The coefficient GCF is 7, and every term contains ab. Dividing term by term gives 3a - 2b + 5.'},{level:'MEDIUM',q:'What is the GCF of 48m⁵n³ and 72m²n⁶?',c:['24m²n³','24m⁵n⁶','12m²n³','24m²n⁶'],a:0,why:'gcd(48,72)=24. For each variable, use the smaller exponent: m² and n³.'},{level:'HARD',q:'A rectangle has area 30x² + 45x square units and width 15x units. What is its length?',c:['2x + 3 units','15x(2x + 3) units','2x² + 3x units','30x + 45 units'],a:0,why:'Factor the area: 30x² + 45x = 15x(2x + 3). Dividing by the width 15x gives length 2x + 3 units.'},{level:'HARD / EXAM-STYLE',q:'The GCF of 54x⁵y³ and 72x²yᵏ is 18x²y³. What condition must k satisfy?',c:['k = 2','k ≥ 3','k = 3 only','k ≤ 3'],a:1,why:'The y-exponent in the GCF is min(3,k). For it to equal 3, k must be at least 3. Also gcd(54,72)=18 and min(5,2)=2, so the stated coefficient and x-part are consistent.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};</script></body></html>
