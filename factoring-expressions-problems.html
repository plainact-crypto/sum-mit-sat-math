<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Factoring Expressions — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Advanced Math · Equivalent Expressions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Factoring Expressions</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">GCF · variables · reverse distribution</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Factor out the greatest common numerical factor",[["Factor completely: 8x + 12",["4(2x + 3)","2(4x + 6)","4(2x + 12)","8(x + 4)"],0],["Factor completely: 15y - 25",["5(3y - 5)","5(3y - 25)","3(5y - 5)","15(y - 10)"],0],["Factor completely: 18a + 24",["6(3a + 4)","3(6a + 8)","6(3a + 24)","2(9a + 24)"],0]]],["CORE PRACTICE","Factor numerical and variable GCFs",[["Factor completely: 12x² + 18x",["6x(2x + 3)","6(2x² + 3x)","3x(4x + 6)","6x(2x + 18)"],0],["Factor completely: 20m³ - 15m²",["5m²(4m - 3)","5m(4m² - 3m)","10m²(2m - 3)","5m²(4m - 15)"],0],["Factor completely: 14ab + 21a",["7a(2b + 3)","7(2ab + 3a)","7a(2b + 21)","14a(b + 7)"],0],["Factor completely: 16p²q + 24pq²",["8pq(2p + 3q)","8p(2pq + 3q²)","4pq(4p + 6q)","8pq(2p + 24q)"],0],["Factor completely: 9x²y - 6xy² + 3xy",["3xy(3x - 2y + 1)","3x(3xy - 2y² + y)","3xy(3x - 2y)","xy(9x - 6y + 3)"],0],["Factor with a negative GCF so the first term inside is positive: -10t² + 25t",["-5t(2t - 5)","5t(-2t + 5)","-5(2t² - 5t)","-10t(t - 5)"],0],["Which is the complete GCF factorization of 24r³s² + 36r²s³?",["12r²s²(2r + 3s)","6r²s²(4r + 6s)","12rs(2r²s + 3rs²)","12r²s(2rs + 3s²)"],0],["Factor completely: 35u²v - 49uv²",["7uv(5u - 7v)","7u(5uv - 7v²)","uv(35u - 49v)","7uv(5u + 7v)"],0]]],["EXAM-STYLE PRACTICE","Recognize equivalent factored forms in algebra and context",[["Which expression is equivalent to 18x + 30 and is factored completely?",["6(3x + 5)","3(6x + 10)","2(9x + 15)","6(3x + 30)"],0],["A rectangle has area 12x² + 20x. If one side is 4x, which expression gives the other side?",["3x + 5","3x + 20","8x + 16","12x + 5"],0],["Factor completely: 27a³b² - 18a²b³",["9a²b²(3a - 2b)","9ab(3a²b - 2ab²)","3a²b²(9a - 6b)","9a²b(3ab - 2b²)"],0],["For x ≠ 0, which expression shows the greatest common factor of 32x⁴ + 48x³?",["16x³(2x + 3)","8x³(4x + 6)","16x²(2x² + 3x)","16x³(2x + 48)"],0],["A school club collects 24a dollars from one activity and 36b dollars from another. Which factored expression represents the total using the greatest common numerical factor?",["12(2a + 3b)","6(4a + 6b)","12(2a + 36b)","24(a + 12b)"],0]]],["CHALLENGE PROBLEMS","Use multi-variable GCFs and verify by distribution",[["Factor completely: -42x³y² + 56x²y³ - 14x²y²",["-14x²y²(3x - 4y + 1)","14x²y²(-3x + 4y - 1)","-7x²y²(6x - 8y + 2)","-14xy(3x²y - 4xy² + xy)"],0],["Which factorization is complete for 45m⁴n³ - 30m³n⁴ + 75m³n³?",["15m³n³(3m - 2n + 5)","5m³n³(9m - 6n + 15)","15m²n³(3m² - 2mn + 5m)","15m³n²(3mn - 2n² + 5n)"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});if(n!==18||groups[0][2].length!==3||groups[1][2].length!==8||groups[2][2].length!==5||groups[3][2].length!==2)throw new Error('Problems format must be exactly 3/8/5/2 = 18 questions');document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
