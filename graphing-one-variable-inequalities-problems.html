<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Graphing One-Variable Inequalities — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Inequalities</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Graphing One-Variable Inequalities</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Endpoints, direction, interpretation</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Match inequality symbols to endpoints and shading",[["Which number-line description represents x < 4?",["Open circle at 4, shade left","Closed circle at 4, shade left","Open circle at 4, shade right","Closed circle at 4, shade right"],0],["Which number-line description represents x ≥ −2?",["Open circle at −2, shade left","Closed circle at −2, shade right","Open circle at −2, shade right","Closed circle at −2, shade left"],1],["A graph has an open circle at 7 and is shaded to the right. Which inequality does it represent?",["x < 7","x ≤ 7","x > 7","x ≥ 7"],2]]],["CORE PRACTICE","Read, create, and verify one-variable inequality graphs",[["Which number-line description represents x ≤ 3?",["Closed circle at 3, shade left","Open circle at 3, shade left","Closed circle at 3, shade right","Open circle at 3, shade right"],0],["Which number-line description represents x > −5?",["Closed circle at −5, shade right","Open circle at −5, shade right","Open circle at −5, shade left","Closed circle at −5, shade left"],1],["A graph has a closed circle at 1 and is shaded to the left. Which inequality does it represent?",["x < 1","x ≤ 1","x > 1","x ≥ 1"],1],["A graph has an open circle at −4 and is shaded to the left. Which inequality does it represent?",["x < −4","x ≤ −4","x > −4","x ≥ −4"],0],["Which value is included in the solution set x ≥ 2?",["1.9","−2","2","0"],2],["Which value is included in the solution set x < 0?",["0","3","−3","0.5"],2],["Solve 2x + 3 ≤ 11, then choose its graph description.",["Open circle at 4, shade left","Closed circle at 4, shade left","Closed circle at 4, shade right","Open circle at 4, shade right"],1],["Solve −3x > 12, then choose its graph description.",["Open circle at −4, shade left","Closed circle at −4, shade left","Open circle at −4, shade right","Closed circle at −4, shade right"],0]]],["EXAM-STYLE PRACTICE","Translate real limits into inequalities and number-line graphs",[["A lab requires the room temperature t to be at most 18°C. Which graph description matches the condition?",["Closed circle at 18, shade left","Open circle at 18, shade left","Closed circle at 18, shade right","Open circle at 18, shade right"],0],["A qualifying score s must exceed 70. Which graph description is correct?",["Closed circle at 70, shade left","Open circle at 70, shade right","Closed circle at 70, shade right","Open circle at 70, shade left"],1],["A savings balance b must be at least $250. Which graph description is correct?",["Open circle at 250, shade left","Closed circle at 250, shade right","Open circle at 250, shade right","Closed circle at 250, shade left"],1],["A service lift can carry no more than 600 kg. If w is the load, which graph represents the rule?",["Closed circle at 600, shade left","Open circle at 600, shade left","Closed circle at 600, shade right","Open circle at 600, shade right"],0],["A timed task must be completed in less than 45 minutes. If t is the time, which graph is correct?",["Closed circle at 45, shade left","Open circle at 45, shade left","Closed circle at 45, shade right","Open circle at 45, shade right"],1]]],["CHALLENGE PROBLEMS","Combine solving with precise endpoint interpretation",[["Solve −2(3x − 1) ≥ 10. Which number-line description is correct?",["Closed circle at −4/3, shade left","Open circle at −4/3, shade left","Closed circle at −4/3, shade right","Open circle at −4/3, shade right"],0],["A number-line graph has a closed endpoint at −1.5. It includes 4 but does not include −2. Which inequality matches the graph?",["x ≤ −1.5","x < −1.5","x ≥ −1.5","x > −1.5"],2]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
