<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Solving One-Variable Inequalities — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Inequalities</div><div class="page-type">LESSON TEST</div><h1>Solving One-Variable Inequalities</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Solve: x + 7 > 12',c:['x > 5','x < 5','x > 19','x < 19'],a:0,why:'Subtract 7 from both sides: x > 5.'},{level:'EASY-MEDIUM',q:'Solve: -3x ≤ 12',c:['x ≤ -4','x ≥ -4','x ≤ 4','x ≥ 4'],a:1,why:'Divide both sides by -3. Because you divide by a negative number, reverse the inequality sign: x ≥ -4. Check x = 0: 0 ≤ 12 is true, and 0 is included in x ≥ -4.'},{level:'MEDIUM',q:'Solve: 4(2x - 1) > 3x + 11',c:['x > 3','x < 3','x > 15','x < 15'],a:0,why:'Expand and collect terms: 8x - 4 > 3x + 11, so 5x > 15 and x > 3. Substituting x = 4 gives 28 > 23, confirming the solution side.'},{level:'HARD',q:'A study center charges a $17 registration fee plus $8 per session. You can spend at most $65. What is the greatest whole number of sessions you can attend?',c:['5','6','7','8'],a:1,why:'Let s be the number of sessions. The budget condition is 17 + 8s ≤ 65. Then 8s ≤ 48, so s ≤ 6. The greatest whole number allowed is 6 sessions; 17 + 8(6) = 65.'},{level:'HARD / EXAM-STYLE',q:'Solve: 5 - 2(3x - 4) ≥ 3(x + 1)',c:['x ≥ 10/9','x ≤ 10/9','x ≥ 9/10','x ≤ 9/10'],a:1,why:'Expand: 5 - 6x + 8 ≥ 3x + 3, so 13 - 6x ≥ 3x + 3. Subtract 3 and add 6x: 10 ≥ 9x. Divide by positive 9 to get x ≤ 10/9. At x = 10/9 both sides are equal, so the endpoint is included.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
