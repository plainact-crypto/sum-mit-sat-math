<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Solving Graphically — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Solving Graphically</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Identify the intersection that solves both equations",[["If y = x + 1 and y = -x + 5 are graphed on the same axes, at which point do the lines intersect?",["(1, 4)","(2, 3)","(3, 2)","(4, 1)"],1],["What solution would the graphs of y = 2x - 1 and y = x + 2 show?",["(2, 3)","(3, 5)","(4, 7)","(5, 9)"],1],["The lines y = -x + 4 and y = 0.5x + 1 are drawn on one coordinate plane. What is their intersection?",["(1, 3)","(2, 2)","(3, 1)","(4, 0)"],1]]],["CORE PRACTICE","Connect intersections, slopes, and solution counts",[["Where do y = 3x - 4 and y = -x + 8 intersect?",["(2, 4)","(3, 5)","(4, 6)","(5, 7)"],1],["A graph shows y = 0.5x + 2 and y = -x + 8. Which ordered pair is the common point?",["(2, 3)","(3, 3.5)","(4, 4)","(6, 5)"],2],["What graphical solution is shared by y = -2x + 7 and y = x - 2?",["(2, 3)","(3, 1)","(4, -1)","(5, -3)"],1],["If y = (1/3)x + 2 and y = -(2/3)x + 5 are graphed, which point lies on both lines?",["(1, 7/3)","(2, 8/3)","(3, 3)","(6, 4)"],2],["The equations y = 4x + 1 and y = 4x - 6 are graphed together. How many solutions does the system have?",["No solutions","Exactly one solution","Exactly two solutions","Infinitely many solutions"],0],["One equation is 2y = 6x + 4. The other is y = 3x + 2. What will their graphs show?",["Parallel lines","Perpendicular lines","The same line, so infinitely many solutions","One intersection at (0, 2)"],2],["The equations x + y = 6 and y = 2x are graphed. What is the intersection?",["(1, 5)","(2, 4)","(3, 3)","(4, 2)"],1],["What point solves 2x - y = 1 and x + y = 8 when the two lines are graphed?",["(2, 3)","(3, 5)","(4, 4)","(5, 3)"],1]]],["EXAM-STYLE PRACTICE","Use graphical systems to interpret models and conditions",[["Two study-room plans have costs C = 15 + 4h and C = 27 + 2h, where h is the number of hours. If both lines are graphed with h on the horizontal axis, after how many hours are the costs equal?",["4","5","6","7"],2],["Two measured relationships are modeled by y = 1.5x + 3 and y = 0.5x + 9. The graphs meet at (x, y). What is x?",["3","4","6","12"],2],["A graph of two linear equations has exactly one intersection at (5, -2). What does that point represent for the system?",["Only x = 5 is a solution","Only y = -2 is a solution","The unique solution is (5, -2)","The system has infinitely many solutions"],2],["A test-style graphing question uses y = -0.25x + 7 and y = 0.5x + 1. At what point should the two lines intersect?",["(4, 6)","(6, 5.5)","(8, 5)","(10, 4.5)"],2],["One line is y = 2x + 5. A second line passes through (0, -1) and (3, 5). If the two lines are graphed, which statement is true?",["They intersect at (3, 5)","They are parallel and have no solution","They are the same line","They intersect on the y-axis"],1]]],["CHALLENGE PROBLEMS","Work with exact fractions and a parameter",[["Find the graphical solution of y = (3/4)x - 2 and y = -(1/2)x + 3.",["(2, -1/2)","(3, 1/4)","(4, 1)","(5, 7/4)"],2],["The graphs of y = kx + 4 and y = -2x + 10 intersect at (2, 6). What is k?",["-1","0","1","2"],2]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
