<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Standard Form — Practice Problems | SUMMIT SAT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Equations in Two Variables</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Standard Form</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[['01 · SKILL CHECK','Read A, B, and C directly from standard form',[['In 5x + 2y = 17, what are A, B, and C?',['A = 5, B = 2, C = 17','A = 5, B = 17, C = 2','A = 2, B = 5, C = 17','A = 5, B = 2, C = −17'],0],['In 7x − 4y = 9, what is B?',['4','−4','7','9'],1],['For 8y = 24, what is the coefficient A when the equation is written as Ax + By = C?',['0','1','8','24'],0]]],['02 · CORE PRACTICE','Recognize linear standard form and check ordered pairs',[['Which equation is linear and already written in standard form?',['3x + 2y = 11','x² + 2y = 11','xy + 2 = 11','1/x + 2y = 11'],0],['In −6x + 5y = −20, what is C?',['−20','−6','5','20'],0],['Does the ordered pair (2, 1) satisfy 4x + 3y = 11?',['Yes','No, the left side equals 10','No, the left side equals 12','No, the left side equals 14'],0],['Does the ordered pair (3, −2) satisfy 2x − y = 8?',['Yes','No, the left side equals 4','No, the left side equals 6','No, the left side equals 10'],0],['Which ordered pair satisfies x + 2y = 7?',['(1, 3)','(3, 1)','(5, 0)','(0, 2)'],0],['Which equation shows y = 5 in standard-form structure?',['0x + y = 5','x + 0y = 5','5x + y = 0','x + y = 5'],0],['For 9x = 27, what is B in Ax + By = C?',['0','1','9','27'],0],['Which equation has A = −2, B = 7, and C = 14?',['−2x + 7y = 14','2x − 7y = 14','−2x + 14y = 7','7x − 2y = 14'],0]]],['03 · SAT-STYLE PRACTICE','Model fixed totals and use standard-form equations',[['Adult tickets cost $15 each and student tickets cost $9 each. If x is the number of adult tickets and y is the number of student tickets, which equation represents $180 in total sales?',['15x + 9y = 180','9x + 15y = 180','15x + 9y = 24','24xy = 180'],0],['A store sells notebooks for $4 each and pens for $3 each. If x notebooks and y pens cost $42 total, which equation models the purchase?',['4x + 3y = 42','3x + 4y = 42','7x + y = 42','12xy = 42'],0],['The equation 2x + 5y = 40 represents a fixed total. If x = 5, what is y?',['4','5','6','7'],2],['A ticket booth uses 12x + 8y = 240 to represent total sales. If x = 10, what is y?',['10','12','15','20'],2],['A fundraiser sells two item types, modeled by 3x + 4y = 60. Which ordered pair could represent a combination that reaches exactly the total?',['(4, 12)','(8, 8)','(12, 4)','(16, 2)'],0]]],['04 · CHALLENGE PROBLEMS','Use substitution to determine an unknown coefficient',[['The ordered pair (3, 2) satisfies kx + 4y = 26. What is k?',['4','5','6','7'],2],['The ordered pair (−1, 2) satisfies 5x + by = 1. What is b?',['2','3','4','5'],1]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)};</script></body></html>
