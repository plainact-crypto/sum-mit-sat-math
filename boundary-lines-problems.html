<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Boundary Lines — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Inequalities</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Boundary Lines</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Equality boundaries · solid/dashed · intercepts</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[
["SKILL CHECK","Identify the boundary equation and line style",[
["For the inequality y > 2x − 3, which boundary should be graphed?",["y = 2x − 3, dashed","y = 2x − 3, solid","y = 2x + 3, dashed","x = 2y − 3, solid"],0],
["For 3x + y ≤ 9, what is the boundary line?",["3x + y = 9, dashed","3x + y = 9, solid","3x + y < 9, solid","y = 9, solid"],1],
["For x < −4, which boundary is correct?",["y = −4, dashed","x = −4, solid","x = −4, dashed","y = −4, solid"],2]
]],
["CORE PRACTICE","Connect boundary equations, line style, and key points",[
["For y ≥ −(1/2)x + 5, which boundary should be used?",["y = −(1/2)x + 5, solid","y = −(1/2)x + 5, dashed","y = (1/2)x + 5, solid","x = −(1/2)y + 5, solid"],0],
["For 2x − 3y > 12, which statement is correct?",["The boundary is 2x − 3y = 12 and is solid.","The boundary is 2x − 3y = 12 and is dashed.","The boundary is 2x − 3y > 12 and is dashed.","The boundary is 2x + 3y = 12 and is dashed."],1],
["Which boundary belongs to y < 4?",["x = 4, dashed","y = 4, solid","y = 4, dashed","x = 4, solid"],2],
["Which boundary belongs to x ≥ 2?",["x = 2, solid","y = 2, solid","x = 2, dashed","y = 2, dashed"],0],
["For 4x + 2y ≤ 8, which equivalent boundary form is correct?",["y = 2x + 4, solid","y = −2x + 4, solid","y = −2x + 8, dashed","y = 2x − 4, solid"],1],
["The boundary line is y = −3x + 6. What is its x-intercept?",["(−2, 0)","(0, 6)","(2, 0)","(6, 0)"],2],
["For 5x + 2y > 10, what is the y-intercept of the boundary, and what line style is used?",["(0, 2), solid","(0, 5), dashed","(5, 0), dashed","(0, 10), solid"],1],
["A boundary passes through (0, −1) and (3, 5), and the solution includes the line and lies on or below it. Which inequality matches?",["y ≤ 2x − 1","y ≥ 2x − 1","y < 2x + 1","y ≤ −2x − 1"],0]
]],
["EXAM-STYLE PRACTICE","Use boundary information in test-style representations and constraints",[
["For y < x + 4, which pair of intercepts lies on the boundary, and how should the line be drawn?",["(0, 4) and (−4, 0), dashed","(0, −4) and (4, 0), dashed","(0, 4) and (4, 0), solid","(0, −4) and (−4, 0), solid"],0],
["For 3x − 2y ≥ 6, which slope-intercept form describes the boundary and its style?",["y = −(3/2)x + 3, solid","y = (3/2)x − 3, dashed","y = (3/2)x − 3, solid","y = −(3/2)x − 3, solid"],2],
["For x + y < 7, which statement about the boundary is correct?",["It is solid through (0, 7) and (7, 0).","It is dashed through (0, 7) and (7, 0).","It is dashed through (0, −7) and (−7, 0).","It is the vertical line x = 7."],1],
["A capacity rule is 2x + y ≤ 10. Before deciding which region satisfies the rule, what boundary should be drawn?",["2x + y = 10, dashed","2x + y = 10, solid","2x + y < 10, solid","y = 10, solid"],1],
["A graph has the solid boundary y = −2x + 3, and the solution region is above the line. Which inequality matches?",["y > −2x + 3","y ≤ −2x + 3","y ≥ −2x + 3","y < 2x + 3"],2]
]],
["CHALLENGE PROBLEMS","Build and analyze boundaries from less direct information",[
["A strict inequality has a boundary through (−2, 5) and (4, −1). Which boundary equation and style are correct?",["y = −x + 3, dashed","y = x + 3, dashed","y = −x + 3, solid","y = −x − 3, dashed"],0],
["For −3x + 6y > 12, which description of the boundary is correct?",["y = (1/2)x + 2, dashed, with intercepts (−4, 0) and (0, 2)","y = −(1/2)x + 2, dashed, with intercepts (4, 0) and (0, 2)","y = (1/2)x + 2, solid, with intercepts (−4, 0) and (0, 2)","y = (1/2)x − 2, dashed, with intercepts (4, 0) and (0, −2)"],0]
]]
];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
