<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Perpendicular Lines — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">LESSON TEST</div><h1>Perpendicular Lines</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers & Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Which equation is perpendicular to y = 2x + 1?',c:['y = −(1/2)x + 4','y = (1/2)x + 4','y = −2x + 4','y = 2x − 4'],a:0,why:'The given slope is 2, so a perpendicular line has slope −1/2.'},{level:'EASY-MEDIUM',q:'A line perpendicular to 3x + y = 4 passes through (3, 2). Which equation represents it?',c:['y = (1/3)x + 1','y = −3x + 11','y = 3x − 7','y = −(1/3)x + 3'],a:0,why:'The given line has slope −3, so the perpendicular slope is 1/3. Using (3, 2), 2 = 1 + b, so b = 1.'},{level:'MEDIUM',q:'The line through (−1, 2) and (3, 10) is perpendicular to the line through (4, 5) and (8, k). What is k?',c:['1','2','3','7'],a:2,why:'The first slope is (10 − 2)/(3 − (−1)) = 8/4 = 2, so the perpendicular slope is −1/2. Then (k − 5)/(8 − 4) = −1/2, giving k − 5 = −2 and k = 3.'},{level:'HARD',q:'For what value of a are ax + 6y = 5 and 2x − y = 7 perpendicular?',c:['−3','2','3','6'],a:2,why:'The slopes are −a/6 and 2. Perpendicular slopes multiply to −1: (−a/6)(2) = −1, so a = 3.'},{level:'HARD / EXAM-STYLE',q:'A linear trend is modeled by y = 0.8x + 12. A second trend has a perpendicular graph and passes through (10, 5). Which equation represents the second trend?',c:['y = −1.25x + 17.5','y = 1.25x − 7.5','y = −0.8x + 13','y = 0.8x − 3'],a:0,why:'Since 0.8 = 4/5, the perpendicular slope is −5/4 = −1.25. Using (10, 5), 5 = −12.5 + b, so b = 17.5.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
