<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Reversing the Inequality Sign — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Inequalities</div><div class="page-type">LESSON TEST</div><h1>Reversing the Inequality Sign</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Solve: -4x > 20',c:['x > -5','x < -5','x > 5','x < 5'],a:1,why:'Divide both sides by -4 and reverse the inequality sign: x < -5. Check x = -6: 24 > 20 is true.'},{level:'EASY-MEDIUM',q:'Solve: 7 - 2x ≤ 15',c:['x ≤ -4','x ≥ -4','x ≤ 4','x ≥ 4'],a:1,why:'Subtract 7: -2x ≤ 8. Divide by -2 and reverse the sign: x ≥ -4. At x = -4, both sides equal 15, so the endpoint is included.'},{level:'MEDIUM',q:'Solve: -3(2x - 5) > 9',c:['x > 1','x < 1','x > -1','x < -1'],a:1,why:'Expand: -6x + 15 > 9, so -6x > -6. Divide by -6 and reverse the sign: x < 1. Substituting x = 0 gives 15 > 9.'},{level:'HARD',q:'A game score starts at 50 points and decreases by 6 points for each mistake. To qualify, the score must remain at least 20. What is the greatest whole number of mistakes allowed?',c:['4','5','6','7'],a:1,why:'Let m be the number of mistakes. The condition is 50 - 6m ≥ 20. Then -6m ≥ -30, so dividing by -6 reverses the sign: m ≤ 5. Five mistakes leave exactly 20 points.'},{level:'HARD / EXAM-STYLE',q:'Solve: 4 - 5(2x + 1) < 3x - 14',c:['x < 1','x > 1','x < -1','x > -1'],a:1,why:'Expand: 4 - 10x - 5 < 3x - 14, so -1 - 10x < 3x - 14. Add 14 and 10x: 13 < 13x, hence x > 1. For x = 2, the original inequality is -21 < -8, which is true.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
