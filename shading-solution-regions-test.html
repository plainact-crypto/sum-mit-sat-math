<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Shading Solution Regions — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Inequalities</div><div class="page-type">LESSON TEST</div><h1>Shading Solution Regions</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'For y > x + 1, which graph represents the solution?',c:['Dashed boundary y = x + 1; shade above','Solid boundary y = x + 1; shade above','Dashed boundary y = x + 1; shade below','Solid boundary y = x + 1; shade below'],a:0,why:'The strict sign > makes the boundary dashed, and y-values greater than the line are above it.'},{level:'EASY-MEDIUM',q:'For x ≤ -2, which region should be shaded?',c:['Left of the solid vertical line x = -2','Right of the solid vertical line x = -2','Left of the dashed vertical line x = -2','Below the solid horizontal line y = -2'],a:0,why:'x ≤ -2 includes the boundary x=-2, so the vertical line is solid and all smaller x-values lie to its left.'},{level:'MEDIUM',q:'For 2x + y ≥ 6, does the origin belong to the solution region?',c:['Yes, because 0 ≥ 6','No, because 0 ≥ 6 is false','Yes, because the boundary is solid','No, because the boundary is dashed'],a:1,why:'Substituting (0,0) gives 0 ≥ 6, which is false, so the origin is on the unshaded side.'},{level:'HARD',q:'A dashed line passes through (0,4) and (2,0), and the region above it is shaded. Which inequality matches?',c:['y > -2x + 4','y ≥ -2x + 4','y < -2x + 4','y > 2x + 4'],a:0,why:'The slope is (0-4)/(2-0)=-2 and the y-intercept is 4. Dashed means strict, and shading above means >.'},{level:'HARD / EXAM-STYLE',q:'A school has at most $180 for x notebooks costing $12 each and y folders costing $6 each. Which inequality describes the feasible nonnegative region?',c:['12x + 6y ≤ 180, with a solid boundary and shading toward the origin','12x + 6y ≥ 180, with a solid boundary and shading away from the origin','12x + 6y < 180, with a dashed boundary and shading toward the origin','12x + 6y > 180, with a dashed boundary and shading away from the origin'],a:0,why:'At most means ≤, so equality is included and the boundary is solid. The origin gives 0 ≤ 180, so the feasible side contains the origin.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
