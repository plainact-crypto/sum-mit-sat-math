<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>One Solution — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">PRACTICE PROBLEMS</div><h1>One Solution</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Recognize and solve systems with one solution",[["What is the solution to the system y = x + 2 and y = -x + 8?",["(2, 4)","(3, 5)","(4, 6)","(5, 3)"],1],["Which system has exactly one solution?",["y = 2x + 1 and y = 2x - 4","y = -3x + 5 and y = -3x + 5","y = x + 2 and y = -2x + 5","2x + y = 6 and 4x + 2y = 12"],2],["Solve: x + y = 9 and x - y = 3.",["(3, 6)","(5, 4)","(6, 3)","(7, 2)"],2]]],["CORE PRACTICE","Find the unique intersection algebraically",[["Solve: y = 2x + 1 and y = -x + 7.",["(1, 3)","(2, 5)","(3, 4)","(4, 9)"],1],["Solve: 2x + y = 11 and x - y = 1.",["(3, 5)","(4, 3)","(5, 1)","(6, -1)"],1],["Solve: 3x + 2y = 16 and x + 2y = 8.",["(2, 4)","(3, 2)","(4, 2)","(5, 1)"],2],["The lines y = 4x - 9 and y = x + 3 intersect at which point?",["(3, 4)","(4, 7)","(5, 11)","(6, 15)"],1],["Solve: x + 3y = 13 and 2x - y = 5.",["(2, 11/3)","(3, 10/3)","(4, 3)","(5, 8/3)"],2],["For the system 5x - y = 13 and 2x + y = 8, what is x?",["2","3","4","5"],1],["Which statement guarantees that two nonvertical linear equations have exactly one solution?",["They have equal slopes and different intercepts.","They have different slopes.","They have equal slopes and equal intercepts.","They both have positive y-intercepts."],1],["Solve: 0.5x + y = 6 and x - y = 3.",["(4, 4)","(5, 3.5)","(6, 3)","(7, 2.5)"],2]]],["EXAM-STYLE PRACTICE","Model and interpret unique intersections",[["A school club sells notebooks for $4 each plus a one-time delivery fee of $6. Another supplier charges $2 per notebook plus a $16 delivery fee. For how many notebooks are the total costs equal?",["3","4","5","6"],2],["Two savings plans are modeled by A = 15w + 40 and B = 25w. At what value of w are the balances equal?",["2","3","4","5"],2],["The system 2x + 3y = 18 and kx + 6y = 30 has exactly one solution. Which value of k would make that true?",["2","4","6","8"],0],["A line passes through (0, 7) and (4, 15). Another line is y = -x + 12. What is the x-coordinate of their intersection?",["1","5/3","2","7/3"],1],["A ticket plan costs C = 12n + 18. A second plan costs C = 15n + 6. What does the unique solution n = 4 represent?",["Both plans cost $4.","Both plans cost the same when 4 tickets are purchased.","The first plan is always cheaper by $4.","The second plan starts with a $4 fee."],1]]],["CHALLENGE PROBLEMS","Solve parameter and fractional systems",[["The system y = (a + 1)x - 2 and y = 5x + 6 has a unique solution at x = 2. What is a?",["4","5","6","7"],2],["Solve the system (2/3)x + y = 7 and x - (1/2)y = 4.",["(5, 11/3)","(6, 3)","(7, 7/3)","(8, 5/3)"],1]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
