<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Converting Between Forms — Lesson Test | SUMMIT SAT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Equations in Two Variables</div><div class="page-type">LESSON TEST</div><h1>Converting Between Forms</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers & Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Rewrite x + 2y = 10 in slope-intercept form.',c:['y = −(1/2)x + 5','y = (1/2)x + 5','y = −2x + 10','y = 5x − 1'],a:0,why:'2y = −x + 10, so y = −(1/2)x + 5.'},{level:'EASY-MEDIUM',q:'Rewrite y = −4x + 9 in standard form with a positive x coefficient.',c:['4x + y = 9','4x − y = 9','−4x + y = 9','x + 4y = 9'],a:0,why:'Add 4x to both sides: 4x + y = 9.'},{level:'MEDIUM',q:'Rewrite y − 3 = (1/2)(x − 4) in slope-intercept form.',c:['y = (1/2)x + 1','y = (1/2)x + 5','y = 2x − 5','y = −(1/2)x + 1'],a:0,why:'Distribute: y − 3 = (1/2)x − 2. Add 3 to get y = (1/2)x + 1.'},{level:'HARD',q:'A line is written as 3x + 2y = 14. Which point-slope equation uses the point (2, 4) on the line?',c:['y − 4 = −(3/2)(x − 2)','y − 2 = −(3/2)(x − 4)','y − 4 = (3/2)(x − 2)','y + 4 = −(2/3)(x + 2)'],a:0,why:'From 3x + 2y = 14, the slope is −3/2. Using (2,4): y − 4 = −(3/2)(x − 2).'},{level:'HARD / SAT-STYLE',q:'A delivery company models total cost by y = 12x + 40, where x is the number of miles. Which standard-form equation is equivalent and keeps the x coefficient positive?',c:['12x − y = −40','12x + y = 40','y − 12x = 40','40x − y = −12'],a:0,why:'Move y to the left side: 12x − y = −40.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
