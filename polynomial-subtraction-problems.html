<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Polynomial Subtraction — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Advanced Math · Polynomial Operations</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Polynomial Subtraction</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">distribute negatives · like terms · context</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Subtract by distributing the negative sign first",[["Subtract: (5x + 7) - (2x - 4)",["3x + 11","3x + 3","7x + 3","7x + 11"],0],["Subtract: (8y² + 3y) - (5y² - 2y)",["3y² + 5y","3y² + y","13y² + y","3y² - 5y"],0],["Subtract: (6a² - a + 9) - (2a² + 4a - 3)",["4a² - 5a + 12","4a² + 3a + 6","8a² - 5a + 6","4a² - 5a + 6"],0]]],["CORE PRACTICE","Track signs and align matching powers",[["Subtract: (7x³ + 2x - 5) - (3x³ - 6x + 1)",["4x³ + 8x - 6","4x³ - 4x - 4","10x³ - 4x - 6","4x³ + 8x + 4"],0],["Subtract: (4m² - 7m + 2) - (-3m² + 2m - 8)",["7m² - 9m + 10","m² - 5m - 6","7m² - 5m - 6","m² - 9m + 10"],0],["Subtract: (-2p³ + 5p² - p) - (4p³ - 3p² + 6p)",["-6p³ + 8p² - 7p","2p³ + 2p² + 5p","-6p³ + 2p² - 7p","2p³ + 8p² - 7p"],0],["Subtract: (x⁴ - 3x² + 7) - (2x³ + x² - 5)",["x⁴ - 2x³ - 4x² + 12","x⁴ + 2x³ - 2x² + 2","-x⁴ - 2x³ - 4x² + 12","x⁴ - 2x³ - 2x² + 2"],0],["Subtract: (2.5t² - 1.2t + 4) - (0.5t² + 0.8t - 3)",["2t² - 2t + 7","2t² - 0.4t + 1","3t² - 2t + 1","2t² + 2t + 7"],0],["Subtract: ((3/4)x² + (1/2)x - 1) - ((1/4)x² - (1/3)x + 2)",["(1/2)x² + (5/6)x - 3","x² + (1/6)x + 1","(1/2)x² + (1/6)x - 3","(1/2)x² - (5/6)x + 1"],0],["If P(x)=5x²+2x-6 and Q(x)=2x²-7x+1, find P(x)-Q(x).",["3x² + 9x - 7","7x² - 5x - 5","3x² - 5x - 7","7x² + 9x - 7"],0],["Subtract: (9r⁵ - 4r³ + 2r) - (6r⁵ + r³ - 5r)",["3r⁵ - 5r³ + 7r","3r⁵ - 3r³ - 3r","15r⁵ - 5r³ - 3r","3r⁵ + 5r³ + 7r"],0]]],["EXAM-STYLE PRACTICE","Use polynomial differences in test-style algebra and context",[["Which expression is equivalent to (6x² - 3x + 8) - (2x² + 5x - 4)?",["4x² - 8x + 12","4x² + 2x + 4","8x² - 8x + 4","4x² - 2x + 12"],0],["A storage tank contains (5x²+4x+20) liters before (2x²-x+7) liters are used. Which polynomial represents the amount remaining?",["3x² + 5x + 13 liters","3x² + 3x + 13 liters","7x² + 3x + 27 liters","3x² + 5x + 27 liters"],0],["For A(x)=3x³+2x²-5 and B(x)=-2x³+7x²-4x, what is A(x)-B(x)?",["5x³ - 5x² + 4x - 5","x³ + 9x² - 4x - 5","5x³ + 9x² - 4x - 5","x³ - 5x² + 4x - 5"],0],["A school's target is (8n²+3n+40) practice questions and a student has completed (5n²-2n+18). Which polynomial gives the number still to complete?",["3n² + 5n + 22","3n² + n + 22","13n² + n + 58","3n² + 5n + 58"],0],["If P(x)-Q(x)=4x³-x²+6x-2 and P(x)=7x³+2x²+x+5, which polynomial is Q(x)?",["3x³ + 3x² - 5x + 7","11x³ + x² + 7x + 3","3x³ + x² - 5x + 3","-3x³ - 3x² + 5x - 7"],0]]],["CHALLENGE PROBLEMS","Control signs across several variables and parameters",[["Subtract: (5a⁴b - 2a²b² + 7ab³) - (-3a⁴b + 6a²b² - 4ab³)",["8a⁴b - 8a²b² + 11ab³","2a⁴b + 4a²b² + 3ab³","8a⁴b + 4a²b² + 3ab³","2a⁴b - 8a²b² + 11ab³"],0],["For P(x)=(k+4)x²-3x+6 and Q(x)=(k-2)x²+5x-1, simplify P(x)-Q(x).",["6x² - 8x + 7","2kx² - 8x + 5","6x² + 2x + 5","(2k+2)x² - 8x + 7"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});if(n!==18||groups[0][2].length!==3||groups[1][2].length!==8||groups[2][2].length!==5||groups[3][2].length!==2)throw new Error('Problems format must be exactly 3/8/5/2 = 18 questions');document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
