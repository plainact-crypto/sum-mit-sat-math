<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Converting Between Forms — Practice Problems | SUMMIT SAT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Equations in Two Variables</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Converting Between Forms</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[['01 · SKILL CHECK','Recognize equivalent linear forms',[['Rewrite x + y = 9 in slope-intercept form.',['y = x + 9','y = −x + 9','y = −x − 9','y = 9x + 1'],1],['Rewrite y = 3x − 5 in standard form.',['3x − y = 5','3x + y = 5','3x − y = −5','x − 3y = 5'],0],['Which equation is equivalent to y − 4 = 2(x − 3)?',['y = 2x − 2','y = 2x + 10','y = −2x + 10','2x + y = 2'],0]]],['02 · CORE PRACTICE','Convert accurately among standard, slope-intercept, and point-slope forms',[['Rewrite 2x + y = 11 in slope-intercept form.',['y = 2x + 11','y = −2x + 11','y = −2x − 11','y = 11x − 2'],1],['Rewrite 4x + 2y = 12 in slope-intercept form.',['y = −2x + 6','y = 2x + 6','y = −4x + 12','y = −2x + 12'],0],['Rewrite y = −5x + 8 in standard form with a positive x coefficient.',['5x + y = 8','5x − y = 8','−5x + y = 8','x + 5y = 8'],0],['Rewrite y = (1/2)x − 3 in standard form using integer coefficients.',['x − 2y = 6','x + 2y = 6','2x − y = 3','x − 2y = −6'],0],['Rewrite y + 1 = 3(x − 2) in slope-intercept form.',['y = 3x − 7','y = 3x − 5','y = −3x + 5','y = 3x + 7'],0],['Rewrite y − 6 = −2(x + 1) in slope-intercept form.',['y = −2x + 4','y = −2x + 8','y = 2x + 4','y = −2x − 8'],0],['The line y = 4x + 1 passes through (2, 9). Which point-slope form uses that point?',['y − 9 = 4(x − 2)','y − 2 = 4(x − 9)','y + 9 = 4(x + 2)','y − 9 = 2(x − 4)'],0],['Rewrite 3x − y = 7 in slope-intercept form.',['y = 3x − 7','y = −3x + 7','y = 3x + 7','y = −3x − 7'],0]]],['03 · SAT-STYLE PRACTICE','Choose and convert forms to reveal useful information',[['A line is given by 6x + 2y = 18. What is its slope?',['−6','−3','3','9'],1],['A line is given by 5x − y = 12. What is its y-intercept?',['−12','−5','5','12'],0],['A service cost is modeled by y = 7x + 25. Which standard-form equation is equivalent?',['7x − y = −25','7x + y = 25','y − 7x = −25','25x − y = −7'],0],['A line has slope −3 and passes through (4, 10). Which equation is an equivalent point-slope form?',['y − 10 = −3(x − 4)','y − 4 = −3(x − 10)','y + 10 = −3(x + 4)','y − 10 = 4(x + 3)'],0],['The equation 2x + 4y = 20 models a linear relationship. What is the y-intercept?',['2','4','5','10'],2]]],['04 · CHALLENGE PROBLEMS','Use equivalence strategically',[['Which equation is equivalent to 3(y − 2) = −6(x + 1)?',['y = −2x','y = −2x + 4','y = 2x − 4','2x − y = 0'],0],['A line passes through (−2, 5) and has slope 3/2. Which standard-form equation represents the line?',['3x − 2y = −16','3x + 2y = 4','2x − 3y = −19','3x − 2y = 16'],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)};</script></body></html>
