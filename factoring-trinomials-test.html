<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Factoring Trinomials — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Factoring</div><div class="page-type">LESSON TEST</div><h1>Factoring Trinomials</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Factor completely: x² + 10x + 21',c:['(x + 3)(x + 7)','(x + 1)(x + 21)','(x - 3)(x - 7)','(x + 4)(x + 6)'],a:0,why:'The factor pair 3 and 7 has product 21 and sum 10, so x² + 10x + 21 = (x + 3)(x + 7).'},{level:'EASY-MEDIUM',q:'Factor completely: x² - x - 20',c:['(x - 5)(x + 4)','(x + 5)(x - 4)','(x - 10)(x + 2)','(x - 4)(x - 5)'],a:0,why:'The integers -5 and 4 multiply to -20 and add to -1, giving (x - 5)(x + 4).'},{level:'MEDIUM',q:'Which is the complete factorization of 2x² + 9x + 4?',c:['(2x + 1)(x + 4)','(2x + 4)(x + 1)','(2x - 1)(x - 4)','(x + 1)(2x + 4)'],a:0,why:'Expanding (2x + 1)(x + 4) gives 2x² + 8x + x + 4 = 2x² + 9x + 4. The other forms do not expand to the given trinomial.'},{level:'HARD',q:'A rectangle has area 3x² + 14x + 8 square units. One side is 3x + 2 units. What is the other side?',c:['x + 4 units','x + 6 units','3x + 4 units','x + 2 units'],a:0,why:'Factor the area: 3x² + 14x + 8 = (3x + 2)(x + 4). Dividing by the known side 3x + 2 leaves x + 4 units.'},{level:'HARD / EXAM-STYLE',q:'The identity 12x² + bx - 35 = (3x + 5)(4x - 7) holds for all x. What is b?',c:['-1','1','-41','41'],a:0,why:'Expand the right side: 12x² - 21x + 20x - 35 = 12x² - x - 35. Matching the x-coefficient gives b = -1.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};</script></body></html>
