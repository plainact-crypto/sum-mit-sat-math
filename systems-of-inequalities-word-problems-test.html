<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Systems of Inequalities Word Problems — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Systems of Linear Inequalities</div><div class="page-type">LESSON TEST</div><h1>Systems of Inequalities Word Problems</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'A club sells x adult passes for $8 and y student passes for $5. It can admit at most 70 people and needs at least $440 in revenue. Which system models the limits?',c:['x + y ≤ 70 and 8x + 5y ≥ 440','x + y ≥ 70 and 8x + 5y ≥ 440','x + y ≤ 70 and 8x + 5y ≤ 440','x + y = 70 and 8x + 5y = 440'],a:0,why:'“At most 70” gives x+y≤70, while “at least $440” gives 8x+5y≥440.'},{level:'EASY-MEDIUM',q:'A workshop makes x basic kits and y advanced kits. It can make at most 30 kits, and each basic kit uses 2 material units while each advanced kit uses 4. At most 80 material units are available. Which plan satisfies both limits?',c:['(18, 14)','(16, 12)','(22, 9)','(10, 21)'],a:1,why:'For (16,12), 16+12=28≤30 and 2(16)+4(12)=80≤80. Every other choice violates at least one limit.'},{level:'MEDIUM',q:'A plan uses x = 12 standard tasks and y = 8 advanced tasks. It must satisfy x + y ≤ 24 and 3x + ky ≤ 60. What is the greatest integer value of k that keeps the plan feasible?',c:['2','3','4','5'],a:1,why:'The total-task condition is 20≤24. The second condition gives 36+8k≤60, so 8k≤24 and k≤3. The greatest integer value is 3.'},{level:'HARD',q:'A room must have fewer than 45 people and collect at least $360. Adult tickets are $12 and student tickets are $6. Which attendance plan is allowed?',c:['20 adults and 25 students','18 adults and 24 students','15 adults and 30 students','25 adults and 20 students'],a:1,why:'For (18,24), attendance is 42<45 and revenue is 12(18)+6(24)=360. The other choices have 45 people, so they fail the strict attendance limit.'},{level:'HARD / EXAM-STYLE',q:'Nonnegative integers x and y satisfy x + y ≤ 10 and 2x + 3y ≤ 24. What is the greatest possible value of 4x + 5y?',c:['38','40','42','44'],a:2,why:'For a fixed total near the limit, y has the larger objective gain but also uses more weighted capacity. Checking the boundary integer candidates gives (6,4): x+y=10 and 2x+3y=24, with 4x+5y=44? That would be 24+20=44, so the keyed choice must match 44.'}];qs[4]={level:'HARD / EXAM-STYLE',q:'Nonnegative integers x and y satisfy x + y ≤ 10 and 2x + 3y ≤ 24. What is the greatest possible value of 4x + 5y?',c:['38','40','42','44'],a:3,why:'At (6,4), x+y=10 and 2(6)+3(4)=24, so it is feasible and 4(6)+5(4)=44. Along x+y=10 the objective is 40+y, maximized by the largest feasible y; 20+y≤24 gives y≤4. Thus 44 is the maximum.'};const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
