<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Slope from Two Points — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Slope from Two Points</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[["01 · SKILL CHECK","Use m = (y₂ − y₁) / (x₂ − x₁) carefully",[["What is the slope of the line through (2, 3) and (6, 11)?",["1/2","2","4","8"],1],["What is the slope of the line through (−1, 4) and (3, −8)?",["−4","−3","3","4"],1],["What is the slope of the line through (0, −5) and (10, 0)?",["−1/2","1/2","2","5"],1]]],["02 · CORE PRACTICE","Track order, signs, fractions, horizontal lines, and vertical lines",[["Find the slope through (1, 7) and (5, 19).",["2","3","4","12"],1],["Find the slope through (−4, 2) and (2, 14).",["1/2","2","3","6"],1],["Find the slope through (3, 8) and (9, 2).",["−6","−1","1","6"],1],["What is the slope through (−2, −3) and (4, −3)?",["−1","0","1","undefined"],1],["What is the slope through (5, −1) and (5, 9)?",["0","1","10","undefined"],3],["Find the slope through (0.5, 4) and (2.5, 10).",["2","3","4","6"],1],["Find the slope through (−3, 7) and (1, −1).",["−8","−2","2","8"],1],["Find the slope through (2, 5) and (8, 8).",["1/3","1/2","2","3"],1]]],["03 · EXAM-STYLE PRACTICE","Interpret slope as a rate and use it to find missing information",[["A delivery fee is $9 when the trip distance is 2 miles and $21.50 when the distance is 7 miles. If the relationship is linear, what is the rate of change of cost with respect to distance?",["$1.50 per mile","$2.50 per mile","$4.25 per mile","$6.25 per mile"],1],["A tank contains 44 liters after 3 minutes and 20 liters after 11 minutes. What is the average rate of change in volume over that interval?",["−8 L/min","−3 L/min","3 L/min","8 L/min"],1],["A line passes through (−6, 5) and (2, −7). What is its slope?",["−3/2","−2/3","2/3","3/2"],0],["A line passes through (2, 6) and (8, k). Its slope is 4/3. What is k?",["10","12","14","18"],2],["A line passes through (−2, 1) and (4, 10). Which statement is true?",["Its slope is −3/2","Its slope is −2/3","Its slope is 2/3","Its slope is 3/2"],3]]],["04 · CHALLENGE PROBLEMS","Use the slope relationship to recover coordinates and preserve collinearity",[["The slope between (p, 5) and (7, 17) is 3. What is p?",["1","2","3","4"],2],["Points A(−4, 11), B(2, −1), and C(8, y) lie on the same line. What is y?",["−15","−13","−11","13"],1]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
