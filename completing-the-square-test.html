<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Completing the Square — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Quadratic Equations</div><div class="page-type">LESSON TEST</div><h1>Completing the Square</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Complete the square: x² + 8x + ___ = (x + 4)²',c:['16','8','4','64'],a:0,why:'Half of 8 is 4, and 4² = 16. Expanding (x+4)² gives x²+8x+16.'},{level:'EASY-MEDIUM',q:'Which equation is equivalent to x² − 6x + 2 = 0 after completing the square?',c:['(x − 3)² = 7','(x − 3)² = 11','(x + 3)² = 7','(x − 6)² = 34'],a:0,why:'Move 2 to the right: x²−6x=−2. Add 9 to both sides: (x−3)²=7.'},{level:'MEDIUM',q:'Solve x² + 10x + 21 = 0 by completing the square.',c:['x = −3 or x = −7','x = 3 or x = 7','x = −5 ± √21','x = −10 or x = −21'],a:0,why:'x²+10x=−21. Add 25: (x+5)²=4, so x+5=±2 and x=−3 or −7. Substitution makes the original equation zero.'},{level:'HARD',q:'Solve 2x² − 8x − 6 = 0 by completing the square.',c:['x = 2 ± √7','x = 4 ± √7','x = 2 ± 7','x = −2 ± √7'],a:0,why:'Divide by 2: x²−4x−3=0, so x²−4x=3. Add 4: (x−2)²=7, hence x=2±√7. Substitution satisfies the original equation.'},{level:'HARD / EXAM-STYLE',q:'The function y = x² − 12x + 31 is rewritten as y = (x − h)² + k. What is the vertex (h, k)?',c:['(6, −5)','(−6, −5)','(6, 5)','(12, 31)'],a:0,why:'x²−12x+31=(x−6)²−36+31=(x−6)²−5, so h=6 and k=−5. The vertex is (6,−5).'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};</script></body></html>
