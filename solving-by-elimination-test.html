<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Solving by Elimination — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">LESSON TEST</div><h1>Solving by Elimination</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Solve the system x + y = 9 and x − y = 3 using elimination.',c:['(3, 6)','(6, 3)','(9, 3)','(6, 6)'],a:1,why:'Add the equations: 2x = 12, so x = 6. Then 6 + y = 9 gives y = 3.'},{level:'EASY-MEDIUM',q:'Solve the system 2x + y = 11 and 2x − 3y = −1.',c:['(4, 3)','(3, 4)','(5, 1)','(2, 7)'],a:0,why:'Subtract the second equation from the first: 4y = 12, so y = 3. Then 2x + 3 = 11 gives x = 4.'},{level:'MEDIUM',q:'Solve the system x + 2y = 8 and 3x − y = 3.',c:['(2, 3)','(3, 2)','(4, 2)','(1, 4)'],a:0,why:'Multiply the first equation by 3 to get 3x + 6y = 24. Subtract 3x − y = 3: 7y = 21, so y = 3 and x = 2.'},{level:'HARD',q:'Solve the system 0.4x + 0.2y = 2.2 and 0.4x − 0.3y = 0.7.',c:['(3, 4)','(4, 3)','(5, 1)','(2, 7)'],a:1,why:'Subtract the second equation from the first: 0.5y = 1.5, so y = 3. Then 0.4x + 0.6 = 2.2, giving x = 4.'},{level:'HARD / EXAM-STYLE',q:'A study center charges different daily rates for standard and advanced calculator rentals. Four standard rentals and three advanced rentals cost $222. Two standard rentals and five advanced rentals cost $258. What is the daily rate for one advanced calculator?',c:['$24','$36','$42','$48'],a:2,why:'Let s and a be the standard and advanced rates. The equations are 4s + 3a = 222 and 2s + 5a = 258. Double the second equation: 4s + 10a = 516. Subtract the first equation: 7a = 294, so a = 42.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
