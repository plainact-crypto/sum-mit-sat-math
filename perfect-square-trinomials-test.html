<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Perfect-Square Trinomials — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Factoring</div><div class="page-type">LESSON TEST</div><h1>Perfect-Square Trinomials</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Factor completely: x² + 12x + 36',c:['(x + 3)(x + 12)','(x + 6)²','(x - 6)²','(x + 18)(x + 2)'],a:1,why:'The first and last terms are x² and 6², and 2(x)(6)=12x. Therefore x² + 12x + 36 = (x + 6)².'},{level:'EASY-MEDIUM',q:'Which trinomial is a perfect-square trinomial?',c:['4y² - 20y + 25','4y² - 10y + 25','4y² + 20y + 20','4y² - 25'],a:0,why:'4y²=(2y)² and 25=5². The middle term required for (2y - 5)² is -2(2y)(5)=-20y, so 4y² - 20y + 25 is a perfect square.'},{level:'MEDIUM',q:'Factor completely: 49m² + 70mn + 25n²',c:['(7m + 25n)²','(49m + n)(m + 25n)','(7m + 5n)²','(7m - 5n)²'],a:2,why:'49m²=(7m)² and 25n²=(5n)². Since 2(7m)(5n)=70mn, the factorization is (7m + 5n)².'},{level:'HARD',q:'A square display has area 9x² + 24x + 16 square units. For x > 0, which expression gives its side length?',c:['9x + 4','3x + 8','3x - 4','3x + 4'],a:3,why:'9x² + 24x + 16 = (3x + 4)² because 2(3x)(4)=24x. With x > 0, the positive side length is 3x + 4 units.'},{level:'HARD / EXAM-STYLE',q:'For positive constants a and b, (ax - b)² = 16x² - 40x + 25. What is a + b?',c:['20','9','5','4'],a:1,why:'Matching the square terms gives a=4 and b=5. The middle term checks because -2abx=-2(4)(5)x=-40x. Thus a+b=9.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};</script></body></html>
