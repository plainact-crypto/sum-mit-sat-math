<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>One Real Solution — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Quadratic Equations</div><div class="page-type">LESSON TEST</div><h1>One Real Solution</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Which equation has exactly one real solution?',c:['x² − 8x + 16 = 0','x² − 8x + 15 = 0','x² + 16 = 0','x² − 16 = 0'],a:0,why:'x²−8x+16=(x−4)², so the only real solution is x=4. Equivalently, D=(−8)²−4(1)(16)=0.'},{level:'EASY-MEDIUM',q:'What is the repeated real solution of 9x² + 12x + 4 = 0?',c:['x = −2/3','x = 2/3','x = −4/3','x = 3/2'],a:0,why:'9x²+12x+4=(3x+2)², so 3x+2=0 and x=−2/3. Substitution gives 4−8+4=0.'},{level:'MEDIUM',q:'For what value of c does 2x² − 20x + c = 0 have exactly one real solution?',c:['50','100','25','200'],a:0,why:'Exactly one real solution requires D=0: (−20)²−4(2)c=400−8c=0, so c=50.'},{level:'HARD',q:'The equation 3x² + kx + 12 = 0 has exactly one real solution. Which values of k are possible?',c:['k = ±12','k = ±6','k = 12 only','k = ±24'],a:0,why:'Set D=0: k²−4(3)(12)=k²−144=0, so k=±12. Either value makes the discriminant zero.'},{level:'HARD / EXAM-STYLE',q:'A height model is h(t)=−5t²+20t+s. For its graph to touch h=0 at exactly one time value, what must s equal?',c:['−20','20','−10','10'],a:0,why:'Touching h=0 once means a repeated root, so D=0: 20²−4(−5)s=400+20s=0, giving s=−20. Then h(t)=−5(t−2)², which touches zero at t=2 only.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
