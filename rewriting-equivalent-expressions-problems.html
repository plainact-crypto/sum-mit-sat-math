<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Rewriting Equivalent Expressions — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Advanced Math · Equivalent Expressions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Rewriting Equivalent Expressions</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">distribute · combine · factor · verify</span></div></div><div id="sets"></div></div></main><script>const groups=[["SKILL CHECK","Rewrite using one clean algebra move",[["Simplify: 3(x + 4)",["3x + 4","3x + 12","7x","12x"],1],["Simplify: 7x + 2x - 5",["9x - 5","9x + 5","14x - 5","7x - 3"],0],["Factor completely: 10y + 15",["10(y + 5)","3(5y + 5)","5(2y + 3)","5(2y + 15)"],2]]],["CORE PRACTICE","Choose and apply the useful equivalent form",[["Simplify: 4(a - 3) + 2a",["6a - 12","6a - 3","4a - 10","2a - 12"],0],["Simplify: 5m + 8 - 2(m - 1)",["3m + 6","7m + 6","3m + 10","7m + 10"],2],["Factor completely: 12p² + 18p",["3p(4p + 6)","6p(2p + 3)","6(2p² + 3p)","2p(6p + 9)"],1],["Which is equivalent to 2(3x - 5) + x?",["7x - 10","6x - 4","7x - 5","5x - 10"],0],["Simplify: -(2t - 7) + 3t",["t - 7","5t + 7","t + 7","-5t + 7"],2],["Factor completely: 21ab - 14a",["7a(3b - 2)","7(3ab - 2a)","14a(1.5b - 1)","a(21b - 14)"],0],["Simplify: 0.5(8r + 6) - r",["3r + 3","4r + 3","3r + 6","5r + 3"],0],["Simplify: (3/4)(8k - 12) + 2k",["6k - 9","8k - 9","8k - 12","4k - 9"],1]]],["EXAM-STYLE PRACTICE","Recognize structure and equivalent forms",[["Which expression is equivalent to 6(x + 2) - 4x?",["10x + 12","2x + 2","2x + 12","6x + 8"],2],["A rectangle has width 3x and length x + 5. Which expanded expression represents its area?",["3x² + 15x","4x + 15","3x² + 5","3x(x + 15)"],0],["Which factored form is equivalent to 18q² - 24q?",["3q(6q - 8)","6q(3q - 4)","6(3q² - 4q)","12q(1.5q - 2)"],1],["For all x, 4(2x + 1) + c is equivalent to 8x + 11. What is c?",["4","7","10","11"],1],["A student rewrites -3(2y - 5) + y as -5y + 15. Which statement is correct?",["The rewrite is correct.","It should be -7y + 15.","It should be -5y - 15.","It should be 5y + 15."],0]]],["CHALLENGE PROBLEMS","Combine several rewrite steps and verify equivalence",[["Simplify completely: 2[3x - 4(x - 5)] - (x + 1)",["-3x + 39","-x + 19","3x + 39","-3x + 19"],0],["Which expression is equivalent to (1/2)(6z - 8) - 3(z - 5)?",["11","3z + 11","-6z + 11","7"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});if(n!==18||groups[0][2].length!==3||groups[1][2].length!==8||groups[2][2].length!==5||groups[3][2].length!==2)throw new Error('Problems format must be exactly 3/8/5/2 = 18 questions');document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
