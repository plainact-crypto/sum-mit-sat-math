<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Slope from Two Points — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">LESSON TEST</div><h1>Slope from Two Points</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers & Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'What is the slope through (1, 2) and (5, 10)?',c:['1/2','2','4','8'],a:1,why:'m = (10 − 2)/(5 − 1) = 8/4 = 2.'},{level:'EASY-MEDIUM',q:'What is the slope through (−3, 7) and (1, −5)?',c:['−4','−3','3','4'],a:1,why:'m = (−5 − 7)/(1 − (−3)) = −12/4 = −3.'},{level:'MEDIUM',q:'A horizontal line passes through (−6, 4) and (3, 4). What is its slope?',c:['−1','0','1','undefined'],a:1,why:'The y-values are equal, so Δy = 0. Therefore the slope is 0.'},{level:'HARD',q:'A line passes through (2, 5) and (8, k). Its slope is 3/2. What is k?',c:['11','12','14','17'],a:2,why:'3/2 = (k − 5)/(8 − 2) = (k − 5)/6. Thus k − 5 = 9, so k = 14.'},{level:'HARD / EXAM-STYLE',q:'A storage tank holds 68 liters after 4 minutes and 38 liters after 10 minutes. If the change is linear, what is the rate of change in volume?',c:['−6 L/min','−5 L/min','5 L/min','6 L/min'],a:1,why:'Rate = (38 − 68)/(10 − 4) = −30/6 = −5 L/min. The negative sign shows the volume is decreasing.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
