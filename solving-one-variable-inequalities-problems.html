<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Solving One-Variable Inequalities — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Inequalities</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Solving One-Variable Inequalities</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Solve, interpret, verify</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Isolate the variable in one or two steps",[["Solve x + 7 < 12.",["x < 5","x > 5","x ≤ 19","x ≥ 19"],0],["Solve 4x ≥ 28.",["x ≥ 7","x ≤ 7","x > 24","x ≥ 32"],0],["Solve x/5 − 2 ≤ 4.",["x ≤ 10","x ≤ 20","x ≤ 30","x ≥ 30"],2]]],["CORE PRACTICE","Use distribution, fractions, and variables on both sides",[["Solve 3x + 5 < 20.",["x < 3","x < 5","x > 5","x ≤ 5"],1],["Solve 5x + 2 ≥ 2x + 14.",["x ≥ 4","x ≤ 4","x ≥ 12","x > 4"],0],["Solve 2(x + 3) ≤ 18.",["x ≤ 6","x ≥ 6","x ≤ 9","x < 6"],0],["Solve x/4 − 3 > 2.",["x > 5","x > 8","x > 20","x ≥ 20"],2],["Solve 7x − 5 > 2x + 10.",["x > 1","x > 3","x ≥ 3","x < 3"],1],["Solve 9 + 2x ≤ 21.",["x ≤ 5","x ≤ 6","x ≥ 6","x < 15"],1],["Solve (x + 5)/3 ≥ 4.",["x ≥ 7","x ≤ 7","x ≥ 12","x > 7"],0],["Solve 4(x − 2) + 3 < 19.",["x < 4","x < 5","x < 6","x ≤ 6"],2]]],["EXAM-STYLE PRACTICE","Translate limits and minimums before solving",[["A student has $60 and wants to buy notebooks that cost $8 each while keeping at least $12. What is the greatest number of notebooks the student can buy?",["5","6","7","9"],1],["A team has already earned 74 points and needs at least 120 points in total. If x is the number of additional points needed, which solution describes x?",["x ≥ 46","x ≤ 46","x > 194","x ≥ 194"],0],["A ride costs a $5 starting fee plus $3 per mile. A student can spend at most $41. What is the greatest whole number of miles the student can travel?",["10 miles","11 miles","12 miles","13 miles"],2],["A club has raised $125 and earns $15 for each additional batch of items sold. The goal is at least $200. What is the minimum number of additional batches needed?",["4","5","6","8"],1],["A storage shelf can hold at most 250 kg. It already holds 82 kg. Each new box weighs 14 kg. What is the greatest number of new boxes that can be added?",["10","11","12","13"],2]]],["CHALLENGE PROBLEMS","Handle less direct algebra and a negative-rate context",[["Solve 3(2x + 1) ≤ 5x + 11.",["x ≤ 8","x ≥ 8","x < 8","x ≤ 14"],0],["A student has $96 and spends $7.50 per book. The student wants to keep at least $21. What is the greatest whole number of books the student can buy?",["8","9","10","11"],2]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
