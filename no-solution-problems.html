<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>No Solution — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">PRACTICE PROBLEMS</div><h1>No Solution</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Recognize inconsistent systems",[["Classify the system y = 4x + 1 and y = 4x - 5.",["One solution","No solution","Infinitely many solutions","Not enough information"],1],["Classify the system y = -2x + 3 and 2x + y = 3.",["No solution","One solution","Infinitely many solutions","Exactly two solutions"],2],["What is the solution status of 3x - y = 7 and 6x - 2y = 20?",["One solution","No solution","Infinitely many solutions","The system cannot be classified"],1]]],["CORE PRACTICE","Compare slopes, intercepts, and equivalent equations",[["For what value of k will y = 5x + 2 and y = kx - 6 have no solution?",["-6","2","5","6"],2],["Which value of c makes 2x + 3y = 9 and 4x + 6y = c have infinitely many solutions instead of no solution?",["9","18","20","36"],1],["Classify x - 2y = 4 and 2x - 4y = 8.",["No solution","One solution","Infinitely many solutions","Exactly two solutions"],2],["Classify 3x + y = 8 and 6x + 2y = 15.",["One solution","No solution","Infinitely many solutions","Cannot be determined"],1],["Classify y = -0.5x + 7 and x + 2y = 14.",["No solution","One solution","Infinitely many solutions","Exactly two solutions"],2],["What is the solution status of 4x - 2y = 10 and 2x - y = 8?",["One solution","No solution","Infinitely many solutions","No real coefficients"],1],["If y = 3x + 2 is paired with 6x - 2y = 10, what is the solution status?",["No solution","One solution","Infinitely many solutions","Exactly two solutions"],0],["Classify 5x + 2y = 12 and 10x + 4y = 24.",["No solution","One solution","Infinitely many solutions","Cannot be determined"],2]]],["EXAM-STYLE PRACTICE","Use parameters and context to identify no-solution systems",[["Plan A costs C = 12 + 4n dollars and Plan B costs C = 20 + 4n dollars for n units. What does the system have when the two costs are set equal?",["One solution at n = 2","No solution","Infinitely many solutions","One solution at n = 8"],1],["For what value of k does 2x + ky = 6 together with 4x + 6y = 15 have no solution?",["2","3","4","6"],1],["For what value of p will y = (p - 1)x + 8 and y = 4x - 3 have no solution?",["3","4","5","6"],2],["For what value of a does ax + 2y = 7 and 6x + 4y = 20 have no solution?",["2","3","4","6"],1],["Line A passes through (0, 2) and (2, 6). Line B passes through (0, -1) and (3, 5). What is the solution status of the two-line system?",["One solution","No solution","Infinitely many solutions","The lines are perpendicular"],1]]],["CHALLENGE PROBLEMS","Recover hidden conditions for parallel distinct lines",[["For what value of a does (a - 2)x + 3y = 9 together with 4x + 6y = 25 have no solution?",["2","3","4","5"],2],["Line 1 passes through (1, 4) and (5, 12). Line 2 passes through (-2, q) and (2, 7). For what value of q are the lines parallel and distinct, so the system has no solution?",["-3","-1","1","3"],1]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
