<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Graphing Linear Functions — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Graphing Linear Functions</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Read key graph features",[["For the line y = 2x − 3, which point is the y-intercept?",["(0, −3)","(−3, 0)","(0, 2)","(2, 0)"],0],["A line has slope −3 and y-intercept 4. Which pair of points is guaranteed to lie on its graph?",["(0, 4) and (1, 1)","(0, −3) and (1, 1)","(4, 0) and (1, −3)","(0, 4) and (1, 7)"],0],["For 2x + y = 6, which two intercepts can be plotted to graph the line?",["(3, 0) and (0, 6)","(6, 0) and (0, 3)","(−3, 0) and (0, 6)","(3, 0) and (0, −6)"],0]]],["CORE PRACTICE","Plot points and connect equations to graphs",[["The graph of y = (1/2)x + 1 contains which point when x = 4?",["(4, 3)","(4, 2)","(3, 4)","(4, 5)"],0],["A line passes through (−2, 5) with slope 3. Starting at that point, which second point can be reached by moving 1 unit right and following the slope?",["(−1, 8)","(−1, 2)","(−3, 8)","(1, 6)"],0],["A line passes through (0, −2) and (3, 4). Which equation represents its graph?",["y = 2x − 2","y = 2x + 2","y = (1/2)x − 2","y = −2x − 2"],0],["Which point does NOT lie on the graph of y = −x + 5?",["(0, 5)","(2, 3)","(5, 0)","(3, 1)"],3],["A linear function has the table values (−1, 4), (0, 2), and (1, 0). Which equation should its graph follow?",["y = −2x + 2","y = 2x + 2","y = −2x − 2","y = x + 2"],0],["Which equation graphs as a horizontal line through (4, −3)?",["y = −3","x = 4","y = 4","x = −3"],0],["Which equation graphs as a vertical line through (−2, 5)?",["x = −2","y = 5","x = 5","y = −2"],0],["To graph 3y = 6x − 9, which pair of points can be plotted directly after rewriting the equation?",["(0, −3) and (2, 1)","(0, 3) and (2, 7)","(0, −9) and (2, 3)","(0, −3) and (2, −1)"],0]]],["EXAM-STYLE PRACTICE","Interpret and construct linear graphs",[["A service charge is modeled by C = 1.5m + 4, where m is the number of usage units and C is the cost in dollars. Which point lies on the graph when m = 8?",["(8, 16)","(8, 12)","(16, 8)","(4, 10)"],0],["A line crosses the y-axis at (0, 6) and the x-axis at (3, 0). Which equation represents the line?",["y = −2x + 6","y = 2x + 6","y = −(1/2)x + 6","y = −2x + 3"],0],["A quantity starts at 25 and decreases by 4 each hour. If the graph uses hours on the x-axis and the quantity on the y-axis, what y-value should appear at x = 5?",["5","9","20","45"],0],["Line A passes through (−1, 1) and (3, 9). Line B is y = 2x − 5. Which statement correctly describes their graphs?",["They are parallel.","They are perpendicular.","They are the same line.","They intersect at a right angle."],0],["For y = (3/4)x − 6, which point is the x-intercept of the graph?",["(8, 0)","(0, 8)","(−8, 0)","(6, 0)"],0]]],["CHALLENGE PROBLEMS","Use graph conditions to find hidden values",[["A line through (a, −1) and (4, 5) has slope 2. What is the value of a?",["1","2","−1","3"],0],["The line px + 3y = 12 passes through (6, −2). What is the x-intercept of its graph?",["(4, 0)","(3, 0)","(6, 0)","(12, 0)"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
