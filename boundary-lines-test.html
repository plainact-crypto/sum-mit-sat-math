<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Boundary Lines — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Inequalities</div><div class="page-type">LESSON TEST</div><h1>Boundary Lines</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'For the inequality x ≤ 4, which boundary should be drawn?',c:['A solid vertical line x = 4','A dashed vertical line x = 4','A solid horizontal line y = 4','A dashed horizontal line y = 4'],a:0,why:'Replace ≤ with = to get the boundary x = 4. Because equality is included, the boundary line is solid.'},{level:'EASY-MEDIUM',q:'What is the boundary line for y > -3x + 2?',c:['y = -3x + 2, dashed','y = -3x + 2, solid','y = 3x + 2, dashed','x = -3y + 2, solid'],a:0,why:'Replace > with = to get y = -3x + 2. A strict inequality does not include equality, so the line is dashed.'},{level:'MEDIUM',q:'For 2x + 3y ≤ 12, which description of the boundary is correct?',c:['2x + 3y = 12, solid, with intercepts (6, 0) and (0, 4)','2x + 3y = 12, dashed, with intercepts (6, 0) and (0, 4)','2x + 3y = 12, solid, with intercepts (4, 0) and (0, 6)','2x + 3y = 0, solid, with intercepts (6, 0) and (0, 4)'],a:0,why:'The boundary is 2x + 3y = 12 and it is solid because ≤ includes equality. Setting y=0 gives x=6; setting x=0 gives y=4.'},{level:'HARD',q:'Which point lies on the boundary line y = -2x + 5?',c:['(2, 1)','(1, 1)','(3, 1)','(0, 4)'],a:0,why:'Substitute x=2: y=-2(2)+5=1, so (2,1) lies exactly on the boundary.'},{level:'HARD / EXAM-STYLE',q:'A graph has a dashed boundary y = 0.5x - 1 and the region above the line is shaded. Which inequality does the graph represent?',c:['y > 0.5x - 1','y ≥ 0.5x - 1','y < 0.5x - 1','y ≤ 0.5x - 1'],a:0,why:'Dashed means equality is not included, so the sign is strict. Shading above means y-values are greater than the line, giving y > 0.5x - 1.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
