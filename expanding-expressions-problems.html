<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Expanding Expressions — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Advanced Math · Equivalent Expressions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Expanding Expressions</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">3 Skill Check · 8 Core · 5 Exam-Style · 2 Challenge</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Answers →</a></div></div></main><script>const groups=[["SKILL CHECK",[["Expand: 2(x + 6)",["2x + 12","2x + 6","8x","12x"],0],["Expand: 4(a - 3)",["4a - 12","4a - 3","a - 12","4a + 12"],0],["Expand: -3(y + 5)",["-3y - 15","-3y + 15","3y - 15","-3y + 5"],0]]],["CORE PRACTICE",[["Simplify: 3(x + 2) + 2x",["5x + 6","5x + 2","6x + 6","3x + 4"],0],["Simplify: 5(m - 4) - 2m",["3m - 20","7m - 20","3m - 4","3m + 20"],0],["Simplify: -2(3p - 7) + p",["-5p + 14","-7p + 14","-5p - 14","7p - 14"],0],["Simplify: (1/2)(10t - 8) + 2t",["7t - 4","5t - 4","7t - 8","12t - 4"],0],["Simplify: 0.5(6r + 4) - r",["2r + 2","3r + 2","2r + 4","4r + 2"],0],["Simplify: 2(3x + 1) - 4(x - 2)",["2x + 10","10x - 6","2x - 6","10x + 10"],0],["Simplify: -(4a - 9) + 3(a + 1)",["-a + 12","7a - 6","-a + 6","a + 12"],0],["Simplify: 3[2q - (q - 5)]",["3q + 15","3q - 15","q + 15","6q + 15"],0]]],["EXAM-STYLE",[["A rectangle has length 2x + 3 and width 5. Which expression gives its area?",["10x + 15","10x + 3","7x + 15","10x + 8"],0],["Which expression is equivalent to 4(2x - 3) - (x + 5)?",["7x - 17","9x - 17","7x + 7","8x - 8"],0],["If 2(3x + k) - x = 5x + 14 for every x, what is k?",["5","7","12","14"],1],["A club charges $12 per visit and gives each member a $2 discount per visit. Which expression gives the cost of n visits?",["10n","12n - 2","12(n - 2)","14n"],0],["Simplify: 3(2y - 1) - 2(1 - y)",["8y - 5","4y - 5","8y - 1","4y + 1"],0]]],["CHALLENGE",[["Simplify: -2[3x - 2(4 - x)] + 5x",["-5x + 16","-x + 16","-5x - 16","15x + 16"],0],["Simplify: (1/3)[6z - 3(2 - z)] - (z - 4)",["2z + 2","z + 2","2z - 2","4z + 2"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const s=document.createElement('section');s.className='practice-section';s.innerHTML='<span class="section-kicker">'+g[0]+'</span>';g[1].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';s.appendChild(q)});root.appendChild(s)});if(n!==18||groups[0][1].length!==3||groups[1][1].length!==8||groups[2][1].length!==5||groups[3][1].length!==2)throw Error('Problems format must be exactly 3/8/5/2 = 18');document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});</script></body></html>
