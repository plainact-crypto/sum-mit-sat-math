<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Solving by Factoring — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Quadratic Equations</div><div class="page-type">LESSON TEST</div><h1>Solving by Factoring</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Solve by factoring: x² − 8x + 15 = 0',c:['x = 3 or x = 5','x = −3 or x = −5','x = 1 or x = 15','x = −1 or x = −15'],a:0,why:'Factor x²−8x+15 as (x−3)(x−5). By the zero-product property, x=3 or x=5.'},{level:'EASY-MEDIUM',q:'Solve by factoring: 2x² + x − 6 = 0',c:['x = −2 or x = 3/2','x = 2 or x = −3/2','x = −3 or x = 1','x = −1/2 or x = 6'],a:0,why:'Factor 2x²+x−6 as (2x−3)(x+2). Setting each factor equal to zero gives x=3/2 or x=−2.'},{level:'MEDIUM',q:'Solve by factoring: 5x² − 20x = 0',c:['x = 0 or x = 4','x = 0 or x = −4','x = 4 only','x = 5 or x = 20'],a:0,why:'Factor out 5x: 5x(x−4)=0. Therefore x=0 or x=4.'},{level:'HARD',q:'Solve by factoring: x⁴ − 10x² + 9 = 0',c:['x = ±1, ±3','x = ±1, ±9','x = ±3 only','x = 1 or x = 9'],a:0,why:'Treat x² as one variable: (x²−1)(x²−9)=0. Thus x²=1 or 9, so x=±1 or ±3.'},{level:'HARD / EXAM-STYLE',q:'A rectangle has width x + 1 and length x + 4, with area 40 square units. If x is positive, what is x?',c:['4','5','−9','10'],a:0,why:'Set (x+1)(x+4)=40, so x²+5x−36=0=(x+9)(x−4). The solutions are −9 and 4; the positive condition gives x=4.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};</script></body></html>
