<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Overlapping Solution Regions — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Systems of Linear Inequalities</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Overlapping Solution Regions</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Overlap · feasibility · boundary intersections</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Recognize points and regions that satisfy every inequality",[["For the system y ≥ x + 1 and y ≤ −x + 7, which point lies in the overlap?",["(2, 4)","(4, 2)","(0, 8)","(5, 6)"],0],["The system y > 2 and x ≤ 3 has an overlapping solution region. Which description is correct?",["Above y = 2 and left of or on x = 3","Below y = 2 and right of x = 3","Above y = 2 and right of x = 3","Below y = 2 and left of x = 3"],0],["The boundary lines y = x + 2 and y = −2x + 8 meet at which point?",["(1, 3)","(2, 4)","(3, 5)","(4, 4)"],1]]],["CORE PRACTICE","Find and interpret common solution regions",[["Which point satisfies both y ≤ 2x + 1 and y ≥ −x + 4?",["(2, 3)","(0, 2)","(3, 8)","(−1, 5)"],0],["What best describes the solution region of y ≥ x − 2 and y ≤ x + 3?",["The strip between the two parallel lines, including both boundaries","No points satisfy both inequalities","Only one line is in the solution set","The region outside the two parallel lines"],0],["For y > −x + 5 and y < x + 1, for which x-values can an overlap exist?",["x < 2","x ≤ 2","x > 2","All real x"],2],["Which point satisfies x ≥ −1, y ≤ 3, and x + y ≥ 1?",["(0, 2)","(−2, 4)","(3, 4)","(−1, 0)"],0],["The boundaries y = 3x − 4 and y = x + 2 intersect at",["(2, 2)","(3, 5)","(4, 6)","(1, 3)"],1],["The region is defined by x ≥ 0, y ≥ 0, and y ≤ −2x + 6. What is the greatest possible x-value?",["2","3","4","6"],1],["Which system has (1, 4) in its overlapping solution region?",["y ≥ 2x + 1 and y ≤ −x + 6","y ≤ 2x and y ≥ x + 5","y > 5 and x + y ≤ 4","y ≤ x + 1 and y ≥ 3x + 2"],0],["The boundaries x + y = 7 and x − y = 1 intersect at",["(3, 4)","(4, 3)","(5, 2)","(2, 5)"],1]]],["EXAM-STYLE PRACTICE","Use overlap to model feasible choices and constraints",[["A workshop can make x small kits and y large kits. The constraints are x ≥ 0, y ≥ 0, 4x + 2y ≤ 24, and x + y ≥ 5. Which pair is feasible?",["(4, 1)","(6, 2)","(1, 3)","(7, 0)"],0],["For y ≥ 0.5x + 2 and y ≤ −x + 8, which x-values can produce points in the overlap?",["x ≤ 4","x ≥ 4","x < 0 only","All real x"],0],["A club sells adult tickets x and student tickets y. At most 10 tickets can be sold, and revenue cannot exceed $84: x + y ≤ 10 and 12x + 6y ≤ 84, with x,y ≥ 0. Which order is allowed?",["(4, 5)","(6, 5)","(2, 9)","(7, 3)"],0],["A feasible region satisfies x ≥ 2, y ≥ x − 1, and y ≤ 7 − x. What is the greatest possible x-value?",["2","3","4","5"],2],["What is true about y > −3x + 2 and y < −3x − 1?",["The solution regions do not overlap","The overlap is the strip between the lines","Every point above both lines is a solution","The two boundaries are the same line"],0]]],["CHALLENGE PROBLEMS","Reason exactly about limiting overlap",[["For y ≥ 2x − 1, y ≤ −x + 8, and x + y ≥ 7, what is the greatest integer x-value for which a solution exists?",["1","2","3","4"],2],["At x = 2, the system y ≥ x + k and y ≤ −x + 6 must have at least one solution. What is the greatest possible value of k?",["0","1","2","4"],2]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});if(n!==18||groups[0][2].length!==3||groups[1][2].length!==8||groups[2][2].length!==5||groups[3][2].length!==2)throw new Error('Problems format must be exactly 3/8/5/2 = 18 questions');document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
