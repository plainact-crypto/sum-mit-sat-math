<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Solving by Substitution — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Solving by Substitution</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Substitute one equation into the other",[["Solve the system x = y + 2 and x + y = 10.",["(6, 4)","(4, 6)","(8, 2)","(5, 5)"],0],["Solve the system y = 2x - 1 and x + y = 11.",["(7, 4)","(4, 7)","(3, 8)","(5, 6)"],1],["Solve the system x = 3y and 2x + y = 14.",["(2, 6)","(7, 0)","(6, 2)","(4, 3)"],2]]],["CORE PRACTICE","Build accuracy with different substitution forms",[["Solve x + y = 9 and y = x - 1.",["(4, 5)","(5, 4)","(6, 3)","(3, 6)"],1],["Solve 2x + y = 13 and y = 3.",["(4, 3)","(6, 3)","(5, 3)","(5, 4)"],2],["Solve y = 4 - x and 3x + 2y = 12.",["(4, 0)","(0, 4)","(2, 2)","(6, -2)"],0],["Solve x = 2y + 1 and 3x - y = 13.",["(3, 1)","(5, 2)","(7, 3)","(4, 2)"],1],["Solve y = 0.5x + 2 and x - y = 4.",["(8, 6)","(10, 7)","(12, 8)","(14, 9)"],2],["Solve 4x - y = 5 and y = x + 1.",["(1, 2)","(2, 3)","(3, 4)","(4, 5)"],1],["Solve y = -2x + 7 and 5x + y = 16.",["(2, 3)","(3, 1)","(4, -1)","(1, 5)"],1],["Solve x + 2y = -1 and x = y - 4.",["(-3, 1)","(-1, 0)","(1, -1)","(-5, 2)"],0]]],["EXAM-STYLE PRACTICE","Translate conditions and substitute efficiently",[["A school club sold 18 tickets. Let a be adult tickets and c be child tickets. If a = 2c + 3, how many adult tickets were sold?",["10","11","13","15"],2],["A repair service uses C = 6h + 4 for a job lasting h hours. If the same job has C = 22, what is h?",["2","3","4","6"],1],["The system x = 3, y = 2x + k has solution y = 11. What is k?",["3","4","5","6"],2],["A rectangle has length L = W + 5 and perimeter 34 units. What is its length?",["6 units","9 units","11 units","12 units"],2],["Two numbers satisfy x + y = 26 and x = 3y - 2. What is x?",["17","18","19","21"],2]]],["CHALLENGE PROBLEMS","Handle fractions and a parameter by substitution",[["Solve y = (x + 4)/3 and 2x - y = 10.",["(34/5, 18/5)","(18/5, 34/5)","(7, 4)","(6, 2)"],0],["The system x = 2 - y and 3x + ky = 10 has a solution with y = 4. What is k?",["2","3","4","5"],2]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
