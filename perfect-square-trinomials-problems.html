<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Perfect-Square Trinomials — Practice Problems | SUMMIT MATH</title></head><body><main class="page-shell"><section class="lesson-card"><div class="crumb">Advanced Math · Factoring</div><div class="page-type">PRACTICE PROBLEMS</div><div class="lesson-title">Perfect-Square Trinomials</div><p>18 original questions · Easy → Challenge</p><div id="sets"></div><a href="../explanation/">← Back to Explanation</a></section></main><script>const groups=[["SKILL CHECK",[["Factor completely: x² + 10x + 25",["(x + 5)²","(x + 10)(x + 5)","(x - 5)²","(x + 25)(x + 1)"],0],["Factor completely: x² - 14x + 49",["(x - 7)²","(x + 7)²","(x - 14)(x - 3.5)","(x - 49)(x - 1)"],0],["Factor completely: 4x² + 12x + 9",["(2x + 3)²","(4x + 3)(x + 3)","(2x - 3)²","(4x + 9)(x + 1)"],0]]],["CORE PRACTICE",[["Factor: 9x² - 24x + 16",["(3x - 4)²","(3x + 4)²","(9x - 4)(x - 4)","(3x - 8)(3x - 2)"],0],["Factor: 25y² + 30y + 9",["(5y + 3)²","(5y - 3)²","(25y + 3)(y + 3)","(5y + 9)(5y + 1)"],0],["Factor: x² + 18x + 81",["(x + 9)²","(x - 9)²","(x + 3)(x + 27)","(x + 18)(x + 4.5)"],0],["Factor: 16m² - 40m + 25",["(4m - 5)²","(4m + 5)²","(8m - 5)(2m - 5)","(16m - 5)(m - 5)"],0],["Factor: 36a² + 60ab + 25b²",["(6a + 5b)²","(6a - 5b)²","(12a + 5b)(3a + 5b)","(36a + 5b)(a + 5b)"],0],["Which statement about x² + 12x + 35 is correct?",["It is not a perfect-square trinomial; it factors as (x + 5)(x + 7).","It is a perfect-square trinomial equal to (x + 6)².","It is a perfect-square trinomial equal to (x + 7)².","It cannot be factored over the integers."],0],["If x² + kx + 64 = (x + 8)², what is k?",["16","8","32","64"],0],["If 9x² - 42x + c = (3x - 7)², what is c?",["49","21","14","42"],0]]],["EXAM-STYLE PRACTICE",[["A square has area 4x² + 20x + 25 square units. Which expression represents its side length?",["2x + 5","4x + 5","2x + 25","4x + 25"],0],["If x² - 2kx + 36 = (x - 6)², what is k?",["6","12","3","-6"],0],["Which trinomial is a perfect-square trinomial?",["49x² + 56x + 16","49x² + 28x + 16","49x² + 64x + 16","49x² + 14x + 16"],0],["Factor completely: 64p² - 80pq + 25q²",["(8p - 5q)²","(8p + 5q)²","(16p - 5q)(4p - 5q)","(64p - 5q)(p - 5q)"],0],["For positive constants a and b, (ax + b)² = 9x² + 24x + 16. What is a + b?",["7","12","5","24"],0]]],["CHALLENGE PROBLEMS",[["Factor completely: 4x⁴ + 20x² + 25",["(2x² + 5)²","(4x² + 5)²","(2x² - 5)²","(4x² + 25)(x² + 1)"],0],["Factor completely: 81x⁶ - 126x³y² + 49y⁴",["(9x³ - 7y²)²","(9x³ + 7y²)²","(27x³ - 7y²)(3x³ - 7y²)","(81x³ - 7y²)(x³ - 7y²)"],0]]]];let n=0,root=document.getElementById('sets');groups.forEach(g=>{let s=document.createElement('section');s.className='lesson-section';s.innerHTML='<h2>'+g[0]+'</h2>';g[1].forEach(q=>{n++;s.innerHTML+='<div class="question"><b>'+n+'. '+q[0]+'</b><ol type="A">'+q[1].map(x=>'<li>'+x+'</li>').join('')+'</ol></div>'});root.appendChild(s)});if(n!==18||groups[0][1].length!==3||groups[1][1].length!==8||groups[2][1].length!==5||groups[3][1].length!==2)throw Error('3/8/5/2 required');</script></body></html>
