<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Factoring by Grouping — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Factoring</div><div class="page-type">LESSON TEST</div><h1>Factoring by Grouping</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Factor: x³ + 5x² + 2x + 10',c:['(x + 5)(x² + 2)','(x + 2)(x² + 5)','(x - 5)(x² - 2)','(x + 10)(x² + 1)'],a:0,why:'Group x²(x+5)+2(x+5), then factor the common binomial: (x+5)(x²+2).'},{level:'EASY-MEDIUM',q:'Factor: 3x³ - 12x² + 2x - 8',c:['(x - 4)(3x² + 2)','(x + 4)(3x² - 2)','(3x - 4)(x² + 2)','(x - 2)(3x² + 4)'],a:0,why:'Group 3x²(x-4)+2(x-4). The common binomial is x-4, giving (x-4)(3x²+2).'},{level:'MEDIUM',q:'Factor completely: x³ + 2x² - 25x - 50',c:['(x + 2)(x - 5)(x + 5)','(x - 2)(x - 5)(x + 5)','(x + 2)(x² + 25)','(x + 5)(x² - 10)'],a:0,why:'Group x²(x+2)-25(x+2)=(x+2)(x²-25), then factor the difference of squares to get (x+2)(x-5)(x+5).'},{level:'HARD',q:'After reordering, factor 8m³ + 6m + 12m² + 9',c:['(2m + 3)(4m² + 3)','(4m + 3)(2m² + 3)','(2m - 3)(4m² - 3)','(m + 3)(8m² + 3)'],a:0,why:'Reorder as 8m³+12m²+6m+9. Group 4m²(2m+3)+3(2m+3), so the factorization is (2m+3)(4m²+3).'},{level:'HARD / EXAM-STYLE',q:'If x³ + kx² + 9x + 9k = (x + 4)(x² + 9) for all x, what is k?',c:['4','9','13','36'],a:0,why:'Expand (x+4)(x²+9)=x³+4x²+9x+36. Matching coefficients gives k=4 and 9k=36.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};</script></body></html>
