<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Polynomial Multiplication — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Polynomial Operations</div><div class="page-type">LESSON TEST</div><h1>Polynomial Multiplication</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Multiply: 5x(2x - 3)',c:['10x² - 15x','10x² - 3x','7x² - 15x','10x - 15'],a:0,why:'Distribute 5x to both terms: 5x·2x = 10x² and 5x·(-3) = -15x.'},{level:'EASY-MEDIUM',q:'Expand: (x + 6)(x - 2)',c:['x² + 4x - 12','x² - 8x - 12','x² + 8x - 12','x² + 4x + 12'],a:0,why:'Multiply each pair: x² - 2x + 6x - 12 = x² + 4x - 12.'},{level:'MEDIUM',q:'Expand and simplify: (2x - 1)(x² + 3x - 4)',c:['2x³ + 5x² - 11x + 4','2x³ + 6x² - 9x + 4','2x³ + 5x² - 5x - 4','2x³ - 5x² - 11x + 4'],a:0,why:'Distribute both terms: 2x³ + 6x² - 8x - x² - 3x + 4 = 2x³ + 5x² - 11x + 4.'},{level:'HARD',q:'A rectangular study board has side lengths (2n + 3) meters and (n - 5) meters. Which polynomial gives its area?',c:['2n² - 7n - 15 m²','2n² + 13n - 15 m²','3n² - 7n - 15 m²','2n² - 10n + 3 m²'],a:0,why:'Area is the product: (2n+3)(n-5)=2n²-10n+3n-15=2n²-7n-15 square meters.'},{level:'HARD / EXAM-STYLE',q:'For what value of k does (x + k)(x - 4) have an x-term of 3x?',c:['7','-7','1','-1'],a:0,why:'The product is x² + (k-4)x - 4k. Set k-4=3, so k=7.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
