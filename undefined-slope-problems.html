<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Undefined Slope — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Undefined Slope</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[["01 · SKILL CHECK","Recognize undefined slope from points and equations",[["A line passes through (4, −3) and (4, 8). What is its slope?",["0","11/4","Undefined","4"],2],["What is the slope of the line x = −6?",["−6","0","6","Undefined"],3],["Which pair of points lies on a line with undefined slope?",["(1,2) and (5,2)","(−3,4) and (−3,9)","(0,0) and (2,2)","(4,1) and (7,−2)"],1]]],["02 · CORE PRACTICE","Use the slope formula, tables, and vertical-line equations",[["Find the slope through (7, 5) and (7, −4).",["−9","0","9","Undefined"],3],["For a line, Δy = 12 and Δx = 0. What is the slope?",["0","1/12","12","Undefined"],3],["Which equation represents the vertical line through (−2, 7)?",["x = −2","y = −2","x = 7","y = 7"],0],["A table lists the points (5, −1), (5, 3), and (5, 10). What is the slope of the line through them?",["0","1","5","Undefined"],3],["Which statement is true for every vertical line?",["Its y-coordinate is constant.","Its x-coordinate is constant.","Its slope is 0.","It has equation y = c."],1],["The points (k, 2) and (k, 11) are distinct. What is the slope of the line through them?",["0","9/k","k/9","Undefined"],3],["Which equation has undefined slope?",["y = −4","y = 3x + 2","2x = 14","x + y = 5"],2],["A line crosses the x-axis at x = 9 and is vertical. Which equation represents the line?",["y = 9","x = 9","y = x + 9","x + y = 9"],1]]],["03 · EXAM-STYLE PRACTICE","Interpret vertical lines in algebraic and real-world settings",[["A map boundary is modeled by a vertical line through points (15, 4) and (15, 19). What is the equation of the boundary?",["y = 15","x = 15","y = 4","x = 19"],1],["The line through (p, −6) and (p, 10) has undefined slope. Which statement must be true?",["The x-coordinates are equal.","The y-coordinates are equal.","The line is horizontal.","The slope equals 16/p."],0],["Which description matches a graph with undefined slope?",["A horizontal line","A vertical line","A line rising left to right","A line falling left to right"],1],["A vertical fence is represented on a coordinate grid by x = −4. Which point must lie on the fence?",["(3,−4)","(−4,8)","(4,−8)","(0,−4)"],1],["The line through (6, a) and (6, b) is defined by two distinct points. Which condition must hold?",["a = b","a ≠ b","a + b = 6","ab = 6"],1]]],["04 · CHALLENGE PROBLEMS","Use undefined slope to determine unknown coordinates",[["The line through (2r − 1, 5) and (11, −3) has undefined slope. What is r?",["5","6","7","12"],1],["The line through (3k + 2, −7) and (20, 9) is vertical. What is k?",["5","6","18","22/3"],1]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
