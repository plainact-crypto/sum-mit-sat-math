<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Collinear Points — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Collinear Points</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Identify collinear points",[["Which point lies on the same line as (1, 2) and (3, 6)?",["(5, 10)","(5, 9)","(4, 10)","(0, 1)"],0],["Are the points (−2, 1), (0, 5), and (3, 11) collinear?",["Yes, all three are collinear.","No, because the first slope is 2 and the second is 3.","No, because the x-values are different.","Yes, but only if the line is horizontal."],0],["The line through (0, −3) and (4, 5) also contains which point?",["(7, 11)","(6, 10)","(5, 8)","(8, 12)"],0]]],["CORE PRACTICE","Use equal slopes and linear equations to test collinearity",[["Which set of three points is collinear?",["(1, 4), (3, 8), (6, 14)","(0, 1), (2, 5), (4, 10)","(−1, 3), (1, 7), (3, 12)","(2, 0), (5, 6), (8, 11)"],0],["The points (2, 5), (5, 11), and (8, k) are collinear. What is k?",["15","16","17","18"],2],["Are A(−4, 7), B(2, −5), and C(5, −11) collinear?",["Yes, because both relevant slopes are −2.","No, because one slope is −2 and the other is −3.","No, because C is farther from the origin.","Yes, because all y-values are odd."],0],["Which point is collinear with every point on y = −3x + 4?",["(−2, 10)","(2, 10)","(−2, 8)","(3, −4)"],0],["The points (1, 3), (4, 9), and (x, 13) are collinear. What is x?",["5","6","7","8"],1],["The points (−1, −5), (3, 7), and (7, y) are collinear. What is y?",["15","17","19","21"],2],["Which point is NOT collinear with (2, 1) and (6, 9)?",["(0, −3)","(3, 3)","(5, 7)","(8, 12)"],3],["Points A, B(2, 5), and C(8, 13) are collinear. Which coordinate could be A?",["(−1, 1)","(−1, 0)","(0, 1)","(5, 8)"],0]]],["EXAM-STYLE PRACTICE","Apply collinearity in coordinates, tables, and context",[["Three markers lie on one straight path at (0, 2), (3, 8), and (6, 14). If the same linear pattern continues, what is the y-coordinate when x = 10?",["18","20","22","24"],2],["A straight survey line passes through A(−4, −1) and B(2, 8). Which point also lies on the survey line?",["(6, 14)","(6, 13)","(4, 12)","(0, 3)"],0],["Which equation can be used to verify that (−2, 7), (1, 1), and (5, −7) are collinear?",["y = −2x + 3","y = 2x + 3","y = −2x − 3","y = −x + 5"],0],["The points (k, −4), (2, 2), and (5, 8) are collinear. What is k?",["−2","−1","0","1"],1],["A table lists points (−3, 11), (0, 5), and (4, −3). Which rule shows that the points are collinear?",["y = −2x + 5","y = 2x + 5","y = −3x + 2","y = −2x − 5"],0]]],["CHALLENGE PROBLEMS","Use hidden coordinates and constant slope",[["The points (a, 2), (4, 8), and (10, 20) are collinear. What is a?",["0","1","2","3"],1],["P(−2, 7), Q(4, −5), and R(r, −15) are collinear. What is r?",["7","8","9","10"],2]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
