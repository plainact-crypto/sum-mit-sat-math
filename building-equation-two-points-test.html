<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Building an Equation from Two Points — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">LESSON TEST</div><h1>Building an Equation from Two Points</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers & Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Which equation represents the line through (0, 2) and (3, 8)?',c:['y = 2x + 2','y = 3x + 2','y = 2x − 2','y = x + 5'],a:0,why:'The slope is (8 − 2)/(3 − 0) = 6/3 = 2. Since the line passes through (0, 2), the y-intercept is 2. Therefore y = 2x + 2.'},{level:'EASY-MEDIUM',q:'Which equation represents the line through (−2, 6) and (4, −3)?',c:['y = −1.5x + 3','y = 1.5x + 9','y = −1.5x − 3','y = −3x'],a:0,why:'The slope is (−3 − 6)/(4 − (−2)) = −9/6 = −1.5. Using (−2, 6), 6 = 3 + b, so b = 3.'},{level:'MEDIUM',q:'A line passes through (1, −2) and (5, 10). What is the value of y when x = 7?',c:['14','16','18','20'],a:1,why:'The slope is (10 − (−2))/(5 − 1) = 12/4 = 3. Using (1, −2), −2 = 3 + b, so b = −5. Then y = 3(7) − 5 = 16.'},{level:'HARD',q:'A service costs $34 for 2 units and $58 for 5 units. Assuming a linear model, which equation gives total cost C for x units?',c:['C = 8x + 18','C = 12x + 10','C = 8x + 34','C = 6x + 22'],a:0,why:'The rate is (58 − 34)/(5 − 2) = 24/3 = 8 dollars per unit. Using (2, 34), 34 = 16 + b, so b = 18. Thus C = 8x + 18.'},{level:'HARD / EXAM-STYLE',q:'A line passes through (−3, 4) and (1, −8). Which standard-form equation represents the line?',c:['3x + y = −5','3x − y = −13','x + 3y = 9','3x + y = 5'],a:0,why:'The slope is (−8 − 4)/(1 − (−3)) = −12/4 = −3. Using (1, −8), −8 = −3 + b, so b = −5. Thus y = −3x − 5, which rearranges to 3x + y = −5.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
