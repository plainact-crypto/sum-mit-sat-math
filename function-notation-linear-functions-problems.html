<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Function Notation for Linear Functions — Practice Problems | SUMMIT SAT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Function Notation for Linear Functions</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[['01 · SKILL CHECK','Evaluate linear functions by substituting the given input',[['If f(x) = 3x + 4, what is f(2)?',['6','10','14','18'],1],['If g(x) = −2x + 7, what is g(−3)?',['1','7','13','−13'],2],['If h(x) = 0.5x − 6, what is h(10)?',['−1','1','4','11'],0]]],['02 · CORE PRACTICE','Work with negative inputs, fractions, decimals, and missing inputs',[['Let p(x) = 5 − 4x. What is p(2)?',['−3','3','−13','13'],0],['Let q(x) = (3/4)x + 2. What is q(8)?',['6','8','10','12'],1],['Let r(x) = −1.5x + 9. What is r(4)?',['−3','3','6','15'],1],['For f(x) = 3x + 2, which input a makes f(a) = 17?',['3','5','7','15'],1],['For g(x) = −5x − 1, which value of k satisfies g(k) = 14?',['−5','−3','3','5'],1],['If f(x) = 7x + 6, what is f(−2)?',['−20','−8','8','20'],1],['If m(t) = 12 − 2.5t, what is m(4)?',['2','4','9.5','22'],0],['Let f(x) = (2/3)x − 5. What is f(6)?',['−1','1','4','9'],0]]],['03 · SAT-STYLE PRACTICE','Interpret function values and solve linear-function situations',[['A ride service models the cost C, in dollars, of an m-mile trip by C(m) = 1.8m + 6. What is C(10)?',['$18','$24','$60','$78'],1],['The function T(h) = 72 − 3h gives the temperature, in degrees Fahrenheit, h hours after noon. What does T(8) = 48 mean?',['At 8:00 p.m., the temperature is 48°F.','At noon, the temperature is 48°F.','The temperature drops 48°F each hour.','After 48 hours, the temperature is 8°F.'],0],['If f(4) = 19, which point must lie on the graph of y = f(x)?',['(19, 4)','(4, 19)','(4, −19)','(−4, 19)'],1],['A gym models a member’s total charge P, in dollars, after m months by P(m) = 35 + 12m. What is P(6)?',['$72','$82','$107','$210'],2],['A tank contains h(t) = 150 − 8t liters after t minutes. After how many minutes will the tank contain 94 liters?',['5','6','7','8'],2]]],['04 · CHALLENGE PROBLEMS','Use function values to recover missing parameters and outputs',[['The linear function f(x) = ax + 5 satisfies f(4) = 29. What is a?',['4','5','6','7'],2],['A linear function g satisfies g(2) = 7 and g(5) = 16. What is g(−1)?',['−5','−2','1','4'],1]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)};</script></body></html>
