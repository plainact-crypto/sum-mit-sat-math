<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Literal Equations — Practice Problems | SUMMIT SAT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Equations in One Variable</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Literal Equations</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[['01 · SKILL CHECK','Isolate the requested variable',[['A = bh. Solve for h.',['A/b','Ab','b/A','A-b'],0],['d = rt. Solve for r.',['dt','d/t','t/d','d-t'],1],['V = lwh. Solve for h.',['V-lw','V/(lw)','lw/V','Vl/w'],1]]],['02 · CORE PRACTICE','Rearrange formulas carefully',[['P = 2l + 2w. Solve for l.',['(P-2w)/2','P/2-2w','2P-w','(P+2w)/2'],0],['y = mx + b. Solve for x.',['(y-b)/m','(y+b)/m','m/(y-b)','my-b'],0],['F = ma. Solve for a.',['Fm','F/m','m/F','F-m'],1],['I = Prt. Solve for t.',['I/(Pr)','IP/r','Pr/I','I-Pr'],0],['C = 2πr. Solve for r.',['C/(2π)','2π/C','Cπ/2','C-2π'],0],['q = (a+b)/c. Solve for b.',['cq-a','q/c-a','cq+a','c(q-a)'],0],['k = 3x - 5y. Solve for x.',['(k+5y)/3','(k-5y)/3','3k+5y','k/3-5y'],0],['s = (u+v)t/2. Solve for v.',['2s/t-u','2st-u','s/(2t)-u','2s/(u+t)'],0]]],['03 · SAT-STYLE PRACTICE','Use formulas in context',[['A trapezoid has A = h(b₁+b₂)/2. Solve for h.',['2A/(b₁+b₂)','A(b₁+b₂)/2','(b₁+b₂)/(2A)','2A-b₁-b₂'],0],['A temperature formula is C = (5/9)(F-32). Solve for F.',['(5/9)C+32','(9/5)C+32','(9/5)(C-32)','(5/9)(C+32)'],1],['The line formula y = mx+b is used with x ≠ 0. Solve for m.',['(y-b)/x','(y+b)/x','x/(y-b)','xy-b'],0],['Simple interest is A = P(1+rt). Solve for t.',['(A/P-1)/r','A/(P+r)','(A-P)r','A/P-r'],0],['A cylinder volume is V = πr²h. Solve for h.',['V/(πr²)','πr²/V','Vπ/r²','V/(2πr)'],0]]],['04 · CHALLENGE PROBLEMS','Handle targets inside grouped expressions',[['z = a(x-c)+d. Solve for x.',['(z-d)/a+c','(z+d)/a-c','a(z-d)+c','(z-d)/(a+c)'],0],['p = (2x+q)/(r-s). Solve for x.',['(p(r-s)-q)/2','p(r-s)-q/2','(p(r+s)-q)/2','(p-q)(r-s)/2'],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)};</script></body></html>
