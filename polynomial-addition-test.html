<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Polynomial Addition — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Polynomial Operations</div><div class="page-type">LESSON TEST</div><h1>Polynomial Addition</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Add: (2x + 5) + (4x - 3)',c:['6x + 2','6x + 8','2x + 2','8x + 2'],a:0,why:'Combine like terms: 2x + 4x = 6x and 5 - 3 = 2, so the sum is 6x + 2.'},{level:'EASY-MEDIUM',q:'Add: (3y² - 2y + 1) + (5y² + 6y - 4)',c:['8y² + 4y - 3','8y² + 8y - 3','2y² + 4y + 5','8y² + 4y + 5'],a:0,why:'Add coefficients of matching powers: (3+5)y² + (-2+6)y + (1-4) = 8y² + 4y - 3.'},{level:'MEDIUM',q:'If P(x)=2x³+4x-7 and Q(x)=-5x³+3x²-x+2, what is P(x)+Q(x)?',c:['-3x³ + 3x² + 3x - 5','7x³ + 3x² + 5x - 5','-3x³ + 3x² + 5x - 9','-7x³ + 3x² + 3x + 9'],a:0,why:'Combine each degree: 2-5=-3, the x² term is 3x², 4-1=3, and -7+2=-5.'},{level:'HARD',q:'The sum of two polynomials is 7x² - 2x + 9. One polynomial is 3x² + 5x - 4. Which is the other polynomial?',c:['4x² - 7x + 13','4x² + 3x + 5','10x² + 3x + 5','4x² - 3x + 13'],a:0,why:'Subtract the known polynomial from the sum: (7-3)x² + (-2-5)x + (9-(-4)) = 4x² - 7x + 13. Adding it back gives the stated sum.'},{level:'HARD / EXAM-STYLE',q:'A school club records (2n² + 3n + 12) visits in one week and (4n² - 5n + 18) the next. Which polynomial represents the total number of visits?',c:['6n² - 2n + 30','6n² + 8n + 30','2n² - 2n + 6','8n² - 2n + 30'],a:0,why:'Add the weekly counts by like terms: (2+4)n² + (3-5)n + (12+18) = 6n² - 2n + 30 visits.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
