<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Combining Like Terms — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Equivalent Expressions</div><div class="page-type">LESSON TEST</div><h1>Combining Like Terms</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Simplify 7x + 4x - 3.',c:['11x - 3','11x + 3','8x - 3','7x + x'],a:0,why:'The x-terms are like terms: 7x+4x=11x. The constant -3 remains, so the result is 11x-3.'},{level:'EASY-MEDIUM',q:'Simplify 5a + 2b - 3a + 6b.',c:['2a + 8b','8a + 8b','2a + 4b','8a + 4b'],a:0,why:'Combine matching variable parts: 5a-3a=2a and 2b+6b=8b.'},{level:'MEDIUM',q:'Simplify 3x² - 4x + 5 + 2x² + 7x - 9.',c:['5x² + 3x - 4','5x² + 11x - 4','5x² + 3x + 14','6x² + 3x - 4'],a:0,why:'Combine by type: 3x²+2x²=5x², -4x+7x=3x, and 5-9=-4.'},{level:'HARD',q:'The expression (k + 2)x + 3x - 5 simplifies to 10x - 5. What is k?',c:['3','5','7','8'],a:1,why:'The x-coefficient is k+2+3=k+5. Matching 10x gives k+5=10, so k=5.'},{level:'HARD / EXAM-STYLE',q:'A rectangle has length 2x + 3 and width x - 1. A second rectangle has perimeter 10x + 4. For what value of x do the two rectangles have equal perimeters?',c:['1','2','3','4'],a:3,why:'The first perimeter is 2(2x+3)+2(x-1)=6x+4. Set 6x+4=10x+4, giving 4x=0? That gives x=0, so this option set would be invalid.'}];qs[4]={level:'HARD / EXAM-STYLE',q:'A rectangle has length 2x + 3 and width x - 1. Its perimeter equals 28. What is x?',c:['2','3','4','5'],a:2,why:'P=2(2x+3)+2(x-1)=4x+6+2x-2=6x+4. Set 6x+4=28: 6x=24, so x=4. Substitution gives length 11, width 3, and perimeter 2(11)+2(3)=28.'};const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
