<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Solving by Square Roots — Practice Problems | SUMMIT MATH</title></head><body><main class="page-shell"><section class="lesson-card"><div class="crumb">Advanced Math · Quadratic Equations</div><div class="page-type">PRACTICE PROBLEMS</div><div class="lesson-title">Solving by Square Roots</div><p>18 original questions · Easy → Challenge</p><div id="sets"></div><a href="../explanation/">← Back to Explanation</a></section></main><script>const groups=[["SKILL CHECK",[["Solve: x² = 64",["±8","8","±32","−8"],0],["Solve: x² = 121",["±11","11","±121","−11"],0],["Solve: 4x² = 100",["±5","±25","5","±10"],0]]],["CORE PRACTICE",[["Solve: x² − 36 = 0",["±6","6","±18","±36"],0],["Solve: 3x² + 6 = 81",["±5","±25","5","±√27"],0],["Solve: (x − 4)² = 9",["1 or 7","−1 or 7","3 or 5","−5 or 13"],0],["Solve: (x + 2)² = 16",["−6 or 2","−4 or 4","2 or 6","−18 or 14"],0],["Solve: (2x − 3)² = 49",["−2 or 5","−5 or 2","2 or 5","−2 or 2"],0],["Solve: 5(x + 1)² = 45",["−4 or 2","−3 or 3","−10 or 8","−2 or 4"],0],["Solve: 2x² − 7 = 43",["±5","±25","5","±√18"],0],["Solve: (3x + 1)² = 10",["(−1 ± √10)/3","−1 ± √10","(1 ± √10)/3","(−1 ± 10)/3"],0]]],["EXAM-STYLE PRACTICE",[["Which solution set satisfies (x − 5)² = 12?",["5 ± 2√3","−5 ± 2√3","5 ± √3","−7 or 17"],0],["A square has area 98 square units. What is its positive side length?",["7√2 units","14 units","49√2 units","2√7 units"],0],["A model is d = 4t², with t ≥ 0. If d = 100, find t.",["5","25","10","2.5"],0],["Solve: 7(x + 3)² − 14 = 0",["−3 ± √2","3 ± √2","−3 ± 2","−1 or 1"],0],["Over the real numbers, which statement about x² + 16 = 0 is correct?",["Two solutions ±4","One solution 4","No real solution","Two solutions ±8"],2]]],["CHALLENGE PROBLEMS",[["Solve: (x² − 5)² = 16",["±1 or ±3","±3 only","±√21","±1 only"],0],["Solve: (2x − 1)² = 3/2",["(2 ± √6)/4","(1 ± √6)/2","(1 ± √3)/2","(2 ± √3)/4"],0]]]];let n=0,root=document.getElementById('sets');groups.forEach(g=>{let s=document.createElement('section');s.className='lesson-section';s.innerHTML='<h2>'+g[0]+'</h2>';g[1].forEach(q=>{n++;s.innerHTML+='<div class="question"><b>'+n+'. '+q[0]+'</b><ol type="A">'+q[1].map(x=>'<li>'+x+'</li>').join('')+'</ol></div>'});root.appendChild(s)});if(n!==18||groups[0][1].length!==3||groups[1][1].length!==8||groups[2][1].length!==5||groups[3][1].length!==2)throw Error('3/8/5/2 required');</script></body></html>
