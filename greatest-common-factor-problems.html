<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Greatest Common Factor — Practice Problems | SUMMIT MATH</title></head><body><main class="page-shell"><section class="lesson-card"><div class="crumb">Advanced Math · Factoring</div><div class="page-type">PRACTICE PROBLEMS</div><div class="lesson-title">Greatest Common Factor</div><p>18 original questions · Easy → Challenge</p><div id="sets"></div><a href="../explanation/">← Back to Explanation</a></section></main><script>const groups=[["SKILL CHECK",[["Factor completely: 12x + 18",["6(2x + 3)","3(4x + 6)","2(6x + 9)","6(x + 3)"],0],["Factor completely: 15a² + 25a",["5a(3a + 5)","5(3a² + 5a)","a(15a + 25)","10a(3a + 5)"],0],["Factor completely: 8m³ - 20m²",["4m²(2m - 5)","4m(2m² - 5m)","2m²(4m - 10)","4m³(2 - 5m)"],0]]],["CORE PRACTICE",[["Factor: 18x³y² + 24x²y³",["6x²y²(3x + 4y)","6xy(3x²y + 4xy²)","3x²y²(6x + 8y)","6x³y³(3 + 4)"],0],["Factor: 20a³b - 30a²b² + 10ab",["10ab(2a² - 3ab + 1)","5ab(4a² - 6ab + 2)","10a(2a²b - 3ab² + b)","10ab(2a³ - 3a²b + 1)"],0],["Factor: 14m²n + 21mn² + 35m",["7m(2mn + 3n² + 5)","7mn(2m + 3n + 5)","7(2m²n + 3mn² + 5m)","14m(mn + 3n² + 5)"],0],["Factor: 24p⁴q² - 36p³q⁵",["12p³q²(2p - 3q³)","12p²q²(2p² - 3pq³)","6p³q²(4p - 6q³)","12p⁴q⁵(2 - 3)"],0],["Factor: 27r³s + 45r²s²",["9r²s(3r + 5s)","3r²s(9r + 15s)","9rs(3r² + 5rs)","9r³s²(3 + 5)"],0],["Factor: 32x⁵ - 48x³ + 16x²",["16x²(2x³ - 3x + 1)","8x²(4x³ - 6x + 2)","16x³(2x² - 3 + x)","16x(2x⁴ - 3x² + x)"],0],["Factor: 21u²v³ - 14uv² + 35uv",["7uv(3uv² - 2v + 5)","7uv²(3uv - 2 + 5/v)","7u(3uv³ - 2v² + 5v)","14uv(3uv² - v + 5)"],0],["Factor: -15a²b + 25ab²",["5ab(-3a + 5b)","-5ab(3a + 5b)","5a(-3ab + 5b²)","10ab(-3a + 5b)"],0]]],["EXAM-STYLE PRACTICE",[["Complete factorization of 42x³ - 56x²?",["14x²(3x - 4)","7x²(6x - 8)","14x(3x² - 4x)","2x²(21x - 28)"],0],["A rectangle has area 18x² + 30x and width 6x. Its length?",["3x + 5","3x² + 5x","12x + 24","6x(3x + 5)"],0],["GCF of 36a⁴b³ and 54a²b⁵?",["18a²b³","18a⁴b⁵","9a²b³","18a²b⁵"],0],["Factor: 16t³ - 40t² + 24t",["8t(2t² - 5t + 3)","4t(4t² - 10t + 6)","8t²(2t - 5 + 3/t)","2t(8t² - 20t + 12)"],0],["12x²y + 18xy² = kxy(2x + 3y). Find k.",["6","3","12","18"],0]]],["CHALLENGE PROBLEMS",[["For positive integer n, factor: 18x^(n+2) + 30x^(n+1) - 12x^n",["6x^n(3x² + 5x - 2)","6x^(n+1)(3x + 5 - 2/x)","3x^n(6x² + 10x - 4)","6x^(n+2)(3 + 5/x - 2/x²)"],0],["If the GCF of 24x^a y³ and 36x⁵y^b is 12x³y², what must hold?",["min(a,5)=3 and min(3,b)=2","a=3 and b=2 only","max(a,5)=3 and max(3,b)=2","a=5 and b=3"],0]]]];let n=0,root=document.getElementById('sets');groups.forEach(g=>{let s=document.createElement('section');s.className='lesson-section';s.innerHTML='<h2>'+g[0]+'</h2>';g[1].forEach(q=>{n++;s.innerHTML+='<div class="question"><b>'+n+'. '+q[0]+'</b><ol type="A">'+q[1].map(x=>'<li>'+x+'</li>').join('')+'</ol></div>'});root.appendChild(s)});if(n!==18||groups[0][1].length!==3||groups[1][1].length!==8||groups[2][1].length!==5||groups[3][1].length!==2)throw Error('3/8/5/2 required');</script></body></html>
