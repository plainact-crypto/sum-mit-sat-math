<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Solving by Substitution — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">LESSON TEST</div><h1>Solving by Substitution</h1><p>Answer all five questions. Results and solutions appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Solve the system y = x + 2 and 2x + y = 11.',c:['(2, 4)','(3, 5)','(4, 6)','(5, 7)'],a:1,why:'Substitute y = x + 2 into 2x + y = 11: 2x + (x + 2) = 11, so 3x = 9 and x = 3. Then y = 5.'},{level:'EASY-MEDIUM',q:'Solve the system x = 2y - 1 and x + y = 11.',c:['(5, 6)','(6, 5)','(7, 4)','(8, 3)'],a:2,why:'Substitute x = 2y - 1 into x + y = 11: 2y - 1 + y = 11, so 3y = 12 and y = 4. Then x = 7.'},{level:'MEDIUM',q:'The system x = 2 and y = 3x + k has solution (2, 11). What is k?',c:['3','4','5','6'],a:2,why:'Substitute x = 2 and y = 11 into y = 3x + k: 11 = 6 + k, so k = 5.'},{level:'HARD',q:'A school store sold 23 items made up of notebooks n and pens p. If n = 2p + 5, how many notebooks were sold?',c:['11','15','17','18'],a:2,why:'Use n + p = 23 and substitute n = 2p + 5: 2p + 5 + p = 23, so 3p = 18 and p = 6. Then n = 17 notebooks.'},{level:'HARD / EXAM-STYLE',q:'Solve the system y = (x + 1)/2 and 3x + y = 17.',c:['(31/7, 19/7)','(33/7, 20/7)','(20/7, 33/7)','(5, 2)'],a:1,why:'Substitute y = (x + 1)/2 into 3x + y = 17: 3x + (x + 1)/2 = 17. Multiply by 2: 6x + x + 1 = 34, so 7x = 33 and x = 33/7. Then y = (33/7 + 1)/2 = 20/7.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
