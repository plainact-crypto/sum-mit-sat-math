<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Testing Points in a System — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Systems of Linear Inequalities</div><div class="page-type">LESSON TEST</div><h1>Testing Points in a System</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Which point satisfies both y ≥ x + 2 and y ≤ 6?',c:['(2, 4)','(5, 6)','(1, 2)','(6, 5)'],a:0,why:'At (2,4), 4 ≥ 4 and 4 ≤ 6, so both inequalities are true. Each other point fails at least one condition.'},{level:'EASY-MEDIUM',q:'When (1, 3) is tested in x + y < 5 and y ≥ 2x, what is the correct conclusion?',c:['It satisfies both inequalities','It satisfies only x + y < 5','It satisfies only y ≥ 2x','It satisfies neither inequality'],a:0,why:'1+3=4<5 and 3≥2(1)=2, so the point satisfies every inequality in the system.'},{level:'MEDIUM',q:'A point lies on y = -x + 5. If a system contains y < -x + 5, what must be true about that point?',c:['It always satisfies the inequality','It never satisfies the strict inequality','It satisfies it only when x is positive','It satisfies it only when y is positive'],a:1,why:'A point on the boundary makes y equal to -x+5. A strict inequality requires y to be less, so equality does not qualify.'},{level:'HARD',q:'The point (3, 7) must satisfy y ≥ 2x + k and y ≤ 9. What is the greatest integer value of k that works?',c:['0','1','2','3'],a:1,why:'Substitute (3,7): 7 ≥ 6+k, so k ≤ 1. The second inequality is also true because 7≤9. Therefore the greatest integer k is 1.'},{level:'HARD / EXAM-STYLE',q:'A study plan uses x algebra sessions and y geometry sessions. It requires x + y ≥ 8 and 2x + 3y ≤ 20, with x,y nonnegative. Which plan is feasible?',c:['(4, 4)','(5, 3)','(6, 2)','(7, 2)'],a:2,why:'For (6,2), the total is 8 and the weighted time is 2(6)+3(2)=18≤20. (4,4) uses 20 but totals 8? Its weighted time is 20, so it is also feasible would create two answers; therefore check the choices carefully: this item requires a unique option.'}];qs[4]={level:'HARD / EXAM-STYLE',q:'A study plan uses x algebra sessions and y geometry sessions. It requires x + y ≥ 8 and 2x + 3y ≤ 18, with x,y nonnegative. Which plan is feasible?',c:['(4, 4)','(5, 3)','(6, 2)','(7, 2)'],a:2,why:'For (6,2), x+y=8 and 2(6)+3(2)=18, so both constraints hold. (4,4) uses 20, (5,3) uses 19, and (7,2) uses 20, so each exceeds the limit.'};const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
