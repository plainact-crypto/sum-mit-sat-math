<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Testing Points in a System — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Systems of Linear Inequalities</div><div class="page-type">LESSON TEST</div><h1>Testing Points in a System</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Which point satisfies both y ≥ x + 2 and y ≤ 6?',c:['(1, 4)','(5, 6)','(3, 4)','(0, 1)'],a:0,why:'At (1,4), 4 ≥ 3 and 4 ≤ 6. Each other choice fails y ≥ x + 2.'},{level:'EASY-MEDIUM',q:'Does (−2, 3) satisfy the system x + y ≤ 2 and y > −x?',c:['Yes, both inequalities are true','No, only x + y ≤ 2 is true','No, only y > −x is true','No, neither inequality is true'],a:0,why:'x+y=1≤2, and 3>2 because −x=2. Both conditions are true.'},{level:'MEDIUM',q:'Which point satisfies x ≥ 0, y ≥ 0, and 2x + y < 8?',c:['(2, 3)','(3, 2)','(4, 0)','(−1, 1)'],a:0,why:'For (2,3), both coordinates are nonnegative and 2(2)+3=7<8. The other choices fail at least one condition.'},{level:'HARD',q:'The point (3, 5) must satisfy y ≥ mx − 1 and y ≤ 6. What is the greatest integer value of m that works?',c:['1','2','3','4'],a:1,why:'5 ≥ 3m−1 gives 6 ≥ 3m, so m ≤ 2. The second inequality 5≤6 is already true. Greatest integer: 2.'},{level:'HARD / EXAM-STYLE',q:'A study group chooses x algebra sessions and y geometry sessions. It requires x ≥ 1, y ≥ 2, x + y ≤ 9, and 2x + 3y ≤ 21. Which plan satisfies every condition?',c:['(2, 5)','(4, 4)','(3, 4)','(6, 2)'],a:2,why:'For (3,4): x≥1, y≥2, x+y=7≤9, and 2(3)+3(4)=18≤21. Every other plan violates the weighted limit.'}];if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+score*20+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};document.documentElement.dataset.theme=localStorage.getItem('summit-theme')||'light';</script></body></html>
