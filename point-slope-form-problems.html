<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Point-Slope Form — Practice Problems | SUMMIT SAT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Equations in Two Variables</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Point-Slope Form</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[['01 · SKILL CHECK','Substitute a slope and point correctly',[['Which equation is in point-slope form for a line with slope 4 through (3, 2)?',['y − 2 = 4(x − 3)','y − 3 = 4(x − 2)','y + 2 = 4(x + 3)','y − 2 = 3(x − 4)'],0],['Which equation represents a line with slope −2 through (−5, 7)?',['y − 7 = −2(x − 5)','y + 7 = −2(x + 5)','y − 7 = −2(x + 5)','y − 5 = −2(x + 7)'],2],['In y + 6 = 3(x − 1), which point is stored in the point-slope form?',['(−1, 6)','(1, −6)','(1, 6)','(−1, −6)'],1]]],['02 · CORE PRACTICE','Read, write, and convert point-slope equations',[['What is the slope of y − 4 = −3(x + 2)?',['−3','−2','2','4'],0],['Which equation has slope 1/2 and passes through (6, −5)?',['y − 5 = (1/2)(x − 6)','y + 5 = (1/2)(x − 6)','y + 6 = (1/2)(x − 5)','y + 5 = 2(x − 6)'],1],['Which point is represented in y − 8 = 5(x − 4)?',['(8, 4)','(−4, 8)','(4, 8)','(4, −8)'],2],['Which point is represented in y + 3 = −(1/4)(x + 7)?',['(7, 3)','(−7, 3)','(7, −3)','(−7, −3)'],3],['Convert y − 5 = 2(x − 3) to slope-intercept form.',['y = 2x − 1','y = 2x + 1','y = 2x − 11','y = 3x − 1'],0],['Convert y + 4 = −3(x − 2) to slope-intercept form.',['y = −3x − 10','y = −3x + 2','y = 3x + 2','y = −3x + 10'],1],['Which point-slope equation represents a horizontal line through (4, −2)?',['y + 2 = 0(x − 4)','y − 2 = 4(x − 0)','y + 4 = −2(x − 0)','y − 4 = 0(x + 2)'],0],['A line has slope −4 and passes through (2, 9). What is y when x = 5?',['−12','−3','3','21'],1]]],['03 · SAT-STYLE PRACTICE','Model constant rates from one observed point',[['A quantity increases at 3 units per hour. After 4 hours, its value is 18. Which equation models the quantity y after x hours?',['y − 18 = 3(x − 4)','y − 4 = 18(x − 3)','y + 18 = 3(x + 4)','y − 18 = 4(x − 3)'],0],['An account balance decreases by $12 per day. After 5 days, the balance is $140. Which equation models balance y after x days?',['y − 140 = 12(x − 5)','y − 140 = −12(x − 5)','y + 140 = −12(x + 5)','y − 5 = −12(x − 140)'],1],['A plant is 26 cm tall at week 3 and grows 4 cm per week. What height does the model predict at week 8?',['30 cm','42 cm','46 cm','58 cm'],2],['A taxi fare changes at a constant rate of $2.50 per mile. A 6-mile trip costs $21. Which point-slope equation models total fare y for x miles?',['y − 21 = 2.5(x − 6)','y − 6 = 2.5(x − 21)','y + 21 = 2.5(x + 6)','y − 21 = 6(x − 2.5)'],0],['The equation y − 72 = −6(x − 4) models a quantity over time. What does −6 represent?',['The quantity starts at −6','The quantity decreases by 6 for each 1-unit increase in x','The value of x is always 6 less than y','The quantity equals 72 when x = −6'],1]]],['04 · CHALLENGE PROBLEMS','Combine point-slope ideas with algebra and slope',[['The equation 3y − 6 = 9(x + 1) is rewritten in point-slope form. Which slope and point does it show?',['slope 9, point (−1, 6)','slope 3, point (1, 2)','slope 3, point (−1, 2)','slope −3, point (−1, −2)'],2],['A line passes through (2, −1) and (6, 7). Which point-slope equation uses the first point (2, −1)?',['y + 1 = 2(x − 2)','y − 1 = 2(x + 2)','y + 1 = (1/2)(x − 2)','y − 7 = 2(x − 6)'],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)};</script></body></html>
