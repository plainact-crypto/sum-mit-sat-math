<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Perpendicular Lines — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Perpendicular Lines</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Recognize negative reciprocal slopes",[["A line is perpendicular to y = 3x − 4. What is its slope?",["−1/3","1/3","−3","3"],0],["Which equation represents a line perpendicular to 2x + 5y = 10?",["5x − 2y = 7","2x + 5y = 7","5x + 2y = 7","2x − 5y = 7"],0],["The line through (1, 2) and (4, 8) is perpendicular to the line through which pair of points?",["(0, 3) and (4, 1)","(0, 1) and (4, 3)","(1, 0) and (3, 4)","(−1, 2) and (3, 10)"],0]]],["CORE PRACTICE","Write and compare perpendicular-line equations",[["Which equation is perpendicular to y = −4x + 7 and passes through (2, 1)?",["y = (1/4)x + 1/2","y = −4x + 9","y = 4x − 7","y = −(1/4)x + 3/2"],0],["A line perpendicular to 3x − 2y = 8 passes through (−2, 5). Which equation represents the new line?",["2x + 3y = 11","3x − 2y = −16","2x − 3y = −19","3x + 2y = 4"],0],["Are y = (1/3)x + 2 and 3x + y = 9 perpendicular?",["Yes, their slopes are negative reciprocals.","No, their slopes are equal.","No, one line has zero slope.","Yes, because both y-intercepts are positive."],0],["The line through (0, 1) and (4, 9) is perpendicular to the line through (2, 3) and (6, k). What is k?",["1","3","5","11"],0],["The line 5x + y = 7 is perpendicular to the line through (1, 4) and (3, p). What is p?",["22/5","−6","6","14"],0],["Which line is perpendicular to y = 6 and passes through (4, −2)?",["x = 4","y = −2","x = −2","y = 4"],0],["Which line is perpendicular to x = 3 and passes through (−5, 7)?",["y = 7","x = −5","x = 7","y = −5"],0],["Which equation is perpendicular to 2x + 4y = 12?",["y = 2x − 3","y = −(1/2)x + 6","y = (1/2)x + 6","y = −2x + 6"],0]]],["EXAM-STYLE PRACTICE","Apply perpendicular slopes in equations and contexts",[["A delivery cost is modeled by C = 2.5d + 8, where d is distance. A second plan has a cost graph perpendicular to the first and passes through (4, 15). Which equation models the second plan?",["C = −0.4d + 16.6","C = 0.4d + 13.4","C = −2.5d + 25","C = 2.5d + 5"],0],["A straight path passes through (−3, 2) and (5, −2). A perpendicular path passes through (1, 6). Which equation represents the perpendicular path?",["y = 2x + 4","y = −2x + 8","y = (1/2)x + 11/2","y = −(1/2)x + 13/2"],0],["For what value of k are kx + 4y = 7 and 3x − 2y = 5 perpendicular?",["8/3","−8/3","6","8"],0],["Line A contains the points (0, 4), (2, 11), and (4, 18). Which pair of points could lie on a line perpendicular to Line A?",["(0, 5) and (7, 3)","(1, 0) and (3, 7)","(0, 2) and (4, 12)","(−1, 5) and (1, 9)"],0],["The line y = (a − 1)x + 4 is perpendicular to y = 5x − 3. What is a?",["4/5","5/4","−4/5","6/5"],0]]],["CHALLENGE PROBLEMS","Solve hidden-coordinate and parameter problems",[["The line through (a, 2) and (6, 10) is perpendicular to y = (4/3)x − 1. What is a?",["50/3","−2","2","14"],0],["The lines 3x + 6y = 9 and 4x + qy = 3 are perpendicular. What is q?",["−2","2","−8","8"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
