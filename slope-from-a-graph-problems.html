<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Slope from a Graph — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Slope from a Graph</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[["01 · SKILL CHECK","Read two clear points from a coordinate graph and calculate rise over run",[["On a coordinate graph, a line passes through (1, 2) and (3, 8). What is the slope?",["2","3","4","6"],1],["A graphed line passes through (−2, 5) and (2, −3). What is its slope?",["−4","−2","2","4"],1],["A line on a graph passes through (0, −1) and (5, 4). What is the slope?",["1/5","1","4/5","5"],1]]],["02 · CORE PRACTICE","Handle fractions, negative slopes, and horizontal or vertical lines",[["A graphed line passes through (−4, −2) and (2, 7). What is the slope?",["2/3","3/2","3","9/2"],1],["A line on a graph passes through (1, 6) and (5, 4). What is the slope?",["−2","−1/2","1/2","2"],1],["A graphed line passes through (−3, −4) and (−1, 2). What is the slope?",["1/3","2","3","6"],2],["A vertical line on a coordinate graph passes through (2, 5) and (2, −1). What is its slope?",["−6","0","6","undefined"],3],["A horizontal line passes through (−5, 3) and (4, 3). What is its slope?",["−1","0","1","undefined"],1],["A graphed line passes through (0.5, 1) and (2.5, 6). What is the slope?",["2","2.5","3","5"],1],["A line passes through (−6, 8) and (−2, 2). What is the slope?",["−3/2","−2/3","2/3","3/2"],0],["A graphed line passes through (−1, −2) and (3, 10). What is the slope?",["2","3","4","12"],1]]],["03 · EXAM-STYLE PRACTICE","Interpret slope from graph information and connect it to equations and rates",[["A line drawn on a grid rises 9 units while moving 12 units to the right. What is its slope?",["3/4","4/3","9","12"],0],["A distance-time graph shows 15 km at 2 hours and 36 km at 5 hours. What is the average rate of change over this interval?",["5 km/h","7 km/h","10.5 km/h","21 km/h"],1],["A temperature graph shows 18° at 4 minutes and 9° at 10 minutes. What is the rate of change?",["−3/2° per minute","−2/3° per minute","2/3° per minute","3/2° per minute"],0],["A graphed line passes through (−2, 1) and (4, 13). Which equation has the same slope and passes through these points?",["y = x + 3","y = 2x + 5","y = 3x + 7","y = 4x + 9"],1],["A line on a graph passes through (1, 4) and (k, 16). If its slope is 4, what is k?",["3","4","5","6"],1]]],["04 · CHALLENGE PROBLEMS","Extend a graphed linear relationship and recover an unknown coordinate",[["A line passes through (−3, 7) and (5, −9). If the same line also passes through (9, y), what is y?",["−21","−17","−13","−5"],1],["A graphed line passes through (a, 2) and (7, 17). If its slope is 3, what is a?",["1","2","3","4"],1]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
