+ 2x − 15 = 0?",["{−3, 5}","{−5, 3}","{−15, 1}","{−1, 15}"],1],["A rectangle has side lengths x + 2 and x + 5 units and area 54 square units. If x must be positive, what is x?",["4","−11","6","9"],0],["A positive integer n satisfies n(n + 5) = 36. What is n?",["9","−4","4","6"],2],["An equation factors as (x − 6)(2x + 5) = 0. What is its solution set?",["{−6, 5/2}","{6, 5/2}","{−5, 12}","{6, −5/2}"],3],["A square has side length x + 3 units and area 49 square units. If x represents a nonnegative length adjustment, what is x?",["10","4","−10","7"],1]]],["CHALLENGE PROBLEMS",[["Solve by factoring as a quadratic in x²: x⁴ − 13x² + 36 = 0",["x = ±2, ±3","x = ±4, ±9","x = ±6","x = 2 or x = 3"],0],["Solve by factoring as a quadratic in x²: 6x⁴ − 13x² + 6 = 0",["x = ±√(2/3), ±√(3/2)","x = ±2/3, ±3/2","x = ±√2, ±√3","x = ±1/2, ±1/3"],0]]]];let n=0,root=document.getElementById('sets');groups.forEach(g=>{let s=document.createElement('section');s.className='lesson-section';s.innerHTML='<h2>'+g[0]+'</h2>';g[1].forEach(q=>{n++;s.innerHTML+='<div class="question"><b>'+n+'. '+q[0]+'</b><ol type="A">'+q[1].map(x=>'<li>'+x+'</li>').join('')+'</ol></div>'});root.appendChild(s)});if(n!==18||groups[0][1].length!==3||groups[1][1].length!==8||groups[2][1].length!==5||groups[3][1].length!==2)throw Error('3/8/5/2 required');</script></body></html>
