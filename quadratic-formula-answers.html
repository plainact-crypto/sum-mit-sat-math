<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Quadratic Formula — Answers | SUMMIT MATH</title></head><body><main class="page-shell"><section class="lesson-card"><div class="crumb">Advanced Math · Quadratic Equations</div><div class="page-type">ANSWERS</div><div class="lesson-title">Quadratic Formula</div><p>Exact answers to the 18 current Practice Problems.</p><div id="answers"></div><a href="../problems/">← Back to Practice Problems</a></section></main><script>const groups=[["SKILL CHECK",[["Use the quadratic formula to solve 2x² − 5x − 3 = 0.","x = 3 or x = −1/2","Here a=2, b=−5, c=−3. The discriminant is 25+24=49, so x=(5±7)/4, giving 3 and −1/2."],["What does the discriminant tell you about x² + 4x + 8 = 0 over the real numbers?","There are no real solutions.","The discriminant is 4²−4(1)(8)=−16. A negative discriminant means no real roots."],["Solve 3x² + 2x − 1 = 0.","x = 1/3 or x = −1","The discriminant is 2²−4(3)(−1)=16. Thus x=(−2±4)/6, giving 1/3 and −1."]]],["CORE PRACTICE",[["Solve exactly: x² − 6x + 1 = 0.","x = 3 ± 2√2","x=(6±√(36−4))/2=(6±√32)/2=3±2√2."],["Solve: 4x² + 4x − 3 = 0.","x = 1/2 or x = −3/2","The discriminant is 16+48=64. So x=(−4±8)/8, giving 1/2 and −3/2."],["Solve: 5x² − 20x + 15 = 0.","x = 1 or x = 3","The discriminant is 400−300=100. Thus x=(20±10)/10, giving 1 and 3."],["Solve exactly: 2x² + x − 4 = 0.","x = (−1 ± √33)/4","The discriminant is 1−4(2)(−4)=33, so x=(−1±√33)/4."],["Solve: 3x² − 12x + 12 = 0.","x = 2","The discriminant is 144−144=0, so there is one repeated root: x=12/6=2."],["Solve: 6x² − x − 2 = 0.","x = 2/3 or x = −1/2","The discriminant is 1+48=49. Hence x=(1±7)/12, giving 2/3 and −1/2."],["Solve exactly: x² + 2x − 7 = 0.","x = −1 ± 2√2","x=(−2±√(4+28))/2=(−2±√32)/2=−1±2√2."],["Over the real numbers, solve 2x² + 4x + 7 = 0.","No real solution","The discriminant is 16−56=−40, so there are no real roots."]]],["EXAM-STYLE PRACTICE",[["A test-style equation is x(x − 5) = 14. What is the solution set?","x = 7 or x = −2","Rewrite as x²−5x−14=0. The discriminant is 25+56=81, so x=(5±9)/2, giving 7 and −2."],["Solve exactly: 0.5x² − 3x − 2 = 0.","x = 3 ± √13","Multiply by 2: x²−6x−4=0. Then x=(6±√52)/2=3±√13."],["The equation x² + kx + 16 = 0 has exactly one real solution and k > 0. What is k?","k = 8","Exactly one real root requires discriminant 0: k²−64=0. Thus k=±8, and k>0 gives k=8."],["Solve 3x² + 7x = 6.","x = 2/3 or x = −3","Rewrite as 3x²+7x−6=0. The discriminant is 49+72=121, so x=(−7±11)/6, giving 2/3 and −3."],["For 2x² − 4x + 9 = 0, which statement is correct over the real numbers?","There are no real solutions because the discriminant is negative.","The discriminant is (−4)²−4(2)(9)=16−72=−56, which is negative."]]],["CHALLENGE PROBLEMS",[["If x = 5 is a solution of x² − (m + 1)x + m = 0, what is m?","m = 5","Substitute x=5: 25−5(m+1)+m=0, so 20−4m=0 and m=5. Substitution back gives 25−30+5=0."],["A rectangle has area 40 square units. Its length is 3 units more than its width. Using the quadratic equation for the dimensions, what are the positive dimensions?","5 units by 8 units","Let width w and length w+3. Then w(w+3)=40, so w²+3w−40=0. The roots are 5 and −8; only the positive width is valid, giving 5 by 8 units."]]]];let n=0,root=document.getElementById('answers');groups.forEach(g=>{let s=document.createElement('section');s.className='lesson-section';s.innerHTML='<h2>'+g[0]+'</h2>';g[1].forEach(a=>{n++;s.innerHTML+='<div class="question"><b>'+n+'. '+a[0]+'</b><p><strong>Answer:</strong> '+a[1]+'</p><p>'+a[2]+'</p></div>'});root.appendChild(s)});if(n!==18||groups[0][1].length!==3||groups[1][1].length!==8||groups[2][1].length!==5||groups[3][1].length!==2)throw Error('Answers must match current Problems 3/8/5/2');</script></body></html>
