<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Systems with Parameters — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">LESSON TEST</div><h1>Systems with Parameters</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'For the system 2x + y = 8 and 4x + 2y = 16, how many solutions are there?',c:['No solution','Exactly one solution','Infinitely many solutions','Not enough information'],a:2,why:'Doubling the first equation gives 4x + 2y = 16, exactly the second equation. The equations represent the same line, so there are infinitely many solutions.'},{level:'EASY-MEDIUM',q:'For x + 2y = 6 and 3x + 6y = c, which value of c makes the system have no solution?',c:['12','15','18','24'],a:1,why:'Tripling x + 2y = 6 gives 3x + 6y = 18. The coefficients are already proportional, so any constant other than 18 gives distinct parallel lines. Among the choices, c = 15 gives no solution.'},{level:'MEDIUM',q:'The equations ax + 3y = 12 and 4x + 6y = 24 have infinitely many solutions. What is a?',c:['1','2','3','4'],a:1,why:'Doubling the first equation must reproduce the second: 2ax + 6y = 24. Thus 2a = 4, so a = 2.'},{level:'HARD',q:'For 3x + ky = 8 and 9x + 15y = 25, what value of k makes the system have no solution?',c:['3','5','8','15'],a:1,why:'Tripling the first equation gives 9x + 3ky = 24. Matching the x- and y-coefficient ratio requires 3k = 15, so k = 5. The constants would then be 24 and 25, so the lines are parallel and distinct.'},{level:'HARD / EXAM-STYLE',q:'Two school supply plans are modeled by C = pn + 12 and C = 4n + 30, where n is the number of supply packs and C is total cost. What value of p makes it impossible for the two plans to have the same cost?',c:['3','4','12','30'],a:1,why:'The plans can never have the same cost when their lines are parallel but distinct. That requires equal slopes, so p = 4. Their different intercepts, 12 and 30, keep the lines distinct.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
