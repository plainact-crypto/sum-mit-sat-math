<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Solving from Tables — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Solving from Tables</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Find the row shared by both relationships",[["Table A lists (0,1), (1,3), (2,5). Table B lists (0,5), (1,3), (2,1). Which ordered pair solves the system?",["(0,1)","(1,3)","(2,5)","(2,1)"],1],["For x-values 0,1,2,3, one table has y-values 2,3,4,5 and the other has y-values 4,3,2,1. Which point appears in both tables?",["(0,2)","(1,3)","(2,4)","(3,1)"],1],["Two tables each contain the row x=4, y=-2. What does that common row represent?",["Only the x-coordinate of a solution","Only the y-coordinate of a solution","A solution (4,-2) to both equations","Proof that the system has no solution"],2]]],["CORE PRACTICE","Compare table values and solution patterns",[["For x=0,1,2,3, Table A for y=2x+1 gives 1,3,5,7 and Table B for y=-x+7 gives 7,6,5,4. Which row solves the system?",["(0,1)","(1,3)","(2,5)","(3,7)"],2],["Table A has rows (0,1),(1,3),(2,5). Table B has rows (0,-4),(1,-2),(2,0). Both continue with the same constant rate. How many solutions does the system have?",["No solutions","Exactly one","Exactly two","Infinitely many"],0],["Table A has (0,2),(1,5),(2,8). Table B has (0,2),(1,5),(2,8), and both relationships are linear. What is the solution count?",["No solutions","One solution","Three solutions","Infinitely many solutions"],3],["For x=-1,0,1,2, the first table has y=-1,2,5,8 and the second has y=7,6,5,4. Which ordered pair is common?",["(-1,-1)","(0,2)","(1,5)","(2,4)"],2],["For x=0,2,4,6, Table A has y=1,2,3,4 and Table B has y=5,4,3,2. Which point solves the system?",["(0,1)","(2,2)","(4,3)","(6,4)"],2],["A table for 2x+y=8 and a table for x-y=-1 both include x=7/3. What y-value should appear in both rows?",["7/3","10/3","13/3","17/3"],1],["Two linear tables share the row (3,8). In the first table, y increases by 2 whenever x increases by 1. In the second, y decreases by 1 whenever x increases by 1. What can you conclude?",["The lines are parallel","(3,8) is their unique solution","They are the same line","There are infinitely many solutions"],1],["Table A contains (0,6),(2,4),(4,2). Table B contains (0,0),(2,2),(4,4). Assuming both patterns are linear, what solution is inferred between the listed rows?",["(0,6)","(2,2)","(3,3)","(4,4)"],2],["A system table shows equal outputs at x=-2: both y-values are 9. What is the system solution represented by that row?",["(-2,9)","(9,-2)","x=9 only","y=-2 only"],0]]],["EXAM-STYLE PRACTICE","Interpret table-based models in context",[["A school club compares two printing plans. For 10,20,30,40 posters, Plan A costs $18,$26,$34,$42 while Plan B costs $42,$38,$34,$30. At which listed quantity are the costs equal?",["10 posters","20 posters","30 posters","40 posters"],2],["Two runners' distance tables are recorded at t=0,2,4,6 minutes. Runner A has distances 1,5,9,13 km and Runner B has 7,9,11,13 km. When are their recorded distances equal?",["2 minutes","6 minutes","9 minutes","13 minutes"],1],["A table for y=kx+2 includes the point (3,14). A second linear table also includes (3,14). What value of k makes the first relationship pass through that common point?",["2","3","4","6"],2],["An exam-style table gives Equation A rows (0,4),(2,8),(4,12) and Equation B rows (0,12),(2,10),(4,8). The relationships are linear. Which statement is correct?",["They meet at (2,8)","They never meet","They are the same line","They meet at (8/3,28/3)"],3],["Two linear tables have exactly the same y-value when x=5, and their rates of change are different. Which conclusion must be true?",["Their unique solution has x=5","They are parallel","They have no solution","They have infinitely many solutions"],0]]],["CHALLENGE PROBLEMS","Use exact values and parameters",[["For x=0,3/2,3, Table A from y=(2/3)x+1 has y=1,2,3. Table B from y=-(2/3)x+3 has y=3,2,1. What is the exact solution?",["(0,1)","(1,5/3)","(3/2,2)","(3,3)"],2],["A table for y=ax-1 and a table for y=-x+7 share the point (2,5). What is a?",["2","3","4","5"],1]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
