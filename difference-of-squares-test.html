<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Difference of Squares — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Factoring</div><div class="page-type">LESSON TEST</div><h1>Difference of Squares</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Factor completely: x² - 49',c:['(x - 7)(x + 7)','(x - 7)²','(x - 49)(x + 1)','(x - 14)(x + 14)'],a:0,why:'Since 49 = 7², use a² - b² = (a - b)(a + b): x² - 49 = (x - 7)(x + 7).'},{level:'EASY-MEDIUM',q:'Which expression is a difference of squares?',c:['9y² - 25','9y² + 25','9y² - 15y + 25','9y² - 10'],a:0,why:'9y² = (3y)² and 25 = 5², so 9y² - 25 is exactly one square minus another square.'},{level:'MEDIUM',q:'Factor completely: 16m² - 81n²',c:['(4m - 9n)(4m + 9n)','(8m - 9n)(8m + 9n)','(4m - 3n)(4m + 3n)','(16m - 81n)(m + n)'],a:0,why:'16m² = (4m)² and 81n² = (9n)², so the factorization is (4m - 9n)(4m + 9n).'},{level:'HARD',q:'A square courtyard has area 121x² square meters. A smaller square section has area 36 square meters. Which expression gives the remaining area in factored form?',c:['(11x - 6)(11x + 6) m²','(121x - 36)(x + 1) m²','(11x - 6)² m²','(11x + 6)² m²'],a:0,why:'The remaining area is 121x² - 36 = (11x)² - 6², which factors as (11x - 6)(11x + 6) square meters.'},{level:'HARD / EXAM-STYLE',q:'If 25x² - k = (5x - 12)(5x + 12) for all x, what is k?',c:['144','24','12','288'],a:0,why:'Expanding conjugates gives (5x)² - 12² = 25x² - 144. Therefore k = 144.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};</script></body></html>
