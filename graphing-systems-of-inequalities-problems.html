<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Graphing Systems of Inequalities — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Systems of Linear Inequalities</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Graphing Systems of Inequalities</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Boundaries · overlap · verification</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Read boundaries and overlap",[["For the system y ≥ x − 1 and y ≤ −x + 5, which point is a solution?",["(0, 0)","(4, 0)","(0, 6)","(5, 5)"],0],["How should the boundaries be drawn for y > 2x + 1 and y ≤ −x + 4?",["Both solid","First solid, second dashed","First dashed, second solid","Both dashed"],2],["The boundary lines y = x − 1 and y = −x + 5 intersect at which point?",["(2, 3)","(3, 2)","(4, 1)","(1, 4)"],1]]],["CORE PRACTICE","Graph, test, and interpret systems",[["Which point satisfies y > x and y ≤ 4?",["(2, 3)","(3, 2)","(5, 5)","(0, 5)"],0],["For y ≥ −2x + 4 and y < x + 1, which statement is true about the boundaries?",["Both are dashed","Both are solid","The first is solid and the second is dashed","The first is dashed and the second is solid"],2],["Which point satisfies x + y ≤ 6 and y ≥ 2?",["(5, 2)","(3, 2)","(4, 3)","(6, 1)"],1],["The lines y = 2x − 3 and y = −x + 6 form boundaries of a system. What is their intersection?",["(2, 1)","(3, 3)","(4, 5)","(1, 5)"],1],["For y < −x + 4, which test point confirms that the side containing the origin should be shaded?",["(0,0), because 0 < 4","(0,0), because 0 > 4","(4,0), because 0 < 0","(0,4), because 4 < 4"],0],["Which system has (1,2) as a solution?",["y > 3x and y < 0","y ≥ x and y ≤ x + 2","y < x and y > 4","y ≤ 0 and y ≥ 3"],1],["For y ≥ 2x − 1 and y ≥ −x + 5, the solution region is best described as points that are",["below both lines","above both lines","between the lines only","on the x-axis"],1],["If a point lies in the shaded region of the first inequality but not the second, what does that mean for the system?",["It is always a solution","It is a boundary point only","It is not a solution to the system","It becomes a solution if coordinates are integers"],2],["For x ≤ 3 and y > −1, which point is in the solution region?",["(4,0)","(3,−1)","(2,0)","(5,−2)"],2]]],["EXAM-STYLE PRACTICE","Combine algebra and graph interpretation",[["A feasible region is defined by x ≥ 0, y ≥ 0, and x + y ≤ 8. Which point is feasible?",["(5,4)","(−1,3)","(3,5)","(2,7)"],2],["The system y ≥ 0.5x + 1 and y ≤ −x + 7 has boundary intersection at",["(2,2)","(4,3)","(3,4)","(6,4)"],1],["Which system produces two parallel boundary lines with no overlapping solution region?",["y > 2x + 3 and y < 2x + 1","y > 2x + 1 and y < 2x + 3","y ≥ x and y ≤ −x","y > x and y > x − 2"],0],["A school can buy notebooks x and folders y subject to x + y ≤ 40 and 2x + y ≤ 60, with x,y ≥ 0. Which order is allowed?",["(30,15)","(25,15)","(20,20)","(10,35)"],2],["For y > −2x + 6 and y ≤ x, which point lies in the overlap?",["(1,2)","(2,2)","(3,3)","(0,5)"],2]]],["CHALLENGE PROBLEMS","Reason about exact overlap conditions",[["For y ≥ 2x − 4 and y ≤ 2x + 1, which statement describes the entire solution set?",["No solutions","All points between and on two parallel lines","Only their intersection point","All points above both lines"],1],["The system y ≥ x + 2 and y ≤ −2x + 8 is restricted to x ≥ 0. What is the greatest x-value for which the two y-conditions can both be true?",["1","2","3","4"],1]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});if(n!==18||groups[0][2].length!==3||groups[1][2].length!==8||groups[2][2].length!==5||groups[3][2].length!==2)throw new Error('Problems format must be exactly 3/8/5/2 = 18 questions');document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
