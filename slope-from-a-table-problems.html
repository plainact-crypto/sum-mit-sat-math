<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Slope from a Table — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Slope from a Table</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[["01 · SKILL CHECK","Use two rows to calculate change in y divided by change in x",[["A table contains the points (1, 5) and (3, 11). What is the slope?",["2","3","5","6"],1],["A table contains the points (−2, 9) and (2, 1). What is the slope?",["−4","−2","2","4"],1],["A table contains the points (0, 4) and (5, 14). What is the slope?",["2/5","2","5/2","10"],1]]],["02 · CORE PRACTICE","Track signs, non-unit x changes, fractions, and zero slope",[["For x-values 2 and 6, the corresponding y-values are 7 and 15. What is the slope?",["1/2","2","4","8"],1],["For x-values −3 and 0, the corresponding y-values are 10 and 4. What is the slope?",["−6","−2","2","6"],1],["For x-values 1 and 5, the corresponding y-values are 9 and 7. What is the slope?",["−2","−1/2","1/2","2"],1],["A table shows x = 0, 4, 8 and y = −3, −3, −3. What is the slope?",["−3","0","3","undefined"],1],["A table contains (−4, 1) and (2, 13). What is the slope?",["1/2","2","6","12"],1],["A table contains (0.5, 2) and (1.5, 5). What is the slope?",["1","2","3","5"],2],["A table contains (2, −1) and (8, −4). What is the slope?",["−2","−1/2","1/2","2"],1],["A linear table shows x = −1, 3, 7 and y = 6, 0, −6. What is the slope?",["−3/2","−2/3","2/3","3/2"],0]]],["03 · EXAM-STYLE PRACTICE","Interpret rates of change and use constant slope in context",[["A delivery vehicle has traveled 12 km after 1 hour and 30 km after 4 hours. What is the average rate of change in distance over this interval?",["3 km/h","6 km/h","9 km/h","18 km/h"],1],["A temperature table shows 72° at 0 minutes and 67° at 10 minutes. What is the rate of change of temperature?",["−2° per minute","−1/2° per minute","1/2° per minute","5° per minute"],1],["A linear table shows x = 2, 6, 10 and y = 5, 8, 11. What is the slope?",["3/8","3/4","4/3","2"],1],["A table shows x = 0, 2, 4, 6 and y = 1, 5, 9, 13. Which statement is true?",["The slope is 1","The slope is 2","The slope is 4","The slope is not constant"],1],["A linear relationship has the points (2, 11) and (5, y). If the slope is −3, what is y?",["−2","2","5","8"],1]]],["04 · CHALLENGE PROBLEMS","Use slope to recover missing values and extend a linear table",[["A table contains the points (1, 4) and (k, 16). If the slope is 3, what is k?",["4","5","6","7"],1],["A linear table contains (−2, 12), (1, 6), and (5, −2). What is the y-value when x = 8?",["−10","−8","−6","0"],1]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
