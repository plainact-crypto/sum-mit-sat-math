<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Two Real Solutions — Answers | SUMMIT MATH</title></head><body><main class="page-shell"><section class="lesson-card"><div class="crumb">Advanced Math · Quadratic Equations</div><div class="page-type">ANSWERS</div><div class="lesson-title">Two Real Solutions</div><p>Exact answers to the 18 current Practice Problems.</p><div id="answers"></div><a href="../problems/">← Back to Practice Problems</a></section></main><script>const groups=[["SKILL CHECK",[["Which equation has two distinct real solutions?","x² − 5x + 6 = 0","It factors as (x−2)(x−3)=0, giving the distinct real solutions x=2 and x=3."],["How many distinct real solutions does x² − 16 = 0 have?","2","x²−16=(x−4)(x+4)=0, so x=4 or x=−4."],["If a quadratic has two distinct real solutions, its discriminant must be:","positive","A quadratic has two distinct real solutions exactly when D=b²−4ac>0."]]],["CORE PRACTICE",[["Solve x² − 9x + 20 = 0.","x = 4 or 5","x²−9x+20=(x−4)(x−5), so x=4 or x=5."],["Which quadratic has two distinct real solutions?","2x² − 7x + 3 = 0","Its discriminant is 49−24=25>0. The other choices have discriminants 0, −15, and 0."],["Solve 3x² − 12x + 9 = 0.","x = 1 or 3","Divide by 3: x²−4x+3=(x−1)(x−3)=0."],["For x² + 2x − 15 = 0, which statement is true?","The solutions are 3 and −5.","x²+2x−15=(x−3)(x+5), so x=3 or x=−5."],["For what values of c does x² − 8x + c = 0 have two distinct real solutions?","c < 16","D=64−4c. Requiring D>0 gives 64−4c>0, so c<16."],["The equation 2x² + bx + 3 = 0 has two distinct real solutions. Which condition must b satisfy?","b² > 24","D=b²−4(2)(3)=b²−24. Two distinct real solutions require D>0."],["What are the solutions of 2x² − 5x − 3 = 0?","x = 3 or −1/2","2x²−5x−3=(2x+1)(x−3), so x=−1/2 or x=3."],["Which factored equation clearly has two distinct real solutions?","(x − 7)(x + 2) = 0","The two different linear factors give x=7 and x=−2."]]],["EXAM-STYLE PRACTICE",[["The equation x² + kx + 25 = 0 has two distinct real solutions. Which condition is equivalent?","k < −10 or k > 10","D=k²−100>0, so |k|>10: k<−10 or k>10."],["A test-style quadratic is 4x² + px + 9 = 0. Which value of p gives two distinct real solutions?","13","D=p²−144. For p=13, D=169−144=25>0; p=12 gives D=0, while 6 and 0 give D<0."],["The graph of y = x² − 10x + m crosses the x-axis at two distinct points. Which condition must m satisfy?","m < 25","Two x-intercepts require D=(−10)²−4m=100−4m>0, so m<25."],["A rectangle has side lengths x − 1 and x − 4 and area 18 square units. Which solutions satisfy the equation (x − 1)(x − 4) = 18?","x = 7 or −2","Expand: x²−5x+4=18, so x²−5x−14=(x−7)(x+2)=0. Algebraically x=7 or −2; for a physical rectangle, x=7 is the valid dimension value."],["For which values of q does 3x² − 12x + q = 0 have two distinct real solutions?","q < 12","D=144−12q>0, so q<12."]]],["CHALLENGE PROBLEMS",[["The equation (r + 1)x² − 8x + 4 = 0 is quadratic and has two distinct real solutions. Which condition on r is correct?","−1 < r < 3","Quadratic requires r+1≠0. Also D=64−16(r+1)=48−16r>0 gives r<3. Among the choices, −1<r<3 is the stated interval that satisfies both conditions."],["A height model is h(t) = −5t² + 20t + s. For the graph to cross h = 0 at two distinct time values algebraically, what condition must s satisfy?","s > −20","D=20²−4(−5)s=400+20s. Two distinct algebraic roots require D>0, so s>−20."]]]];let n=0,root=document.getElementById('answers');groups.forEach(g=>{let s=document.createElement('section');s.className='lesson-section';s.innerHTML='<h2>'+g[0]+'</h2>';g[1].forEach(a=>{n++;s.innerHTML+='<div class="question"><b>'+n+'. '+a[0]+'</b><p><strong>Answer:</strong> '+a[1]+'</p><p>'+a[2]+'</p></div>'});root.appendChild(s)});if(n!==18||groups[0][1].length!==3||groups[1][1].length!==8||groups[2][1].length!==5||groups[3][1].length!==2)throw Error('Answers must match current Problems 3/8/5/2');</script></body></html>
