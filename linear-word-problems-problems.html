<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Linear Equation Word Problems — Practice Problems | SUMMIT SAT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Equations in One Variable</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Linear Equation Word Problems</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[['01 · SKILL CHECK','Translate one relationship and solve',[['A gym charges a $12 registration fee plus $5 per visit. A customer pays $37 total. How many visits did the customer make?',['4','5','6','7'],1],['Seven identical notebooks cost $42 in total. What is the cost of one notebook?',['$5','$6','$7','$8'],1],['After 14 points are deducted from a score, the result is 23. What was the original score?',['9','27','37','47'],2]]],['02 · CORE PRACTICE','Build a one-variable linear model',[['A taxi ride has a $4 starting fee plus $3 per mile. The total fare is $25. How many miles were traveled?',['5','6','7','8'],2],['A cyclist travels at a constant speed of 48 miles per hour and covers 192 miles. How many hours does the trip take?',['3','4','5','6'],1],['Leo is 5 years older than Ana. Their ages add to 31. How old is Ana?',['12','13','14','18'],1],['Two consecutive integers have a sum of 67. What is the smaller integer?',['32','33','34','35'],1],['A worker earns $15 per hour and receives a one-time $20 bonus. The worker earns $95 total. How many hours did the worker work?',['4','5','6','7'],1],['Nora starts with $27 and saves $9 each week. After how many weeks will she have $72?',['4','5','6','7'],1],['A rectangle has width 7 units and perimeter 46 units. What is its length?',['14','15','16','17'],2],['A room starts at 78°F and cools by 3°F each hour. After how many hours will the temperature be 60°F?',['5','6','7','8'],1]]],['03 · SAT-STYLE PRACTICE','Choose and interpret the correct linear equation',[['A streaming plan costs $11 per month plus $4 for each premium rental. One month the bill is $39. How many premium rentals were made?',['6','7','8','9'],1],['A phone plan costs $25 plus $0.08 for each text message beyond the included amount. A customer is charged $33. How many extra text messages were sent?',['80','90','100','110'],2],['A club already has $100 in a fund. Six members each contribute the same amount, bringing the fund to $460. How much does each member contribute?',['$50','$55','$60','$65'],2],['A rental company charges a $35 service fee plus $28 per day. The total charge is $147. For how many days was the item rented?',['3','4','5','6'],1],['Adult tickets cost $12 each and child tickets cost $7 each. A family buys 3 child tickets and some adult tickets for a total of $69. How many adult tickets did they buy?',['3','4','5','6'],1]]],['04 · CHALLENGE PROBLEMS','Combine translation steps without leaving linear equations',[['Three consecutive odd integers have a sum of 87. What is the smallest integer?',['25','27','29','31'],1],['A rectangle has a length that is 3 units more than twice its width. Its perimeter is 54 units. What is the width?',['7','8','9','10'],1]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)};</script></body></html>
