<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Solving by Elimination — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Solving by Elimination</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Add or subtract equations to eliminate one variable",[["Solve the system x + y = 7 and x - y = 1.",["(4, 3)","(3, 4)","(5, 2)","(6, 1)"],0],["Solve the system 2x + y = 11 and 2x - y = 5.",["(3, 5)","(4, 3)","(5, 1)","(2, 7)"],1],["Solve the system 3x + 2y = 16 and 3x - 2y = 8.",["(2, 5)","(3, 4)","(4, 2)","(5, 1)"],2]]],["CORE PRACTICE","Choose the cleanest elimination step and solve accurately",[["Solve x + y = 5 and 2x - y = 4.",["(3, 2)","(2, 3)","(4, 1)","(1, 4)"],0],["Solve 4x + 3y = 18 and 4x - y = 10.",["(2, 4)","(3, 2)","(4, 1)","(1, 14/3)"],1],["Solve 2x + 5y = 20 and 3x - 5y = 5.",["(4, 12/5)","(5, 2)","(6, 8/5)","(3, 14/5)"],1],["Solve 3x + 2y = 12 and 5x - 2y = 4.",["(1, 9/2)","(2, 3)","(3, 3/2)","(4, 0)"],1],["Solve 0.5x + y = 6 and 0.5x - y = 2.",["(6, 3)","(8, 2)","(10, 1)","(4, 4)"],1],["Solve 7x - 2y = 19 and 3x + 2y = 11.",["(2, -5/2)","(3, 1)","(4, 9/2)","(1, -6)"],1],["Solve x + 2y = 1 and -x + 3y = 9.",["(-3, 2)","(3, -1)","(-1, 1)","(5, -2)"],0],["Solve 5x + 4y = 3 and -5x + 2y = 9.",["(-1, 2)","(-9/5, 3)","(3/5, 0)","(-3, 9/2)"],0]]],["EXAM-STYLE PRACTICE","Translate conditions into systems and eliminate efficiently",[["A school event sold 23 tickets. Adult tickets cost $12 and student tickets cost $8. Total revenue was $228. How many adult tickets were sold?",["9","10","11","12"],2],["Three small equipment rentals and two large rentals cost $420. Three small rentals and five large rentals cost $690. What is the cost of one large rental?",["$70","$80","$90","$100"],2],["The system 2x + 3y = 13 and 4x - 3y = k has a solution with x = 2. What is k?",["-3","-1","1","3"],1],["A school supply order satisfies 4n + 3p = 39 and 2n + 3p = 27, where n is the price of one notebook and p is the price of one pen. What is n?",["$4","$5","$6","$7"],2],["The system 0.3x + 0.2y = 2.4 and 0.3x - 0.1y = 0.9 is solved by elimination. What is y?",["3","4","5","6"],2]]],["CHALLENGE PROBLEMS","Use exact fractions and reason about a parameter",[["Solve (1/2)x + (1/3)y = 4 and (1/2)x - (1/3)y = 2.",["(6, 3)","(3, 6)","(8, 0)","(4, 6)"],0],["For what value of k do the equations 3x + 2y = 7 and 6x + ky = 14 represent the same line?",["2","3","4","6"],2]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
