<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Polynomial Multiplication — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Advanced Math · Polynomial Operations</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Polynomial Multiplication</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">monomials · binomials · area models</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Multiply every term and combine like terms",[["Multiply: 3x(2x + 5)",["6x² + 15x","6x² + 5x","5x² + 15x","6x + 15"],0],["Multiply: -2y(4y - 3)",["-8y² + 6y","-8y² - 6y","8y² + 6y","-8y + 6"],0],["Expand: (x + 4)(x + 2)",["x² + 6x + 8","x² + 8x + 6","x² + 2x + 8","2x² + 6x + 8"],0]]],["CORE PRACTICE","Use distribution carefully, then collect matching powers",[["Expand: (x + 7)(x - 3)",["x² + 4x - 21","x² - 10x - 21","x² + 10x - 21","x² + 4x + 21"],0],["Expand: (2x + 5)(x + 3)",["2x² + 11x + 15","2x² + 8x + 15","2x² + 11x + 8","3x² + 11x + 15"],0],["Expand: (3m - 2)(2m + 5)",["6m² + 11m - 10","6m² + 19m - 10","5m² + 11m - 10","6m² - 11m - 10"],0],["Expand: (x - 6)²",["x² - 12x + 36","x² - 36","x² + 12x + 36","x² - 6x + 36"],0],["Multiply: 4a²(3a³ - 2a + 5)",["12a⁵ - 8a³ + 20a²","12a⁶ - 8a³ + 20a²","7a⁵ - 6a³ + 9a²","12a⁵ - 8a² + 20"],0],["Expand: (2p - 3)(2p + 3)",["4p² - 9","4p² + 12p - 9","2p² - 9","4p² + 9"],0],["Expand: (x + 2)(x² - 3x + 4)",["x³ - x² - 2x + 8","x³ - x² + 10x + 8","x³ + 5x² - 2x + 8","x³ - 3x² + 4x + 2"],0],["Multiply: (1/2)x(6x² - 4x + 10)",["3x³ - 2x² + 5x","3x³ - 4x² + 10x","6x³ - 2x² + 5x","3x² - 2x + 5"],0]]],["EXAM-STYLE PRACTICE","Apply polynomial products in test-style algebra and context",[["Which expression is equivalent to (x - 5)(x + 8)?",["x² + 3x - 40","x² - 3x - 40","x² + 13x - 40","x² + 3x + 40"],0],["A rectangle has length (x+6) meters and width (x+2) meters. Which polynomial represents its area?",["x² + 8x + 12 m²","x² + 6x + 12 m²","2x + 8 m²","x² + 12x + 8 m²"],0],["If P(x)=2x+1 and Q(x)=x²-4x+3, what is P(x)Q(x)?",["2x³ - 7x² + 2x + 3","2x³ - 8x² + 7x + 3","2x³ - 7x² + 10x + 3","3x³ - 7x² + 2x + 3"],0],["The side lengths of a rectangular display are (3n-1) cm and (n+4) cm. What is its area?",["3n² + 11n - 4 cm²","3n² + 13n - 4 cm²","4n² + 11n - 4 cm²","3n² + 11n + 4 cm²"],0],["For what value of k does (x+k)(x+3) have an x-term of 10x?",["7","13/3","10","3"],0]]],["CHALLENGE PROBLEMS","Manage higher powers and parameter relationships",[["Expand and simplify: (2x² - x + 3)(x - 4)",["2x³ - 9x² + 7x - 12","2x³ - 5x² + 7x - 12","2x³ - 9x² - x - 12","2x³ - 8x² + 15x - 12"],0],["If (x+a)(x+b)=x²+9x+20 and a>b, what is a-b?",["1","4","9","20"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});if(n!==18||groups[0][2].length!==3||groups[1][2].length!==8||groups[2][2].length!==5||groups[3][2].length!==2)throw new Error('Problems format must be exactly 3/8/5/2 = 18 questions');document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
