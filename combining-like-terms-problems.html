<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Combining Like Terms — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Advanced Math · Equivalent Expressions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Combining Like Terms</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Identify · combine · verify equivalence</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Combine one group of like terms",[["Simplify: 4x + 3x",["7x","7x²","12x","x"],0],["Simplify: 9a - 5a + 2",["4a + 2","14a + 2","4a","4a - 2"],0],["Simplify: 6m + 4 - 2m - 7",["4m - 3","8m - 3","4m + 11","4m + 3"],0]]],["CORE PRACTICE","Group matching variable parts and constants",[["Simplify: 3x + 2y + 5x - y",["8x + y","8x + 3y","8xy + y","3x + y"],0],["Simplify: 7p - 3 + 2 - 4p",["3p - 1","11p - 1","3p - 5","3p + 1"],0],["Simplify: 5x² + 2x - 3x² + 7x",["2x² + 9x","2x² + 5x","9x² + 2x","11x²"],0],["Simplify: -4a + 9a - 6",["5a - 6","-13a - 6","5a + 6","13a - 6"],0],["Simplify: 2m + 3n - 5m + 4n",["-3m + 7n","7m - n","-3m - n","7mn"],0],["Simplify: (1/2)x + (3/4)x",["(5/4)x","(4/6)x","(1/4)x","(5/8)x"],0],["Simplify: 0.6y - 1.4y + 2",["-0.8y + 2","0.8y + 2","-2y + 2","-0.8y"],0],["Simplify: -x + 5 + 6x - 9",["5x - 4","7x - 4","5x + 14","-5x - 4"],0]]],["EXAM-STYLE PRACTICE","Use equivalence and missing coefficients",[["A rectangle has length 3x + 2 and width x - 1. Which expression represents its perimeter in simplest form?",["8x + 2","4x + 1","8x + 6","6x + 2"],0],["The expression 4t + 7 + kt - 2 simplifies to 9t + 5. What is k?",["3","4","5","6"],2],["The expression 2x² + ax + 3x² - 5x simplifies to 5x² + 2x. What is a?",["-7","-3","5","7"],3],["Simplify: 3p + 2q - 5 + p - 4q + 9",["4p - 2q + 4","4p + 6q + 4","2p - 2q + 4","4p - 2q - 14"],0],["Which expression is equivalent to 6x - 2 + 3x + 7?",["9x + 5","9x - 9","3x + 5","18x + 5"],0]]],["CHALLENGE PROBLEMS","Handle several term groups and mixed coefficients",[["Simplify: 2x + 3y + 4x - 5y + x",["7x - 2y","7x + 8y","6x - 2y","7xy - 2y"],0],["Simplify: 0.25a + (3/2)a - 0.75a + 4",["a + 4","2a + 4","0.5a + 4","a - 4"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});if(n!==18||groups[0][2].length!==3||groups[1][2].length!==8||groups[2][2].length!==5||groups[3][2].length!==2)throw new Error('Problems format must be exactly 3/8/5/2 = 18 questions');document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
