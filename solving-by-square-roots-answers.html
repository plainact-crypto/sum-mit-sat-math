<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Solving by Square Roots — Answers | SUMMIT MATH</title></head><body><main class="page-shell"><section class="lesson-card"><div class="crumb">Advanced Math · Quadratic Equations</div><div class="page-type">ANSWERS</div><div class="lesson-title">Solving by Square Roots</div><p>Exact answers to the 18 current Practice Problems.</p><div id="answers"></div><a href="../problems/">← Back to Practice Problems</a></section></main><script>const groups=[["SKILL CHECK",[["x² = 64","x = ±8","Square root both sides: x = ±√64 = ±8."],["x² = 121","x = ±11","x = ±√121 = ±11."],["4x² = 100","x = ±5","Divide by 4: x² = 25, so x = ±5."]]],["CORE PRACTICE",[["x² − 36 = 0","x = ±6","Add 36: x² = 36, so x = ±6."],["3x² + 6 = 81","x = ±5","Subtract 6 and divide by 3: x² = 25, so x = ±5."],["(x − 4)² = 9","x = 1 or 7","x − 4 = ±3, so x = 4 ± 3."],["(x + 2)² = 16","x = −6 or 2","x + 2 = ±4, so x = −2 ± 4."],["(2x − 3)² = 49","x = −2 or 5","2x − 3 = ±7. Thus 2x = 10 or −4."],["5(x + 1)² = 45","x = −4 or 2","Divide by 5: (x+1)²=9. Then x+1=±3."],["2x² − 7 = 43","x = ±5","Add 7 and divide by 2: x²=25."],["(3x + 1)² = 10","x = (−1 ± √10)/3","3x+1=±√10, so 3x=−1±√10."]]],["EXAM-STYLE PRACTICE",[["(x − 5)² = 12","x = 5 ± 2√3","x−5=±√12=±2√3."],["Square area = 98","7√2 units","For positive side s, s²=98, so s=√98=7√2 units."],["d = 4t², t ≥ 0; d = 100","t = 5","100=4t² gives t²=25. Since t≥0, t=5."],["7(x + 3)² − 14 = 0","x = −3 ± √2","Add 14 and divide by 7: (x+3)²=2, so x=−3±√2."],["x² + 16 = 0 over the reals","No real solution","x²=−16, but a real square cannot be negative."]]],["CHALLENGE PROBLEMS",[["(x² − 5)² = 16","x = ±1 or ±3","x²−5=±4. So x²=9 or x²=1, giving ±3 or ±1."],["(2x − 1)² = 3/2","x = (2 ± √6)/4","2x−1=±√(3/2)=±√6/2. Then 2x=1±√6/2, so x=(2±√6)/4."]]]];let n=0,root=document.getElementById('answers');groups.forEach(g=>{let s=document.createElement('section');s.className='lesson-section';s.innerHTML='<h2>'+g[0]+'</h2>';g[1].forEach(a=>{n++;s.innerHTML+='<div class="question"><b>'+n+'. '+a[0]+'</b><p><strong>Answer:</strong> '+a[1]+'</p><p>'+a[2]+'</p></div>'});root.appendChild(s)});if(n!==18||groups[0][1].length!==3||groups[1][1].length!==8||groups[2][1].length!==5||groups[3][1].length!==2)throw Error('Answers must match current Problems 3/8/5/2');</script></body></html>
