<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>No Solution — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">LESSON TEST</div><h1>No Solution</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Which system has no solution?',c:['y = 2x + 1 and y = 2x - 4','y = 2x + 1 and y = -2x + 1','y = 2x + 1 and 2y = 4x + 2','y = 2x + 1 and y = x + 1'],a:0,why:'The first pair has the same slope, 2, but different y-intercepts, 1 and -4. The lines are parallel and distinct, so they never intersect.'},{level:'EASY-MEDIUM',q:'What is the solution status of 3x + 2y = 8 and 6x + 4y = 20?',c:['One solution','No solution','Infinitely many solutions','Exactly two solutions'],a:1,why:'Doubling the first equation gives 6x + 4y = 16, not 20. The left sides are proportional but the constants are inconsistent, so the lines are parallel and distinct.'},{level:'MEDIUM',q:'For what value of p does y = (p - 1)x + 6 form a no-solution system with y = 3x - 2?',c:['2','3','4','5'],a:2,why:'A no-solution linear system needs equal slopes and different intercepts. Set p - 1 = 3, giving p = 4; the intercepts 6 and -2 are already different.'},{level:'HARD',q:'Two delivery plans are modeled by C = 7n + 18 and C = 7n + 31, where n is the number of items. What happens when the costs are set equal?',c:['They are equal at n = 13','They are equal at n = 7','They are equal for every n','There is no value of n that makes them equal'],a:3,why:'Setting the costs equal gives 7n + 18 = 7n + 31. Subtracting 7n gives 18 = 31, a contradiction, so there is no solution.'},{level:'HARD / EXAM-STYLE',q:'For what value of k does the system kx + 6y = 11 and 4x + 12y = 30 have no solution?',c:['1','2','3','4'],a:1,why:'For parallel lines, the x- and y-coefficients must scale by the same factor. Since 6 doubles to 12, k must double to 4, so k = 2. Doubling the first constant gives 22, not 30, so the equations are inconsistent.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
