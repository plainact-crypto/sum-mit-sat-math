<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Rewriting Equivalent Expressions — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Equivalent Expressions</div><div class="page-type">LESSON TEST</div><h1>Rewriting Equivalent Expressions</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Which expression is equivalent to 4(x + 3)?',c:['4x + 3','4x + 12','7x','12x'],a:1,why:'Distribute 4 to both terms: 4·x + 4·3 = 4x + 12.'},{level:'EASY-MEDIUM',q:'Simplify 9y - 4y + 6.',c:['5y + 6','13y + 6','5y - 6','9y + 2'],a:0,why:'Combine only like terms: 9y - 4y = 5y. The constant 6 remains, giving 5y + 6.'},{level:'MEDIUM',q:'Which factored expression is equivalent to 15a² - 10a?',c:['5(3a² - 2a)','5a(3a - 2)','10a(1.5a - 1)','a(15a - 10)'],a:1,why:'The greatest common factor is 5a. Factoring it out gives 5a(3a - 2), which expands back to 15a² - 10a.'},{level:'HARD',q:'For every x, 3(2x - 1) + k is equivalent to 6x + 8. What is k?',c:['5','8','9','11'],a:3,why:'Expand the left side: 6x - 3 + k. Matching constants with 6x + 8 gives -3 + k = 8, so k = 11.'},{level:'HARD / EXAM-STYLE',q:'A rectangular display has width 2x and length x + 7. Which expanded expression represents its area?',c:['2x² + 7','2x² + 14x','3x + 14','2x² + 9x'],a:1,why:'Area = width × length = 2x(x + 7) = 2x² + 14x square units.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
