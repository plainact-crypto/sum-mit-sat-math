<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Factoring Expressions — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Equivalent Expressions</div><div class="page-type">LESSON TEST</div><h1>Factoring Expressions</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Factor completely: 12x + 18.',c:['6(2x + 3)','3(4x + 6)','2(6x + 9)','6(2x + 18)'],a:0,why:'The greatest common factor is 6. Dividing each term by 6 gives 2x and 3, so 12x+18=6(2x+3).'},{level:'EASY-MEDIUM',q:'Factor completely: 20y² - 15y.',c:['5(4y² - 3y)','5y(4y - 3)','10y(2y - 3)','5y(4y - 15)'],a:1,why:'The GCF of 20y² and 15y is 5y. Factoring it out gives 5y(4y-3).'},{level:'MEDIUM',q:'Which expression is the complete factorization of 18a²b + 24ab²?',c:['6ab(3a + 4b)','3ab(6a + 8b)','6a(3ab + 4b²)','6ab(3a + 24b)'],a:0,why:'The numerical GCF is 6, and both terms contain a and b. Therefore the full GCF is 6ab, leaving 3a+4b.'},{level:'HARD',q:'Factor with a negative GCF so the first term inside the parentheses is positive: -28m³ + 42m².',c:['-14m²(2m - 3)','14m²(-2m + 3)','-7m²(4m - 6)','-14m(2m² - 3m)'],a:0,why:'The greatest common factor in magnitude is 14m². Taking out -14m² gives -14m²(2m-3), whose first term inside is positive.'},{level:'HARD / EXAM-STYLE',q:'A rectangle has area 30x³ + 45x² square units. If one side is 15x² units, which expression gives the other side?',c:['2x + 3','2x² + 3','15x + 30','3x + 2'],a:0,why:'Factor the area: 30x³+45x²=15x²(2x+3). Dividing by the given side 15x² leaves 2x+3 units.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
