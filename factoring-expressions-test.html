<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Factoring Expressions — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Advanced Math · Equivalent Expressions</div><div class="page-type">LESSON TEST</div><h1>Factoring Expressions</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Factor completely: 12x + 18.',c:['3(4x + 6)','6(2x + 3)','2(6x + 9)','12(x + 6)'],a:1,why:'The greatest common factor of 12 and 18 is 6. Dividing each term by 6 gives 2x + 3, so 12x + 18 = 6(2x + 3).'},{level:'EASY-MEDIUM',q:'Factor completely: 20m² - 30m.',c:['10m(2m - 3)','5m(4m - 6)','10(2m² - 3m)','20m(m - 3)'],a:0,why:'The terms share 10m. Dividing gives 2m and -3, so the complete factorization is 10m(2m - 3).'},{level:'MEDIUM',q:'Factor with a negative GCF so the first term inside is positive: -18a²b + 12ab².',c:['6ab(-3a + 2b)','-6ab(3a - 2b)','-3ab(6a - 4b)','-6a(3ab - 2b²)'],a:1,why:'The greatest common factor in magnitude is 6ab. Factoring -6ab gives 3a - 2b inside, and distributing returns -18a²b + 12ab².'},{level:'HARD',q:'For x ≠ 0, 24x³ + 36x² = kx²(2x + 3). What is k?',c:['6','9','12','18'],a:2,why:'Match the first term: kx²·2x = 2kx³ = 24x³, so k = 12. The second term confirms it because 12x²·3 = 36x².'},{level:'HARD / EXAM-STYLE',q:'A rectangle has area 18x² + 30x square units and one side is 6x units. Which expression gives the other side?',c:['3x + 5','3x + 30','12x + 24','18x + 5'],a:0,why:'Divide the area by the known side: (18x² + 30x)/(6x) = 3x + 5. Check: 6x(3x + 5) = 18x² + 30x.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});if(qs.length!==5)throw new Error('Lesson Test must contain exactly 5 questions');document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1,ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+(score*20)+'%</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
