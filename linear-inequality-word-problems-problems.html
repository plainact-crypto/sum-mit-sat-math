<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Linear Inequality Word Problems — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Inequalities</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Linear Inequality Word Problems</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Model · solve · interpret</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Translate simple limits and goals",[["A student has read 18 pages of a book and wants to have read at least 70 pages in total. If x is the number of additional pages, what must be true?",["x ≥ 52","x > 52","x ≤ 52","x ≥ 88"],0],["A club has $45 for supplies. A one-time delivery fee is $3 and each notebook costs $6. If n notebooks are ordered, which inequality models the budget?",["3 + 6n ≥ 45","6 + 3n ≤ 45","3 + 6n ≤ 45","6n < 42"],2],["A copier can make at most 200 sheets for one job. Sixty-eight sheets are already printed, and each additional packet contains 12 sheets. What is the greatest whole number of packets that can be added?",["10","11","12","13"],1]]],["CORE PRACTICE","Model and interpret one-variable inequalities",[["A taxi ride costs $5 plus $2.50 per mile. You can spend no more than $30. What is the greatest number of miles you can ride?",["8","9","10","12"],2],["You have saved $75 toward a $240 goal and add $15 each week. What is the least whole number of weeks needed to reach the goal?",["9","10","11","12"],2],["A room holds at most 120 people. There are already 34 people seated, and each new row seats 8 people. What is the greatest whole number of rows that can be added?",["9","10","11","12"],1],["A data plan costs $22 plus $4 per extra gigabyte. For what number g of extra gigabytes will the bill be more than $50?",["g > 7","g ≥ 7","g < 7","g > 18"],0],["A 30 m roll of ribbon already has 4.5 m reserved. Each gift needs 2.5 m. What is the greatest whole number of gifts that can use the remaining ribbon?",["9","10","11","12"],1],["A streaming service costs $12 plus $1.50 per movie rental. To keep the charge below $30, which inequality describes the number m of rentals?",["m ≤ 12","m < 12","m > 12","m < 28"],1],["A fundraiser has collected $48 and earns $22 from each batch of cards sold. At least $180 is needed. What is the least whole number of batches to sell?",["5","6","7","8"],1],["A rectangle has width 7 cm and length x cm. Its perimeter must be less than 50 cm. Which restriction on x is correct?",["x < 18","x ≤ 18","x > 18","x < 11"],0]]],["EXAM-STYLE PRACTICE","Choose the inequality and answer what is asked",[["An airline allows a suitcase to weigh at most 23 kg. The empty suitcase weighs 4.2 kg and each identical book weighs 1.35 kg. What is the greatest whole number of books that can be packed?",["12","13","14","15"],1],["An account has $286. After several equal $31 withdrawals, at least $100 must remain. What is the greatest number of withdrawals possible?",["5","6","7","8"],1],["A student has earned 338 course points and needs at least 420 points to pass. If the final is worth 100 points, what score x is required?",["x > 82","x ≥ 82","x ≤ 82","x ≥ 758"],1],["A ride service charges $8.50 plus $3.70 per kilometer. A traveler has a $64 budget. What is the greatest distance that fits the budget?",["14 km","15 km","16 km","17 km"],1],["A school market sells kits for $38 each. Variable cost is $18 per kit and fixed costs are $260. How many kits must be sold for profit to be greater than $500?",["at least 38","at least 39","at most 39","more than 50"],1]]],["CHALLENGE PROBLEMS","Handle discrete answers and strict boundaries",[["A lab sample starts at 29°C and cools by 3°C each hour. It must remain at or above 17°C. For how many whole hours can it cool while meeting the requirement?",["at most 3","at most 4","at least 4","more than 4"],1],["A prepaid account starts with $120. Each month deducts $17.50, and the user wants more than $15 left after the deductions. What is the greatest whole number of months that can be paid?",["5","6","7","8"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});if(n!==18||groups[0][2].length!==3||groups[1][2].length!==8||groups[2][2].length!==5||groups[3][2].length!==2)throw new Error('Problems format must be exactly 3/8/5/2 = 18 questions');document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
