<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Standard Form — Answers & Solutions | SUMMIT SAT MATH</title><style>.answers-wrap{width:min(980px,100%);margin:auto}.answers-head{text-align:center;margin-bottom:30px}.answers-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.answers-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.answers-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.answers-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.solution{padding:20px 0;border-top:1px solid var(--line)}.solution:first-of-type{border-top:0}.srow{display:flex;gap:12px}.snum{min-width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.sbody{flex:1}.sbody h3{margin:3px 0 10px;font-size:17px}.answer-badge{display:inline-flex;padding:8px 11px;border-radius:999px;background:var(--surface2);font-weight:800;margin-bottom:10px}.work{display:grid;gap:7px}.work code{display:block;padding:10px 12px;border-radius:10px;background:var(--surface2);white-space:normal}.answers-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.answers-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}.answers-footer .primary{background:var(--text);color:var(--bg)}@media(max-width:650px){.answers-section{padding:20px 16px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="answers-wrap"><div class="answers-head"><div class="crumb">Algebra · Linear Equations in Two Variables</div><div class="page-type">ANSWERS & SOLUTIONS</div><h1>Standard Form</h1><div class="answers-meta"><span class="answers-pill">18 complete solutions</span><span class="answers-pill">Matched to Practice Problems</span></div></div><div id="answers"></div><div class="answers-footer"><a href="../problems/">← Back to Practice Problems</a><a href="../explanation/">Review Explanation</a><a class="primary" href="../test/">Take the Lesson Test →</a></div></div></main><script>const groups=[['01 · SKILL CHECK','Questions 1–3',[['In 5x + 2y = 17, what are A, B, and C?','A) A = 5, B = 2, C = 17',['Compare 5x + 2y = 17 with Ax + By = C.']],['In 7x − 4y = 9, what is B?','B) −4',['The coefficient multiplying y is −4.']],['For 8y = 24, what is A?','A) 0',['Write the equation as 0x + 8y = 24.']]]],['02 · CORE PRACTICE','Questions 4–11',[['Which equation is linear and already in standard form?','A) 3x + 2y = 11',['Both variables are first degree and appear as Ax + By = C.']],['In −6x + 5y = −20, what is C?','A) −20',['C is the constant on the right side.']],['Does (2, 1) satisfy 4x + 3y = 11?','A) Yes',['4(2) + 3(1) = 8 + 3 = 11.']],['Does (3, −2) satisfy 2x − y = 8?','A) Yes',['2(3) − (−2) = 6 + 2 = 8.']],['Which ordered pair satisfies x + 2y = 7?','A) (1, 3)',['1 + 2(3) = 7.']],['Which equation shows y = 5 in standard-form structure?','A) 0x + y = 5',['The x coefficient is 0.']],['For 9x = 27, what is B?','A) 0',['Write 9x + 0y = 27.']],['Which equation has A = −2, B = 7, C = 14?','A) −2x + 7y = 14',['Insert the coefficients directly into Ax + By = C.']]]],['03 · SAT-STYLE PRACTICE','Questions 12–16',[['Adult tickets cost $15 and student tickets cost $9; total sales are $180.','A) 15x + 9y = 180',['adult revenue + student revenue = total revenue.']],['Notebooks cost $4 and pens cost $3; total cost is $42.','A) 4x + 3y = 42',['notebook cost + pen cost = total cost.']],['In 2x + 5y = 40, if x = 5, what is y?','C) 6',['2(5) + 5y = 40','10 + 5y = 40','5y = 30 → y = 6']],['In 12x + 8y = 240, if x = 10, what is y?','C) 15',['12(10) + 8y = 240','8y = 120 → y = 15']],['Which pair satisfies 3x + 4y = 60?','A) (4, 12)',['3(4) + 4(12) = 12 + 48 = 60.']]]],['04 · CHALLENGE PROBLEMS','Questions 17–18',[['(3, 2) satisfies kx + 4y = 26. Find k.','C) 6',['3k + 4(2) = 26','3k + 8 = 26','3k = 18 → k = 6']],['(−1, 2) satisfies 5x + by = 1. Find b.','B) 3',['5(−1) + 2b = 1','−5 + 2b = 1','2b = 6 → b = 3']]]]];let n=0,root=document.getElementById('answers');groups.forEach(g=>{const s=document.createElement('section');s.className='answers-section';s.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(q=>{n++;s.innerHTML+='<div class="solution"><div class="srow"><span class="snum">'+n+'</span><div class="sbody"><h3>'+q[0]+'</h3><div class="answer-badge">Answer: '+q[1]+'</div><div class="work">'+q[2].map(x=>'<code>'+x+'</code>').join('')+'</div></div></div></div>'});root.appendChild(s)});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)};</script></body></html>
