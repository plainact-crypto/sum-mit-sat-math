<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Linear Function Translations — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Linear Function Translations</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Recognize basic horizontal and vertical translations",[["The graph of y = 2x + 1 is shifted up 4 units. Which equation represents the translated line?",["y = 2x + 5","y = 2x − 3","y = 6x + 1","y = 2x + 4"],0],["The graph of y = −3x + 7 is shifted down 5 units. Which equation represents the translated line?",["y = −3x + 2","y = −3x + 12","y = 2x + 7","y = −8x + 7"],0],["Let f(x) = x − 2. The graph is shifted right 3 units. Which equation represents the new function?",["y = x − 5","y = x + 1","y = x − 3","y = x + 5"],0]]],["CORE PRACTICE","Translate linear functions and compare equations",[["Let f(x) = 4x + 1. Which equation results from shifting its graph left 2 units?",["y = 4x + 9","y = 4x − 7","y = 4x + 3","y = 2x + 1"],0],["The line y = −2x + 6 is shifted up 3 units. What is the new y-intercept?",["9","3","6","−9"],0],["The line y = 0.5x − 4 is shifted down 6 units. Which equation represents the translated line?",["y = 0.5x − 10","y = 0.5x + 2","y = 6.5x − 4","y = −5.5x − 4"],0],["Let f(x) = 3x − 5. Which equation represents a shift right 4 units?",["y = 3x − 17","y = 3x + 7","y = 3x − 9","y = 7x − 5"],0],["Let f(x) = −x + 2. Which equation represents a shift left 5 units?",["y = −x − 3","y = −x + 7","y = −x − 5","y = 4x + 2"],0],["The line y = 2x + 3 is translated to y = 2x − 4. What translation occurred?",["Down 7 units","Up 7 units","Right 7 units","Left 7 units"],0],["If f(x) = x + 8 and g(x) = x + 1, how is the graph of g related to the graph of f?",["Shifted down 7 units","Shifted up 7 units","Shifted right 1 unit","Shifted left 8 units"],0],["A translated line has the same slope as y = −4x + 5 and has y-intercept 11. Which translation maps the original line to the new line?",["Up 6 units","Down 6 units","Right 6 units","Left 6 units"],0]]],["EXAM-STYLE PRACTICE","Apply translations to models, points, and function notation",[["A linear cost model is C = 2.5m + 6. A new plan lowers only the starting fee by $2 while keeping the per-unit rate unchanged. Which model represents the new plan?",["C = 2.5m + 4","C = 2.5m + 8","C = 0.5m + 6","C = 4.5m + 6"],0],["The graph of T = 3t + 10 is shifted right 2 units with no vertical shift. Which equation represents the translated graph?",["T = 3(t − 2) + 10","T = 3(t + 2) + 10","T = 3t + 12","T = 3t + 8"],0],["The point (0, 2) lies on a line. The entire line is shifted left 3 units. Which point must lie on the translated line?",["(−3, 2)","(3, 2)","(0, −1)","(0, 5)"],0],["For a linear function f, g(x) = f(x) + 5. If f(4) = 7, what is g(4)?",["12","2","28","9"],0],["For a linear function f, g(x) = f(x − 6). If (2, −1) lies on the graph of f, which point lies on the graph of g?",["(8, −1)","(−4, −1)","(2, 5)","(2, −7)"],0]]],["CHALLENGE PROBLEMS","Combine horizontal and vertical translation rules",[["Let f(x) = 2x − 3 and g(x) = f(x + h) − 4. If g(x) = 2x + 7, what is h?",["7","−7","5","3"],0],["The line y = −3x + 2 is translated right a units and then up 5 units. The final equation is y = −3x + 19. What is a?",["4","6","12","2"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
