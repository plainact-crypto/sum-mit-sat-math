<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Building an Equation from Slope and One Point — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Building an Equation from Slope and One Point</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[["01 · SKILL CHECK","Use a slope and one point to build a linear equation",[["A line has slope 2 and passes through (3, 5). Which equation represents the line?",["y = 2x − 1","y = 2x + 1","y = 3x − 4","y = x + 2"],0],["A line has slope −4 and passes through (1, 7). Which equation represents the line?",["y = −4x + 3","y = 4x + 3","y = −4x + 11","y = −x + 11"],2],["A line has slope 1/2 and passes through (−2, 3). Which equation represents the line?",["y = (1/2)x + 4","y = (1/2)x + 2","y = 2x + 7","y = −(1/2)x + 2"],0]]],["02 · CORE PRACTICE","Write equations from positive, negative, zero, fractional, and decimal slopes",[["A line has slope 0 and passes through (5, −6). Which equation represents the line?",["y = 5","y = −6","x = 5","y = −6x"],1],["A line has slope 3 and passes through (−1, 2). Which equation represents the line?",["y = 3x + 5","y = 3x − 1","y = −3x + 5","y = x + 3"],0],["A line has slope −2 and passes through (4, −3). Which equation represents the line?",["y = −2x − 11","y = 2x − 11","y = −2x + 5","y = −x + 1"],2],["A line has slope 2/3 and passes through (6, 1). Which equation represents the line?",["y = (2/3)x − 3","y = (3/2)x − 8","y = (2/3)x + 5","y = −(2/3)x + 5"],0],["A line has slope −1/4 and passes through (−8, 5). Which equation represents the line?",["y = −(1/4)x + 3","y = (1/4)x + 7","y = −4x − 27","y = −(1/4)x + 7"],0],["A line has slope 1.5 and passes through (2, −1). Which equation represents the line?",["y = 1.5x + 2","y = 1.5x − 4","y = −1.5x + 2","y = 0.5x − 2"],1],["A quantity increases by 5 units per hour. After 3 hours, its value is 22. Which equation models its value y after x hours?",["y = 5x + 7","y = 5x + 22","y = 3x + 7","y = −5x + 37"],0],["A quantity decreases by 7 units whenever x increases by 1. It has value 30 when x = 4. Which equation models y?",["y = −7x + 58","y = 7x + 2","y = −7x + 26","y = −4x + 46"],0]]],["03 · EXAM-STYLE PRACTICE","Apply slope-and-point information in equations and contexts",[["A line has slope 4 and passes through (2, −5). What is the value of y when x = 6?",["7","9","11","13"],2],["A temperature decreases by 2.5°C each hour. At t = 3 hours, the temperature is 18°C. Which equation models T after t hours?",["T = −2.5t + 25.5","T = 2.5t + 10.5","T = −2.5t + 18","T = −3t + 27"],0],["A cost increases by $12 for each item. The cost for 5 items is $95. Which equation models total cost C for x items?",["C = 12x + 35","C = 12x + 95","C = 19x","C = 12x − 35"],0],["A line has slope −3/2 and passes through (4, 7). What is its y-intercept?",["1","7","13","17"],2],["A line has slope 5/3 and passes through (3, −2). Which standard-form equation represents the line?",["5x − 3y = 21","5x + 3y = 9","3x − 5y = 19","5x − 3y = 9"],0]]],["04 · CHALLENGE PROBLEMS","Connect slope, a known point, and hidden equation information",[["A line has slope k + 1, passes through (2, 11), and has y-intercept 3. What is k?",["2","3","4","5"],1],["A line passes through (6, −1). For every increase of 4 in x, y decreases by 10. Which equation represents the line?",["y = −(5/2)x + 14","y = −(2/5)x + 7/5","y = (5/2)x − 16","y = −(5/2)x − 16"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
