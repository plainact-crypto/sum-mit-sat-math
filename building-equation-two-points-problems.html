<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Building an Equation from Two Points — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Building an Equation from Two Points</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[["01 · SKILL CHECK","Find the line determined by two points",[["Which equation represents the line through (1, 3) and (4, 9)?",["y = 2x + 1","y = 2x − 1","y = 3x","y = x + 5"],0],["Which equation represents the line through (−2, 5) and (2, −3)?",["y = −2x + 1","y = 2x + 1","y = −x + 3","y = −2x − 1"],0],["Which equation represents the line through (0, −4) and (6, −1)?",["y = (1/2)x − 4","y = 2x − 4","y = (1/2)x + 4","y = −(1/2)x − 4"],0]]],["02 · CORE PRACTICE","Build linear equations with zero, positive, negative, fractional, and decimal slopes",[["Which equation represents the line through (2, 7) and (5, 7)?",["y = 7","x = 7","y = 2x + 3","y = 5"],0],["Which equation represents the line through (−3, −2) and (1, 10)?",["y = 3x + 7","y = 3x − 7","y = −3x + 7","y = 4x + 10"],0],["Which equation represents the line through (4, 5) and (10, −1)?",["y = −x + 9","y = x + 1","y = −x + 5","y = −2x + 13"],0],["Which equation represents the line through (−4, 1) and (2, 4)?",["y = (1/2)x + 3","y = 2x + 9","y = (1/2)x − 1","y = −(1/2)x + 3"],0],["Which equation represents the line through (2, −5) and (8, −8)?",["y = −(1/2)x − 4","y = (1/2)x − 6","y = −2x − 1","y = −(1/2)x + 4"],0],["Which equation represents the line through (2, 4) and (6, 10)?",["y = 1.5x + 1","y = 1.5x − 1","y = 0.5x + 3","y = 2x"],0],["A quantity has value 14 when x = 2 and value 29 when x = 5. Assume a linear relationship. Which equation models y?",["y = 5x + 4","y = 3x + 8","y = 5x + 14","y = −5x + 24"],0],["A total cost is $41 for 3 items and $69 for 7 items. Assume the cost is linear in the number of items x. Which equation models total cost C?",["C = 7x + 20","C = 7x + 41","C = 4x + 29","C = 10x + 11"],0]]],["03 · EXAM-STYLE PRACTICE","Apply two-point information in equations and contexts",[["A line passes through (−1, 2) and (3, 14). What is the value of y when x = 6?",["20","21","23","26"],2],["A temperature is 30°C at t = 2 hours and 20°C at t = 6 hours. Assume a linear change. Which equation models temperature T?",["T = −2.5t + 35","T = 2.5t + 25","T = −5t + 40","T = −2.5t + 30"],0],["A total cost is $58 for 4 units and $108 for 9 units. Which linear equation models total cost C for x units?",["C = 10x + 18","C = 10x + 58","C = 5x + 38","C = 18x − 14"],0],["A line passes through (2, 9) and (8, 0). What is its y-intercept?",["9","10","12","15"],2],["Which standard-form equation represents the line through (1, 4) and (5, 12)?",["2x − y = −2","2x + y = 6","x − 2y = −7","2x − y = 2"],0]]],["04 · CHALLENGE PROBLEMS","Use two-point relationships with hidden information",[["A line passes through (2, k) and (6, 15) and has y-intercept 3. What is k?",["5","7","9","11"],1],["A line passes through (a, 5) and (6, −1). Its slope is −3/2. What is a?",["−2","0","2","4"],2]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
