<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Graphing One-Variable Inequalities — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Inequalities</div><div class="page-type">LESSON TEST</div><h1>Graphing One-Variable Inequalities</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Which number-line graph represents x < 6?',c:['Open circle at 6, shade left','Closed circle at 6, shade left','Open circle at 6, shade right','Closed circle at 6, shade right'],a:0,why:'The strict symbol < excludes 6, so the endpoint is open. Values less than 6 lie to the left.'},{level:'EASY-MEDIUM',q:'A graph has a closed circle at -3 and is shaded to the right. Which inequality does it represent?',c:['x > -3','x ≥ -3','x < -3','x ≤ -3'],a:1,why:'A closed circle includes -3, and shading right represents values greater than the endpoint. Therefore x ≥ -3.'},{level:'MEDIUM',q:'Solve 4x - 5 ≤ 11 and choose its graph.',c:['Open circle at 4, shade left','Closed circle at 4, shade left','Closed circle at 4, shade right','Open circle at 4, shade right'],a:1,why:'4x - 5 ≤ 11 gives 4x ≤ 16, so x ≤ 4. Equality is included, giving a closed circle at 4 with shading left.'},{level:'HARD',q:'Solve -5x + 2 > 17 and choose its graph.',c:['Open circle at -3, shade left','Closed circle at -3, shade left','Open circle at -3, shade right','Closed circle at 3, shade left'],a:0,why:'Subtract 2: -5x > 15. Dividing by -5 reverses the inequality, so x < -3. The endpoint is open and the shading goes left.'},{level:'HARD / EXAM-STYLE',q:'A storage shelf can hold at most 72 kg. It already holds 18 kg, and identical boxes each weigh 6 kg. If b is the number of additional boxes, which graph represents the possible values from the weight condition?',c:['b ≥ 9: closed at 9, shade right','b < 9: open at 9, shade left','b ≤ 9: closed at 9, shade left','b > 9: open at 9, shade right'],a:2,why:'The condition is 18 + 6b ≤ 72. Then 6b ≤ 54, so b ≤ 9. The endpoint 9 is included, so use a closed circle at 9 and shade left.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
