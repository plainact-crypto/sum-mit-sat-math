<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Negative Slope — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Negative Slope</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[["01 · SKILL CHECK","Recognize and calculate basic negative slope",[["A line passes through (1, 10) and (5, 2). What is its slope?",["−4","−2","2","8"],1],["What is the slope of y = −0.6x + 7?",["−7","−0.6","0.6","7"],1],["A table contains the points (−3, 8), (1, 0), and (5, −8). What is the slope?",["−4","−2","2","4"],1]]],["02 · CORE PRACTICE","Work with points, equations, tables, and rates while keeping the slope negative",[["Find the slope through (−4, 9) and (2, −3).",["−3","−2","2","6"],1],["Find the slope through (7, −1) and (3, 9).",["−5/2","−2/5","5/2","10/4"],0],["What is the slope of y = −(7/3)x + 4?",["−7/3","−3/7","4","7/3"],0],["A line falls 18 units while moving 6 units to the right. What is its slope?",["−18","−3","1/3","3"],1],["A table includes the points (2, 11) and (6, 3). What is the slope?",["−4","−2","2","8"],1],["For a line, Δx = −5 and Δy = 20. What is the slope?",["−4","−1/4","1/4","4"],0],["The line through (1, 12) and (5, k) has slope −3. What is k?",["−3","0","3","9"],1],["For f(x) = −1.25x + 6, what is the rate of change?",["−6","−1.25","1.25","6"],1]]],["03 · EXAM-STYLE PRACTICE","Interpret negative slope in realistic and algebraic settings",[["A temperature is 78°F at 2 p.m. and 60°F at 8 p.m. If the change is linear, what is the rate of change?",["−18°F per hour","−6°F per hour","−3°F per hour","3°F per hour"],2],["A tank contains 92 liters after 1 minute and 52 liters after 5 minutes. If the amount changes linearly, what is the slope?",["−40 liters/minute","−10 liters/minute","−8 liters/minute","10 liters/minute"],1],["Which equation represents the line through (0, 5) and (4, −3)?",["y = −2x + 5","y = −2x − 5","y = 2x + 5","y = 5x − 2"],0],["A linear table contains (−2, 7), (1, 1), and (4, −5). Which statement correctly describes the slope?",["The output decreases by 2 per input unit.","The output decreases by 6 per input unit.","The output increases by 2 per input unit.","The slope is −1/2."],0],["The line through (a, 14) and (10, 2) has slope −3/2. What is a?",["2","4","6","8"],0]]],["04 · CHALLENGE PROBLEMS","Extend negative-slope relationships and recover unknown coordinates",[["A line passes through (−5, 16) and (1, 4). If the same line also passes through (8, y), what is y?",["−14","−10","2","18"],1],["The line through (2, k) and (10, −7) has slope −5/4. What is k?",["−17","−3","3","7"],2]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
