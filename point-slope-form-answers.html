<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Point-Slope Form — Answers & Solutions | SUMMIT SAT MATH</title><style>.answers-wrap{width:min(980px,100%);margin:auto}.answers-head{text-align:center;margin-bottom:30px}.answers-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.answers-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.answers-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.answers-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.solution{padding:20px 0;border-top:1px solid var(--line)}.solution:first-of-type{border-top:0}.srow{display:flex;gap:12px}.snum{min-width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.sbody{flex:1}.sbody h3{margin:3px 0 10px;font-size:17px}.answer-badge{display:inline-flex;padding:8px 11px;border-radius:999px;background:var(--surface2);font-weight:800;margin-bottom:10px}.work{display:grid;gap:7px}.work code{display:block;padding:10px 12px;border-radius:10px;background:var(--surface2);white-space:normal}.answers-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.answers-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}.answers-footer .primary{background:var(--text);color:var(--bg)}@media(max-width:650px){.answers-section{padding:20px 16px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="answers-wrap"><div class="answers-head"><div class="crumb">Algebra · Linear Equations in Two Variables</div><div class="page-type">ANSWERS & SOLUTIONS</div><h1>Point-Slope Form</h1><div class="answers-meta"><span class="answers-pill">18 complete solutions</span><span class="answers-pill">Matched to Practice Problems</span></div></div><div id="answers"></div><div class="answers-footer"><a href="../problems/">← Back to Practice Problems</a><a href="../explanation/">Review Explanation</a><a class="primary" href="../test/">Take the Lesson Test →</a></div></div></main><script>const groups=[['01 · SKILL CHECK','Questions 1–3',[[`Which equation is in point-slope form for a line with slope 4 through (3, 2)?`,'A) y − 2 = 4(x − 3)',['Use y − y₁ = m(x − x₁).','With m = 4 and (x₁, y₁) = (3, 2), y − 2 = 4(x − 3).']],['Which equation represents a line with slope −2 through (−5, 7)?','C) y − 7 = −2(x + 5)',['Substitute x₁ = −5: x − (−5) = x + 5.','So y − 7 = −2(x + 5).']],['In y + 6 = 3(x − 1), which point is stored in the point-slope form?','B) (1, −6)',['Rewrite y + 6 as y − (−6).','The stored point is (1, −6).']]]],['02 · CORE PRACTICE','Questions 4–11',[[`What is the slope of y − 4 = −3(x + 2)?`,'A) −3',['In y − y₁ = m(x − x₁), the coefficient multiplying the x-parenthesis is m.','Here m = −3.']],['Which equation has slope 1/2 and passes through (6, −5)?','B) y + 5 = (1/2)(x − 6)',['y − (−5) = (1/2)(x − 6).','Therefore y + 5 = (1/2)(x − 6).']],['Which point is represented in y − 8 = 5(x − 4)?','C) (4, 8)',['Compare with y − y₁ = m(x − x₁).','x₁ = 4 and y₁ = 8.']],['Which point is represented in y + 3 = −(1/4)(x + 7)?','D) (−7, −3)',['y + 3 = y − (−3), and x + 7 = x − (−7).','So the point is (−7, −3).']],['Convert y − 5 = 2(x − 3) to slope-intercept form.','A) y = 2x − 1',['Distribute: y − 5 = 2x − 6.','Add 5: y = 2x − 1.']],['Convert y + 4 = −3(x − 2) to slope-intercept form.','B) y = −3x + 2',['Distribute: y + 4 = −3x + 6.','Subtract 4: y = −3x + 2.']],['Which point-slope equation represents a horizontal line through (4, −2)?','A) y + 2 = 0(x − 4)',['A horizontal line has slope 0.','Using (4, −2): y − (−2) = 0(x − 4), so y + 2 = 0(x − 4).']],['A line has slope −4 and passes through (2, 9). What is y when x = 5?','B) −3',['Use y − 9 = −4(x − 2).','At x = 5: y − 9 = −4(3) = −12, so y = −3.']]]],['03 · SAT-STYLE PRACTICE','Questions 12–16',[[`A quantity increases at 3 units per hour. After 4 hours, its value is 18. Which equation models the quantity y after x hours?`,'A) y − 18 = 3(x − 4)',['The rate is the slope m = 3 and the observed point is (4, 18).','Point-slope form gives y − 18 = 3(x − 4).']],['An account balance decreases by $12 per day. After 5 days, the balance is $140. Which equation models balance y after x days?','B) y − 140 = −12(x − 5)',['A decrease of 12 per day means m = −12.','Using (5, 140): y − 140 = −12(x − 5).']],['A plant is 26 cm tall at week 3 and grows 4 cm per week. What height does the model predict at week 8?','C) 46 cm',['Model: y − 26 = 4(x − 3).','At x = 8: y − 26 = 4(5) = 20, so y = 46 cm.']],['A taxi fare changes at a constant rate of $2.50 per mile. A 6-mile trip costs $21. Which point-slope equation models total fare y for x miles?','A) y − 21 = 2.5(x − 6)',['The slope is 2.5 dollars per mile and the known point is (6, 21).','Thus y − 21 = 2.5(x − 6).']],['The equation y − 72 = −6(x − 4) models a quantity over time. What does −6 represent?','B) The quantity decreases by 6 for each 1-unit increase in x',['−6 is the slope.','A slope of −6 means y changes by −6 whenever x increases by 1.']]]],['04 · CHALLENGE PROBLEMS','Questions 17–18',[[`The equation 3y − 6 = 9(x + 1) is rewritten in point-slope form. Which slope and point does it show?`,'C) slope 3, point (−1, 2)',['Divide every term by 3: y − 2 = 3(x + 1).','This is y − 2 = 3(x − (−1)), so slope = 3 and point = (−1, 2).']],['A line passes through (2, −1) and (6, 7). Which point-slope equation uses the first point (2, −1)?','A) y + 1 = 2(x − 2)',['Slope = (7 − (−1))/(6 − 2) = 8/4 = 2.','Using (2, −1): y − (−1) = 2(x − 2), or y + 1 = 2(x − 2).']]]]];let n=0,root=document.getElementById('answers');groups.forEach(g=>{const s=document.createElement('section');s.className='answers-section';s.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(q=>{n++;s.innerHTML+='<div class="solution"><div class="srow"><span class="snum">'+n+'</span><div class="sbody"><h3>'+q[0]+'</h3><div class="answer-badge">Answer: '+q[1]+'</div><div class="work">'+q[2].map(x=>'<code>'+x+'</code>').join('')+'</div></div></div></div>'});root.appendChild(s)});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)};</script></body></html>
