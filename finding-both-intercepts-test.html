<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Finding Both Intercepts — Lesson Test | SUMMIT SAT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Equations in Two Variables</div><div class="page-type">LESSON TEST</div><h1>Finding Both Intercepts</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers & Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'What are the intercepts of 3x + 2y = 12?',c:['(4, 0) and (0, 6)','(6, 0) and (0, 4)','(12, 0) and (0, 12)','(3, 0) and (0, 2)'],a:0,why:'Set y = 0 to get x = 4. Set x = 0 to get y = 6.'},{level:'EASY-MEDIUM',q:'For y = −2x + 10, what are the x- and y-intercepts?',c:['(−5, 0) and (0, 10)','(5, 0) and (0, 10)','(10, 0) and (0, 5)','(5, 0) and (0, −10)'],a:1,why:'Set y = 0: 2x = 10, so x = 5. Set x = 0: y = 10.'},{level:'MEDIUM',q:'Find both intercepts of 7x − 5y = 35.',c:['(5, 0) and (0, 7)','(−5, 0) and (0, 7)','(5, 0) and (0, −7)','(7, 0) and (0, −5)'],a:2,why:'Set y = 0: 7x = 35, so x = 5. Set x = 0: −5y = 35, so y = −7.'},{level:'HARD',q:'The line ax + 3y = 18 has x-intercept (−6, 0). What is a?',c:['−6','−3','3','6'],a:1,why:'Substitute (−6, 0): −6a = 18, so a = −3.'},{level:'HARD / SAT-STYLE',q:'A resource model is 4x + 10y = 80. What do the axis intercepts show?',c:['Maximum x is 8 and maximum y is 20','Maximum x is 20 and maximum y is 8','Maximum x is 10 and maximum y is 4','Both maximums are 80'],a:1,why:'With y = 0, x = 20. With x = 0, y = 8. The intercepts represent the one-variable maximums.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
