<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Opens Up or Down — Lesson Test | SUMMIT MATH</title><style>.test-card{margin:16px 0;padding:22px;border:1px solid var(--line);border-radius:18px}.choices{display:grid;gap:8px}.submit{padding:14px 20px;border:0;border-radius:14px;font-weight:800}.result{display:none;padding:22px;margin-top:20px;border:1px solid var(--line);border-radius:18px}.review{padding:10px 0;border-top:1px solid var(--line)}</style></head><body><main class="page-shell"><section class="lesson-card"><div class="crumb">Advanced Math · Quadratic Functions · Standard Form</div><div class="page-type">LESSON TEST</div><div class="lesson-title">Opens Up or Down</div><p>Answer all five questions. Results appear only after Submit Test.</p><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section></section></main><script>const qs=[{level:'EASY',q:'Which way does y=5x²−2x+1 open?',c:['Up','Down'],a:0,why:'a=5>0, so it opens upward.'},{level:'EASY / MEDIUM',q:'Which statement is true for y=−0.8x²+3x−6?',c:['It opens down and has a maximum.','It opens up and has a minimum.','It opens down and has a minimum.','It is linear.'],a:0,why:'a=−0.8<0, so it opens down and the vertex is a maximum.'},{level:'MEDIUM',q:'Rewrite 4x²+y=3x+2. Which way does the parabola open?',c:['Down','Up'],a:0,why:'y=−4x²+3x+2, so a=−4.'},{level:'MEDIUM / HARD',q:'For y=(k+2)x²−5x+1 to open upward, what must be true?',c:['k>−2','k<−2','k=−2','k>2'],a:0,why:'Upward requires k+2>0, so k>−2.'},{level:'HARD / EXAM-STYLE',q:'For y=(m−3)(m+1)x²+2x−7 to have a maximum, which interval contains m?',c:['−1<m<3','m<−1 or m>3','m>−1','m<3'],a:0,why:'A maximum requires (m−3)(m+1)<0, which occurs between the roots −1 and 3.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<small>'+x.level+'</small><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0,r=[];qs.forEach((x,i)=>{const p=document.querySelector('input[name="q'+i+'"]:checked'),v=p?+p.value:-1,ok=v===x.a;if(ok)score++;r.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const b=document.getElementById('result');b.style.display='block';b.innerHTML='<h2>'+score+'/5 · '+score*20+'%</h2>'+r.join('');document.querySelectorAll('input').forEach(e=>e.disabled=true);document.getElementById('submit').disabled=true};</script></body></html>
