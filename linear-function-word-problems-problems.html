<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Linear Function Word Problems — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Linear Function Word Problems</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Identify rate, initial value, and direct models",[["A craft studio charges a $6 setup fee plus $4 per item. Which model gives the total cost C for n items?",["C = 6n + 4","C = 4n + 6","C = 4n − 6","C = 6n − 4"],1],["A tank starts with 75 liters and loses 5 liters each hour. How much remains after 7 hours?",["40 liters","35 liters","45 liters","70 liters"],0],["The model y = 2.5x + 18 represents a linear situation. What does 18 represent?",["The output after 18 input units","The rate of change","The initial value when x = 0","The input when y = 0"],2]]],["CORE PRACTICE","Build and use linear models",[["A taxi ride costs $19 for 4 km and $37 for 10 km. The cost is linear. What is the fixed starting fee?",["$3","$7","$11","$15"],1],["A study center charges $28 per month plus $9 per workshop. If the total is $91, how many workshops were attended?",["5","6","7","8"],2],["A sample cools according to T = 64 − 3t, where t is minutes and T is in degrees Celsius. When will T = 34?",["8 minutes","9 minutes","10 minutes","11 minutes"],2],["A plant is 14 cm tall on day 2 and 30 cm tall on day 6. Its height changes linearly. What height is predicted on day 9?",["38 cm","40 cm","42 cm","44 cm"],2],["A savings balance is modeled by S = 35w + 120. After how many weeks will the balance be $330?",["5","6","7","8"],1],["A container begins with 150 gallons and drains at 8 gallons per minute. How many gallons remain after 11 minutes?",["54","62","70","78"],1],["A messaging plan costs $15 plus $0.08 per message. What is the total cost for 250 messages?",["$20","$30","$35","$40"],2],["A reservoir begins with 220 cubic meters and loses 12 cubic meters per day. Which equation models the amount A after d days?",["A = 12d + 220","A = 220 − 12d","A = 12d − 220","A = 220d − 12"],1]]],["EXAM-STYLE PRACTICE","Translate multi-step situations accurately",[["A ride service charges $18.50 for 5 miles and $32.00 for 11 miles. The cost is linear. What is the cost for 8 miles?",["$23.00","$24.50","$25.25","$26.75"],2],["A storage tank contains 96 liters after 2 minutes and 72 liters after 5 minutes. The amount changes linearly. After how many minutes will 40 liters remain?",["7","8","9","10"],2],["A club's net funds are modeled by P = 6n − 150, where n is the number of tickets sold. How many tickets must be sold for P = 0?",["20","25","30","36"],1],["A rental costs $41 for 3 hours and $73 for 7 hours. The cost is linear. What is the cost for 10 hours?",["$89","$93","$97","$101"],2],["Plan A costs 12 + 3x dollars and Plan B costs 30 + 1.5x dollars for x units. At what value of x do the plans cost the same?",["8","10","12","15"],2]]],["CHALLENGE PROBLEMS","Recover hidden values from linear conditions",[["A linear model passes through (3, 26) and (8, 51). For what input x is the output 76?",["11","12","13","14"],2],["A reservoir contains 86 liters after 4 minutes and 50 liters after 10 minutes. The amount changes linearly. When will 20 liters remain?",["13 minutes","14 minutes","15 minutes","16 minutes"],2]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
