<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Building an Equation from Slope and Y-Intercept — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Building an Equation from Slope and Y-Intercept</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[["01 · SKILL CHECK","Build equations directly from a given slope and y-intercept",[["A line has slope 2 and y-intercept 5. Which equation represents the line?",["y = 5x + 2","y = 2x + 5","y = 2x − 5","y = −2x + 5"],1],["A line has slope −3 and y-intercept 4. Which equation represents the line?",["y = −3x + 4","y = 3x + 4","y = −4x + 3","y = −3x − 4"],0],["A line has slope 1/2 and y-intercept −6. Which equation represents the line?",["y = (1/2)x + 6","y = 2x − 6","y = (1/2)x − 6","y = −(1/2)x − 6"],2]]],["02 · CORE PRACTICE","Use y = mx + b with positive, negative, zero, fractional, and decimal values",[["A line has slope 0 and y-intercept 9. Which equation represents the line?",["y = 9","y = 9x","y = x + 9","y = −9"],0],["A line has slope −5 and y-intercept −2. Which equation represents the line?",["y = −5x + 2","y = 5x − 2","y = −5x − 2","y = −2x − 5"],2],["A quantity starts at 30 and increases by 7 for each 1-unit increase in x. Which equation models y?",["y = 30x + 7","y = 7x + 30","y = −7x + 30","y = 7x − 30"],1],["A quantity starts at 18 and decreases by 4 for each 1-unit increase in x. Which equation models y?",["y = 4x + 18","y = −4x + 18","y = −18x + 4","y = 18x − 4"],1],["A line has slope −2/3 and y-intercept 5. Which equation represents the line?",["y = (2/3)x + 5","y = −(2/3)x − 5","y = −(2/3)x + 5","y = −(3/2)x + 5"],2],["A line has slope 6 and crosses the y-axis at (0, −8). Which equation represents the line?",["y = 6x − 8","y = −8x + 6","y = 6x + 8","y = −6x − 8"],0],["A line has slope 1 and y-intercept −12. Which equation represents the line?",["y = x − 12","y = −x + 12","y = 12x − 1","y = x + 12"],0],["A line has slope −0.5 and y-intercept 3.5. Which equation represents the line?",["y = 0.5x + 3.5","y = −0.5x − 3.5","y = −0.5x + 3.5","y = 3.5x − 0.5"],2]]],["03 · EXAM-STYLE PRACTICE","Translate rates and initial values into linear equations",[["A service charges an initial fee of $25 plus $8 per month. If C is the total cost after m months, which equation models C?",["C = 25m + 8","C = 8m + 25","C = 8m − 25","C = 25 − 8m"],1],["A tank contains 140 liters at the start and loses 6 liters each minute. If V is the volume after t minutes, which equation models V?",["V = 6t + 140","V = −6t + 140","V = 140t − 6","V = −140t + 6"],1],["A line has y-intercept −7. For every increase of 2 in x, y increases by 3. Which equation represents the line?",["y = (2/3)x − 7","y = (3/2)x − 7","y = −(3/2)x − 7","y = (3/2)x + 7"],1],["A linear function has y-intercept 11. Whenever x increases by 4, y decreases by 10. Which equation represents the function?",["y = (5/2)x + 11","y = −(2/5)x + 11","y = −(5/2)x + 11","y = −(5/2)x − 11"],2],["Which equation has slope 4/3 and y-intercept −5?",["y = (4/3)x − 5","y = −(4/3)x + 5","y = (3/4)x − 5","y = 4x/3 + 5"],0]]],["04 · CHALLENGE PROBLEMS","Combine slope information and intercept information carefully",[["A line has slope a − 1 and y-intercept 2a + 3. If its slope is 4, which equation represents the line?",["y = 4x + 11","y = 4x + 13","y = 5x + 13","y = 4x − 13"],1],["A line crosses the y-axis at (0, 12). When x increases by 5, y decreases by 15. Which equation represents the line?",["y = −3x + 12","y = 3x + 12","y = −(1/3)x + 12","y = −3x − 12"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
