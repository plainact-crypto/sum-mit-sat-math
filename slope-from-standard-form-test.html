<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Slope from Standard Form — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">LESSON TEST</div><h1>Slope from Standard Form</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers & Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'What is the slope of 6x + 3y = 15?',c:['−2','−1/2','1/2','2'],a:0,why:'Using m = −A/B gives m = −6/3 = −2.'},{level:'EASY-MEDIUM',q:'What is the slope of −4x + 8y = 32?',c:['−2','−1/2','1/2','2'],a:2,why:'m = −(−4)/8 = 4/8 = 1/2.'},{level:'MEDIUM',q:'A model is 3h + 2d = 24, where h is time in hours and d is a measured distance. What is the slope of d with respect to h?',c:['−3/2 distance units per hour','−2/3 distance units per hour','2/3 distance units per hour','3/2 distance units per hour'],a:0,why:'Solve for d: 2d = −3h + 24, so d = −(3/2)h + 12. The slope is −3/2 distance units per hour.'},{level:'HARD',q:'The line ax − 5y = 20 has slope 7/5. What is a?',c:['−7','−5','5','7'],a:3,why:'For ax − 5y = 20, m = −a/(−5) = a/5. Set a/5 = 7/5, giving a = 7.'},{level:'HARD / EXAM-STYLE',q:'The line (r − 1)x + (2r + 3)y = 10 has slope −2. What is r?',c:['−7/3','−5/3','5/3','7/3'],a:0,why:'Set −(r − 1)/(2r + 3) = −2. Then r − 1 = 2(2r + 3), so r − 1 = 4r + 6, −7 = 3r, and r = −7/3.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
