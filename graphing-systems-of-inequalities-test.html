<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Graphing Systems of Inequalities — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Systems of Linear Inequalities</div><div class="page-type">LESSON TEST</div><h1>Graphing Systems of Inequalities</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'Which point satisfies both y ≥ x − 2 and y ≤ 4?',c:['(1, 0)','(3, 0)','(5, 5)','(0, 5)'],a:0,why:'At (1,0), 0 ≥ -1 and 0 ≤ 4, so both inequalities are true. Each other choice fails at least one condition.'},{level:'EASY-MEDIUM',q:'A system contains y > 2x + 1 and y ≤ -x + 7. How should the two boundary lines be drawn?',c:['First dashed; second solid','Both solid','First solid; second dashed','Both dashed'],a:0,why:'The strict sign > excludes equality, so y = 2x + 1 is dashed. The sign ≤ includes equality, so y = -x + 7 is solid.'},{level:'MEDIUM',q:'Where do the boundary lines y = x + 1 and y = -2x + 7 intersect?',c:['(2, 3)','(3, 4)','(1, 2)','(4, 5)'],a:0,why:'Set x + 1 = -2x + 7. Then 3x = 6, so x = 2 and y = 3.'},{level:'HARD',q:'Which system has no solution?',c:['y > 3x + 4 and y < 3x + 1','y ≥ x and y ≤ x + 5','y > -x and y < x + 4','y ≥ 2 and y ≤ 6'],a:0,why:'The line y = 3x + 4 is always 3 units above y = 3x + 1. A point cannot be above the higher line and below the lower line at the same time.'},{level:'HARD / EXAM-STYLE',q:'A school club can buy x posters and y banners. It requires x ≥ 0, y ≥ 0, x + y ≤ 12, and 2x + y ≤ 18. Which choice is feasible?',c:['(6, 6)','(8, 3)','(4, 7)','(10, 1)'],a:2,why:'For (4,7), x+y=11≤12 and 2x+y=15≤18, with both quantities nonnegative. The other choices violate 2x+y≤18.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};document.documentElement.dataset.theme=localStorage.getItem('summit-theme')||'light';</script></body></html>
