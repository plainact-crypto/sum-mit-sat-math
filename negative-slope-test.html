<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Negative Slope — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">LESSON TEST</div><h1>Negative Slope</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers & Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'A line passes through (2, 9) and (6, 1). What is its slope?',c:['−4','−2','2','8'],a:1,why:'m = (1 − 9)/(6 − 2) = −8/4 = −2.'},{level:'EASY-MEDIUM',q:'What is the slope of y = −1.4x + 3?',c:['−3','−1.4','1.4','3'],a:1,why:'In y = mx + b, the coefficient of x is the slope, so m = −1.4.'},{level:'MEDIUM',q:'A linear table contains the points (−4, 13) and (2, −2). What is the slope?',c:['−5/2','−3/2','3/2','5/2'],a:0,why:'m = (−2 − 13)/(2 − (−4)) = −15/6 = −5/2.'},{level:'HARD',q:'The line through (3, k) and (11, −9) has slope −7/4. What is k?',c:['−23','−5','5','23'],a:2,why:'−7/4 = (−9 − k)/(11 − 3) = (−9 − k)/8. Then −14 = −9 − k, so k = 5.'},{level:'HARD / EXAM-STYLE',q:'A reservoir contains 180 liters after 2 hours and 108 liters after 8 hours. If the amount changes linearly, what is the rate of change?',c:['−18 L/hour','−12 L/hour','−9 L/hour','12 L/hour'],a:1,why:'Rate = (108 − 180)/(8 − 2) = −72/6 = −12 liters per hour.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
