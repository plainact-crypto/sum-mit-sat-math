<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Slope from Slope-Intercept Form — Practice Problems | SUMMIT SAT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Functions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Slope from Slope-Intercept Form</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[["01 · SKILL CHECK","Read the coefficient of x directly from slope-intercept form",[["What is the slope of y = 5x − 2?",["−2","2","5","7"],2],["What is the slope of y = −3x + 7?",["−7","−3","3","7"],1],["What is the slope of y = (2/5)x + 9?",["2/5","5/2","9","−2/5"],0]]],["02 · CORE PRACTICE","Identify positive, negative, fractional, decimal, implied, and zero slopes",[["What is the slope of y = x − 11?",["−11","−1","0","1"],3],["What is the slope of y = −x + 4?",["−4","−1","1","4"],1],["What is the slope of y = 0.75x − 6?",["−6","0.075","0.75","6"],2],["What is the slope of y = −1.2x + 8?",["−8","−1.2","1.2","8"],1],["What is the slope of y = (7/3)x − 5?",["−5","3/7","7/3","5"],2],["What is the slope of y = 9x?",["0","1","9","−9"],2],["What is the slope of y = −(5/8)x − 3?",["−5/8","5/8","−3","3"],0],["What is the slope of y = 0x + 14?",["0","1","14","undefined"],0]]],["03 · SAT-STYLE PRACTICE","Interpret slope as a rate and connect it to units in context",[["A delivery company models total cost C, in dollars, for x miles by C = 2.4x + 6. What does the slope represent?",["A $6 charge per mile","A $2.40 increase per mile","A $2.40 starting charge","A $6 increase for every 2.4 miles"],1],["The amount W, in liters, of water in a tank after t minutes is W = −6t + 180. What does the slope represent?",["The tank starts with 6 liters","The amount increases by 180 liters per minute","The amount decreases by 6 liters per minute","The amount decreases by 180 liters per minute"],2],["A streaming plan’s monthly total y, in dollars, after x premium rentals is y = 3.75x + 12. What is the slope, including units?",["$12 per rental","$3.75 per rental","3.75 rentals per dollar","$15.75 per rental"],1],["A cyclist’s distance y, in miles, after x hours is modeled by y = (9/2)x + 1. What does the slope mean?",["The cyclist begins 9/2 miles from the start","The distance increases by 1 mile per hour","The distance increases by 9/2 miles per hour","The cyclist rides 2/9 mile per hour"],2],["The value y of a quantity is modeled by y = −0.25x + 40. If x increases by 4, how does y change?",["It increases by 1","It decreases by 1","It decreases by 4","It increases by 4"],1]]],["04 · CHALLENGE PROBLEMS","Use the slope coefficient to recover a missing parameter",[["The line y = (k − 2)x + 5 has slope 6. What is k?",["4","6","8","10"],2],["The line y = (3p + 1)x − 4 has slope −8. What is p?",["−3","−7/3","3","−9"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)};</script></body></html>
