<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Polynomial Division — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Advanced Math · Polynomial Operations</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Polynomial Division</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">monomials · long division · remainders</span></div></div><div id="sets"></div></div></main><script>const groups=[["SKILL CHECK","Divide coefficients and subtract exponents",[["Simplify: 12x³ ÷ 3x",["4x²","4x³","9x²","4x"],0],["Simplify: -20y⁵ ÷ 5y²",["-4y³","-4y⁷","4y³","-15y³"],0],["Divide: (15a⁴ + 10a²) ÷ 5a²",["3a² + 2","3a² + 2a","10a² + 5","3a⁶ + 2a⁴"],0]]],["CORE PRACTICE","Use term-by-term division or polynomial long division",[["Divide: (x² + 5x + 6) ÷ (x + 2)",["x + 3","x + 2","x + 4","x² + 3"],0],["Divide: (x² - 9) ÷ (x - 3)",["x + 3","x - 3","x + 6","x² + 3"],0],["Divide: (2x² + 7x + 3) ÷ (x + 3)",["2x + 1","2x + 3","x + 1","2x - 1"],0],["Divide: (3x³ - 6x² + 9x) ÷ 3x",["x² - 2x + 3","x² - 2x + 9","x³ - 2x² + 3x","x² + 2x + 3"],0],["Divide: (x³ + 4x² + x - 6) ÷ (x + 2)",["x² + 2x - 3","x² + 2x + 3","x² + 6x - 3","x² - 2x - 3"],0],["What is the remainder when x² + 2x + 5 is divided by x + 1?",["4","2","5","0"],0],["Divide: (4m³ - 8m² + 12m) ÷ 4m",["m² - 2m + 3","m² - 2m + 12","m² + 2m + 3","4m² - 8m + 12"],0],["Divide: (6p⁴ + 9p³ - 3p²) ÷ 3p²",["2p² + 3p - 1","2p² + 3p - 3","3p² + 2p - 1","2p⁶ + 3p⁵ - p⁴"],0]]],["EXAM-STYLE PRACTICE","Apply division in test-style algebra and context",[["Which expression equals (x² - x - 12) ÷ (x - 4)?",["x + 3","x - 3","x + 4","x - 4"],0],["A rectangle has area x² + 7x + 12 square meters and length x + 3 meters. What is its width?",["x + 4 m","x + 3 m","x + 7 m","x² + 4 m"],0],["If P(x)=2x³+5x²-3x and P(x) is divided by x, what is the quotient?",["2x² + 5x - 3","2x³ + 5x² - 3","2x² + 5x - 3/x","2x² + 5x"],0],["When x³ - 2x² + kx + 6 is divided by x - 2, the remainder is 8. What is k?",["1","2","-1","4"],0],["A polynomial divided by x+2 gives quotient x²-3x+4 and remainder 5. Which is the original polynomial?",["x³ - x² - 2x + 13","x³ - x² - 2x + 8","x³ - 5x² + 10x + 13","x³ - x² + 10x + 13"],0]]],["CHALLENGE PROBLEMS","Track missing powers and remainder relationships",[["Divide x⁴ - 5x² + 4 by x² - 1.",["x² - 4","x² + 4","x² - 5","x² - 4, remainder 0"],3],["If x³ + ax² - 5x + 6 is divisible by x - 2, what is a?",["-1","-2","1","2"],0]]]];let n=0,root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});if(n!==18||groups[0][2].length!==3||groups[1][2].length!==8||groups[2][2].length!==5||groups[3][2].length!==2)throw new Error('Problems format must be exactly 3/8/5/2 = 18 questions');document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});</script></body></html>
