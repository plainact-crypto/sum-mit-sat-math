<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Solving from Tables — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">LESSON TEST</div><h1>Solving from Tables</h1><p>Answer all five questions. Results appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../problems/">Review Practice →</a></div></div></main><script>const qs=[{level:'EASY',q:'Table A follows y = 2x + 1 and Table B follows y = -x + 7. For x = 0, 1, 2, the rows are A: (0,1), (1,3), (2,5) and B: (0,7), (1,6), (2,5). What is the system solution shown in the tables?',c:['(0, 1)','(1, 3)','(2, 5)','No solution'],a:2,why:'The same x-value and y-value appear in both tables at (2, 5). Substitution checks 2(2)+1=5 and -(2)+7=5.'},{level:'EASY-MEDIUM',q:'Two linear tables have the same constant rate of change, 3, but one table is always 3 units above the other for matching x-values. How many solutions does the system have?',c:['Exactly one','Exactly two','Infinitely many','No solution'],a:3,why:'Equal rates with different outputs at the same x-values represent distinct parallel lines, so there is no common ordered pair.'},{level:'MEDIUM',q:'Table A contains (-1,-1), (0,1), and (2,5). Table B contains the same three ordered pairs and follows the same linear pattern. How many solutions does the system have?',c:['No solution','Exactly one','Infinitely many','Exactly three'],a:2,why:'Both tables represent the same line y = 2x + 1. Every point on that line satisfies both equations, so there are infinitely many solutions.'},{level:'HARD',q:'A linear Table A has points (0,1), (2,4), (4,7). A linear Table B has points (0,9), (2,6), (4,3). At what point do the two linear patterns intersect?',c:['(2, 4)','(8/3, 5)','(3, 5)','(4, 3)'],a:1,why:'Table A has slope 3/2, so y = (3/2)x + 1. Table B has slope -3/2, so y = -(3/2)x + 9. Setting them equal gives 3x = 8, so x = 8/3 and y = 5.'},{level:'HARD / EXAM-STYLE',q:'A study tracker shows Plan A totals of 12, 24, 36, 48 questions after 0, 2, 4, 6 hours. Plan B totals are 30, 34, 38, 42 at those same times. Assuming both patterns stay linear, after how many hours are the totals equal?',c:['4 hours','4.5 hours','5 hours','6 hours'],a:1,why:'Plan A is A(h)=6h+12 and Plan B is B(h)=2h+30. Solve 6h+12=2h+30 to get 4h=18, so h=4.5. Both plans then total 39 questions.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
