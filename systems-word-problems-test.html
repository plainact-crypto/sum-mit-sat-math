<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Systems Word Problems — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">LESSON TEST</div><h1>Systems Word Problems</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'A school club sold 50 adult and student tickets. Adult tickets cost $8 and student tickets cost $5. Total revenue was $310. How many adult tickets were sold?',c:['15','20','25','30'],a:1,why:'Let a be adult tickets and s be student tickets. Then a+s=50 and 8a+5s=310. Substituting s=50-a gives 8a+250-5a=310, so 3a=60 and a=20.'},{level:'EASY-MEDIUM',q:'A lab needs 40 liters of a 25% solution made by mixing a 10% solution with a 40% solution. How many liters of the 40% solution are needed?',c:['15 L','20 L','25 L','30 L'],a:1,why:'Let x be liters of 10% solution and y be liters of 40% solution. Then x+y=40 and 0.10x+0.40y=10. Substituting x=40-y gives 4-0.10y+0.40y=10, so 0.30y=6 and y=20 liters.'},{level:'MEDIUM',q:'Plan A costs $25 to start plus $7 per month. Plan B costs $55 to start plus $4 per month. After how many months are the total costs equal?',c:['6 months','8 months','10 months','12 months'],a:2,why:'Set the costs equal: 25+7m=55+4m. Then 3m=30, so m=10 months. Both plans cost $95 then.'},{level:'HARD',q:'Two numbers have a sum of 68 and a difference of 20. What is the larger number?',c:['24','34','44','48'],a:2,why:'Let L be the larger number and S the smaller. L+S=68 and L-S=20. Adding the equations gives 2L=88, so L=44.'},{level:'HARD / EXAM-STYLE',q:'A community event sold 180 adult and student passes. Adult passes cost $12 and student passes cost $7. Total pass revenue was $1,560. How many adult passes were sold?',c:['50','60','70','80'],a:1,why:'Let a be adult passes and s be student passes. Then a+s=180 and 12a+7s=1560. Using s=180-a gives 12a+1260-7a=1560, so 5a=300 and a=60.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
