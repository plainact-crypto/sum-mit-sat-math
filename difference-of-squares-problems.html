<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Difference of Squares — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.question{margin:14px 0;padding:20px;border:1px solid var(--line);background:var(--surface);border-radius:18px}.question ol{line-height:1.75}.lesson-section{margin:30px 0}.lesson-section h2{margin-bottom:14px}.footer{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:28px}</style></head><body><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Advanced Math · Factoring</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Difference of Squares</h1><p>18 original questions · Skill Check → Challenge</p></div><div id="sets"></div><div class="footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">Answers &amp; Solutions →</a></div></div></main><script>const groups=[['SKILL CHECK',[

]]];let n=0,root=document.getElementById('sets');groups.forEach(g=>{const s=document.createElement('section');s.className='lesson-section';s.innerHTML='<h2>'+g[0]+'</h2>';g[1].forEach(q=>{n++;s.innerHTML+='<div class="question"><b>'+n+'. '+q[0]+'</b><ol type="A">'+q[1].map(x=>'<li>'+x+'</li>').join('')+'</ol></div>'});root.appendChild(s)});if(n!==18||groups[0][1].length!==3||groups[1][1].length!==8||groups[2][1].length!==5||groups[3][1].length!==2)throw Error('3/8/5/2 required');</script></body></html>
