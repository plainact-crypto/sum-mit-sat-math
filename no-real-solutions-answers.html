<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>No Real Solutions — Answers | SUMMIT MATH</title></head><body><main class="page-shell"><section class="lesson-card"><div class="crumb">Advanced Math · Quadratic Equations</div><div class="page-type">ANSWERS</div><div class="lesson-title">No Real Solutions</div><p>Exact answers to the 18 current Practice Problems.</p><div id="answers"></div><a href="../problems/">← Back to Practice Problems</a></section></main><script>const groups=[["SKILL CHECK",[["Which equation has no real solutions?","x² + 4x + 8 = 0","D=4²−4(1)(8)=−16<0, so there are no real solutions."],["How many real solutions does x² + 9 = 0 have?","0","x²=−9 has no real-number solution; equivalently D=−36<0."],["If a quadratic has no real solutions, its discriminant must be:","negative","A quadratic has no real solutions exactly when D=b²−4ac<0."]]],["CORE PRACTICE",[["Which quadratic has no real solutions?","x² + 2x + 5 = 0","D=2²−4(1)(5)=−16<0. The other choices have real roots."],["What does the discriminant show about 2x² + 4x + 7 = 0?","There are no real solutions.","D=4²−4(2)(7)=16−56=−40<0."],["For what values of c does x² − 6x + c = 0 have no real solutions?","c > 9","D=36−4c. Requiring D<0 gives 36−4c<0, so c>9."],["The equation x² + bx + 10 = 0 has no real solutions. Which condition must b satisfy?","b² < 40","D=b²−40. No real solutions require D<0, so b²<40."],["Which value of k makes x² + 4x + k = 0 have no real solutions?","5","D=16−4k. For k=5, D=−4<0; the other listed values give D≥0."],["For 3x² − 6x + 5 = 0, which statement is true?","D = −24, so there are no real solutions.","D=(−6)²−4(3)(5)=36−60=−24<0."],["Which equation cannot be solved with real-number roots?","4x² + 4x + 3 = 0","D=4²−4(4)(3)=16−48=−32<0. The other choices have nonnegative discriminants."],["For what values of p does 2x² + px + 8 = 0 have no real solutions?","−8 < p < 8","D=p²−64<0 means p²<64, which is equivalent to −8<p<8."]]],["EXAM-STYLE PRACTICE",[["The graph of y = x² − 12x + m does not intersect the x-axis. Which condition must m satisfy?","m > 36","D=144−4m<0 gives m>36, so the graph has no x-intercepts."],["A test-style quadratic is 4x² + qx + 16 = 0. Which value of q gives no real solutions?","10","D=q²−256. For q=10, D=−156<0; 16 gives D=0 and ±20 give D>0."],["For which values of a does x² + ax + 16 = 0 have no real solutions?","−8 < a < 8","D=a²−64<0 means a²<64, so −8<a<8."],["A square has side length x + 2. The equation (x + 2)² = −9 is proposed for its area. What is true over the real numbers?","It has no real solution because a real square cannot be negative.","For every real x, (x+2)²≥0, so it cannot equal −9."],["For what values of r does 5x² − 10x + r = 0 have no real solutions?","r > 5","D=(−10)²−4(5)r=100−20r<0 gives r>5."]]],["CHALLENGE PROBLEMS",[["The equation (s + 2)x² + 4x + 3 = 0 is quadratic and has no real solutions. Which condition on s is equivalent?","s > −2/3","D=16−12(s+2)=−12s−8. Requiring D<0 gives s>−2/3. This also guarantees s+2≠0, so the equation remains quadratic."],["A height model is h(t) = −5t² + 20t + c. For the graph never to meet h = 0 at any real t, what condition must c satisfy?","c < −20","Setting h=0 gives −5t²+20t+c=0 with D=400+20c. No real t requires D<0, so c<−20."]]]];let n=0,root=document.getElementById('answers');groups.forEach(g=>{let s=document.createElement('section');s.className='lesson-section';s.innerHTML='<h2>'+g[0]+'</h2>';g[1].forEach(a=>{n++;s.innerHTML+='<div class="question"><b>'+n+'. '+a[0]+'</b><p><strong>Answer:</strong> '+a[1]+'</p><p>'+a[2]+'</p></div>'});root.appendChild(s)});if(n!==18||groups[0][1].length!==3||groups[1][1].length!==8||groups[2][1].length!==5||groups[3][1].length!==2)throw Error('Answers must match current Problems 3/8/5/2');</script></body></html>
