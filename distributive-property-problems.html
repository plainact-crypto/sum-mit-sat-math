<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Distributive Property — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Advanced Math · Equivalent Expressions</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Distributive Property</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Expand · factor · verify equivalence</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Distribute a factor across two terms",[["Expand: 3(x + 4)",["3x + 12","3x + 4","7x","12x"],0],["Expand: 5(2a - 3)",["10a - 15","10a - 3","7a - 15","10a + 15"],0],["Expand: -2(y + 6)",["-2y - 12","-2y + 12","-2y + 6","2y - 12"],0]]],["CORE PRACTICE","Handle signs, fractions, and variables",[["Expand: 4(3x + 2)",["12x + 8","12x + 2","7x + 8","12x + 6"],0],["Expand: -3(2m - 5)",["-6m + 15","-6m - 15","-5m + 15","6m - 15"],0],["Expand: x(x + 7)",["x² + 7x","2x + 7","x² + 7","7x²"],0],["Expand: (1/2)(8p + 6)",["4p + 3","4p + 6","8p + 3","4p + 12"],0],["Expand: 0.4(5t - 10)",["2t - 4","2t - 10","5.4t - 4","2t + 4"],0],["Simplify: 2(3x + 4) + x",["7x + 8","6x + 8","7x + 4","9x + 8"],0],["Simplify: 5(a - 2) - 2a",["3a - 10","7a - 10","3a - 2","3a + 10"],0],["Which factored form equals 12x + 18?",["6(2x + 3)","3(4x + 18)","6(2x + 18)","2(6x + 18)"],0]]],["EXAM-STYLE PRACTICE","Use distribution in equations and contexts",[["A rectangle has width x + 3 and length 4. Which expression represents its area?",["4x + 12","4x + 3","x + 12","8x + 24"],0],["Which expression is equivalent to -5(2x - 7)?",["-10x + 35","-10x - 35","-7x + 35","10x - 35"],0],["If 3(2x + k) = 6x + 15 for every x, what is k?",["3","5","6","15"],1],["Simplify: 2(4y - 3) - 3(y + 2)",["5y - 12","11y - 12","5y","5y + 12"],0],["A store reduces each of n identical $18 items by $3. Which expression gives the total cost after the discount?",["15n","18n - 3","18(n - 3)","21n"],0]]],["CHALLENGE PROBLEMS","Combine nested distribution and reverse distribution",[["Simplify: -2[3x - 4(1 - x)]",["-14x + 8","2x + 8","-14x - 8","-6x + 8"],0],["Which expression is equivalent to 6x² - 9x?",["3x(2x - 3)","3(2x - 3)","x(6x - 9x)","3x(2x + 3)"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});if(n!==18||groups[0][2].length!==3||groups[1][2].length!==8||groups[2][2].length!==5||groups[3][2].length!==2)throw new Error('Problems format must be exactly 3/8/5/2 = 18 questions');document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
