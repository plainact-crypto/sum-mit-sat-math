<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Special Polynomial Products — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Advanced Math · Polynomial Operations</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Special Polynomial Products</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">perfect squares · difference of squares · identities</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Recognize the three core special-product patterns",[["Expand: (x + 6)²",["x² + 12x + 36","x² + 36","x² + 6x + 36","x² + 12x + 6"],0],["Expand: (y - 5)²",["y² - 10y + 25","y² - 25","y² + 10y + 25","y² - 5y + 25"],0],["Multiply: (a + 4)(a - 4)",["a² - 16","a² + 16","a² - 8a - 16","a² + 8a - 16"],0]]],["CORE PRACTICE","Apply perfect-square and conjugate identities accurately",[["Expand: (2x + 3)²",["4x² + 12x + 9","4x² + 9","2x² + 12x + 9","4x² + 6x + 9"],0],["Expand: (3m - 2)²",["9m² - 12m + 4","9m² - 4","9m² + 12m + 4","6m² - 12m + 4"],0],["Multiply: (5p + 1)(5p - 1)",["25p² - 1","25p² + 1","10p² - 1","25p² - 10p - 1"],0],["Multiply: (4r - 7)(4r + 7)",["16r² - 49","16r² + 49","8r² - 49","16r² + 56r - 49"],0],["Expand: (2x - 5)²",["4x² - 20x + 25","4x² - 25","4x² + 20x + 25","2x² - 20x + 25"],0],["Expand: (3y + 4)²",["9y² + 24y + 16","9y² + 16","9y² + 12y + 16","6y² + 24y + 16"],0],["Multiply: (6a - b)(6a + b)",["36a² - b²","36a² + b²","12a² - b²","36a² + 12ab - b²"],0],["Expand: ((1/2)x + 3)²",["(1/4)x² + 3x + 9","(1/4)x² + 9","(1/2)x² + 3x + 9","(1/4)x² + (3/2)x + 9"],0]]],["EXAM-STYLE PRACTICE","Use identities efficiently in test-style algebra and context",[["Which expression is equivalent to (t + 9)²?",["t² + 18t + 81","t² + 81","t² + 9t + 81","t² + 18t + 9"],0],["A square has side length (x + 7) meters. Which polynomial represents its area?",["x² + 14x + 49 m²","x² + 49 m²","2x + 14 m²","x² + 7x + 49 m²"],0],["If (2n + k)² has a middle term of 20n, what is k?",["5","10","4","20"],0],["Which factorization is equivalent to 81x² - 16?",["(9x - 4)(9x + 4)","(81x - 4)(x + 4)","(9x - 8)(9x + 2)","(9x - 4)²"],0],["Simplify: (x + 5)² - (x - 5)²",["20x","10x","4x","100"],0]]],["CHALLENGE PROBLEMS","Connect identity structure to unknowns and fast simplification",[["If (x + a)² = x² + 14x + 49 for all x, what is a?",["7","14","49","-7"],0],["Simplify without fully expanding both squares: (3x + 2)² - (3x - 2)²",["24x","12x","36x² - 4","16"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});if(n!==18||groups[0][2].length!==3||groups[1][2].length!==8||groups[2][2].length!==5||groups[3][2].length!==2)throw new Error('Problems format must be exactly 3/8/5/2 = 18 questions');document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
