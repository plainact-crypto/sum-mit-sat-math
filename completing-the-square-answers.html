<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Completing the Square — Answers | SUMMIT MATH</title></head><body><main class="page-shell"><section class="lesson-card"><div class="crumb">Advanced Math · Quadratic Equations</div><div class="page-type">ANSWERS</div><div class="lesson-title">Completing the Square</div><p>Exact answers to the 18 current Practice Problems.</p><div id="answers"></div><a href="../problems/">← Back to Practice Problems</a></section></main><script>const groups=[["SKILL CHECK",[["What value completes the square in x² + 8x + ___?","16","Half of 8 is 4, and 4² = 16."],["Rewrite x² − 10x + 25 as a squared binomial.","(x−5)²","Since 25 = 5² and −10x = 2(x)(−5), the trinomial is (x−5)²."],["Solve by completing the square: x² + 6x + 5 = 0","x = −1 or −5","Move 5: x²+6x=−5. Add 9: (x+3)²=4. Thus x+3=±2, giving x=−1 or −5."]]],["CORE PRACTICE",[["Solve by completing the square: x² + 4x − 12 = 0","x = 2 or −6","Move −12: x²+4x=12. Add 4: (x+2)²=16. So x+2=±4."],["Solve by completing the square: x² − 8x + 7 = 0","x = 1 or 7","Move 7: x²−8x=−7. Add 16: (x−4)²=9. So x−4=±3."],["Solve: x² + 2x − 3 = 0","x = 1 or −3","Move −3: x²+2x=3. Add 1: (x+1)²=4. So x+1=±2."],["Solve: x² − 6x + 2 = 0","x = 3 ± √7","Move 2: x²−6x=−2. Add 9: (x−3)²=7. Therefore x=3±√7."],["Solve: x² + 10x + 7 = 0","x = −5 ± 3√2","Move 7: x²+10x=−7. Add 25: (x+5)²=18. Since √18=3√2, x=−5±3√2."],["Solve: 2x² + 8x − 6 = 0","x = −2 ± √7","Divide by 2: x²+4x−3=0. Then x²+4x=3; add 4 to get (x+2)²=7."],["Solve: 3x² − 12x + 6 = 0","x = 2 ± √2","Divide by 3: x²−4x+2=0. Then x²−4x=−2; add 4 to get (x−2)²=2."],["Over the real numbers, solve x² + 4x + 8 = 0.","No real solution","x²+4x=−8. Add 4: (x+2)²=−4. A real square cannot be negative."]]],["EXAM-STYLE PRACTICE",[["Which equation results after completing the square for x² + 12x = 13?","(x+6)² = 49","Half of 12 is 6; add 36 to both sides: x²+12x+36=49."],["A quadratic equation is x² − 14x + 40 = 0. Which solution set is correct?","x = 4 and 10","Move 40: x²−14x=−40. Add 49: (x−7)²=9. Thus x−7=±3."],["The height equation h² + 6h = 7 has one positive solution. What is it?","h = 1","Add 9: (h+3)²=16. Then h+3=±4, so h=1 or −7; the positive solution is 1."],["Solve exactly: 4x² − 8x − 3 = 0","x = 1 ± √7/2","Divide by 4: x²−2x−3/4=0. Then x²−2x=3/4; add 1: (x−1)²=7/4. So x=1±√7/2."],["Which statement is true for x² − 2x + 5 = 0 over the real numbers?","No real solutions","x²−2x=−5. Add 1: (x−1)²=−4, impossible over the real numbers."]]],["CHALLENGE PROBLEMS",[["Solve exactly: 2x² + 4x − 1 = 0","x = −1 ± √6/2","Divide by 2: x²+2x−1/2=0. Then x²+2x=1/2; add 1: (x+1)²=3/2. Therefore x=−1±√6/2."],["For what value of k does x² + 10x + k become a perfect-square trinomial?","k = 25","A perfect-square trinomial is x²+10x+25=(x+5)², so k=(10/2)²=25."]]]];let n=0,root=document.getElementById('answers');groups.forEach(g=>{let s=document.createElement('section');s.className='lesson-section';s.innerHTML='<h2>'+g[0]+'</h2>';g[1].forEach(a=>{n++;s.innerHTML+='<div class="question"><b>'+n+'. '+a[0]+'</b><p><strong>Answer:</strong> '+a[1]+'</p><p>'+a[2]+'</p></div>'});root.appendChild(s)});if(n!==18||groups[0][1].length!==3||groups[1][1].length!==8||groups[2][1].length!==5||groups[3][1].length!==2)throw Error('Answers must match current Problems 3/8/5/2');</script></body></html>
