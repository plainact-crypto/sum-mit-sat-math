<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Systems Word Problems — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Systems Word Problems</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Model, solve, interpret</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Turn everyday totals into two equations",[["A school event sold 18 adult and student tickets. Adult tickets cost $9 and student tickets cost $5. The total revenue was $126. How many adult tickets were sold?",["6","8","9","12"],2],["A supply box contains 14 notebooks and pens. Each notebook costs $4 and each pen costs $2. The box costs $34 altogether. How many notebooks are in the box?",["3","5","7","11"],0],["A school store sold 30 calculators and rulers for a total of $174. Calculators cost $7 each and rulers cost $4 each. How many calculators were sold?",["12","15","18","22"],2]]],["CORE PRACTICE","Build and solve systems from context",[["At a fundraiser, 42 adult and child tickets were sold. Adult tickets cost $9 and child tickets cost $6. Total ticket revenue was $318. How many adult tickets were sold?",["18","20","22","24"],2],["A jar contains 20 quarters and dimes worth $3.50 in total. How many quarters are in the jar?",["8","10","12","15"],1],["A lab needs 30 liters of a 38% solution by mixing a 20% solution with a 50% solution. How many liters of the 50% solution are needed?",["10","12","18","20"],2],["A rectangle has perimeter 54 cm. Its length is 5 cm greater than its width. What is the rectangle's length?",["11 cm","13 cm","16 cm","19 cm"],2],["A café prepared 64 regular and premium sandwiches. Regular sandwiches cost $5 and premium sandwiches cost $8. The total value was $437. How many premium sandwiches were prepared?",["25","32","39","44"],2],["Gym Plan A costs $20 to join plus $6 per month. Plan B costs $44 to join plus $3 per month. After how many months do the total costs match?",["6 months","8 months","10 months","12 months"],1],["Machine A ran for x hours at 30 parts per hour, and Machine B ran for y hours at 45 parts per hour. Together they ran 13 hours and produced 510 parts. How many hours did Machine B run?",["5","6","8","10"],2],["Two numbers have a sum of 52 and a difference of 14. What is the larger number?",["19","26","33","38"],2]]],["EXAM-STYLE PRACTICE","Choose equations carefully and answer what is asked",[["Delivery Service A charges a $18 base fee plus $4 per mile. Service B charges a $36 base fee plus $2 per mile. At what distance are the total charges equal?",["6 miles","8 miles","9 miles","12 miles"],2],["A theater sold 260 adult and child tickets. Adult tickets cost $10 and child tickets cost $6. Revenue was $2,320. How many adult tickets were sold?",["170","180","190","200"],2],["A 25 kg metal mixture is made from a 10% alloy and a 40% alloy. The final mixture is 28% of the target metal. How many kilograms of the 40% alloy are used?",["10 kg","12 kg","15 kg","18 kg"],2],["A food stand sold 120 burgers and side orders. Burgers cost $9 and side orders cost $6. Total sales were $900. How many burgers were sold?",["40","50","60","75"],2],["Ride Plan A charges $15 plus $4 per mile. Ride Plan B charges $33 plus $2.50 per mile. At what distance do the plans cost the same?",["8 miles","10 miles","12 miles","15 miles"],2]]],["CHALLENGE PROBLEMS","Handle less direct totals and hidden setup steps",[["A warehouse filled 34 small and large crates. Small crates hold 12 kg and large crates hold 20 kg. The crates hold 520 kg altogether. How many large crates were filled?",["12","14","18","20"],1],["A concert sold 240 VIP and standard tickets. VIP tickets cost $54 and standard tickets cost $36. After subtracting a flat $600 venue fee, the event kept $10,920 from ticket sales. How many VIP tickets were sold?",["120","140","160","180"],2]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
