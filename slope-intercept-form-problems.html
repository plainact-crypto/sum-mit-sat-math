<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Slope-Intercept Form — Practice Problems | SUMMIT SAT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Linear Equations in Two Variables</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Slope-Intercept Form</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers & Solutions →</a></div></div></main><script>const groups=[['01 · SKILL CHECK','Read slope and y-intercept directly',[['In y = 4x + 7, what is the slope?',['4','7','−4','−7'],0],['In y = −3x + 5, what is the y-intercept value?',['−3','3','5','−5'],2],['What is the y-intercept point of y = (1/2)x − 6?',['(−6, 0)','(0, −6)','(0, 1/2)','(1/2, 0)'],1]]],['02 · CORE PRACTICE','Recognize and interpret y = mx + b',[['For y = 9x, what is b?',['0','1','9','−9'],0],['For y = 12, what is the slope?',['0','1','12','undefined'],0],['Which equation has slope −2 and y-intercept 8?',['y = 8x − 2','y = −2x + 8','y = 2x − 8','y = −8x + 2'],1],['Which equation has slope 3/5 and passes through (0, −4)?',['y = (3/5)x − 4','y = −4x + 3/5','y = (5/3)x − 4','y = (3/5)x + 4'],0],['In y = −x + 11, what is m?',['−1','0','1','11'],0],['A line has equation y = 2x − 9. By how much does y change when x increases by 1?',['y decreases by 9','y increases by 2','y increases by 9','y decreases by 2'],1],['Which statement is true for y = −(3/4)x + 2?',['The line rises 3 for every 4 units right','The line falls 3 for every 4 units right','The y-intercept is −2','The slope is 4/3'],1],['Which equation represents a horizontal line crossing the y-axis at −5?',['y = −5x','y = x − 5','y = −5','x = −5'],2]]],['03 · SAT-STYLE PRACTICE','Interpret rates and initial values in context',[['A taxi ride costs a $4 starting fee plus $2.50 per mile. If x is miles and y is total cost, which equation models the ride?',['y = 4x + 2.5','y = 2.5x + 4','y = 6.5x','y = 2.5x − 4'],1],['A tank contains 60 liters of water and drains at 3 liters per minute. Which equation gives the remaining water y after x minutes?',['y = 60x − 3','y = 3x + 60','y = −3x + 60','y = 3x − 60'],2],['The model y = 18x + 120 gives total savings y after x weeks. What does 18 represent?',['The starting savings','The number of weeks','The amount added each week','The total after 18 weeks'],2],['The model y = −5x + 90 gives a quantity y after x hours. What is the initial value?',['−5','5','90','95'],2],['A gym membership is modeled by y = 25x + 40, where x is the number of months. What is the total cost after 4 months?',['$100','$125','$140','$165'],2]]],['04 · CHALLENGE PROBLEMS','Use slope-intercept structure in less direct forms',[['An equation is 2y = −6x + 14. What is its slope after solving for y?',['−6','−3','3','7'],1],['A line has slope 5/2 and y-intercept −3. Which value of y is obtained when x = 4?',['5','7','10','13'],1]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)};</script></body></html>
