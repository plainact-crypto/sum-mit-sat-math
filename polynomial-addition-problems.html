<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Polynomial Addition — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Advanced Math · Polynomial Operations</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Polynomial Addition</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">like terms · missing terms · context</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Add polynomials by combining like terms",[["Add: (3x + 4) + (2x - 7)",["5x - 3","5x + 11","x - 3","6x - 28"],0],["Add: (5y² - 2y) + (3y² + 6y)",["8y² + 4y","8y² - 8y","2y² + 4y","15y⁴ + 4y"],0],["Add: (4a² + 3a - 5) + (a² - 7a + 2)",["5a² - 4a - 3","5a² + 10a - 3","3a² - 4a - 7","4a⁴ - 4a - 3"],0]]],["CORE PRACTICE","Align powers and combine every matching term",[["Add: (2x³ - 5x + 1) + (7x³ + 3x - 4)",["9x³ - 2x - 3","9x³ - 8x + 5","5x³ - 2x - 3","14x⁶ - 2x - 3"],0],["Add: (6m² + 4m - 9) + (-2m² + 5m + 3)",["4m² + 9m - 6","8m² + 9m - 12","4m² - m - 6","4m⁴ + 9m - 6"],0],["Add: (-3p³ + 2p² - p) + (5p³ - 7p² + 4p)",["2p³ - 5p² + 3p","8p³ - 5p² + 3p","2p³ + 9p² + 3p","2p⁶ - 5p⁴ + 3p²"],0],["Add: (x⁴ + 2x² - 8) + (3x³ - 5x² + 6)",["x⁴ + 3x³ - 3x² - 2","4x⁷ - 3x² - 2","x⁴ + 3x³ + 7x² - 14","x⁴ + 3x³ - 3x² + 14"],0],["Add: (0.5t² + 1.2t - 3) + (1.5t² - 0.7t + 4)",["2t² + 0.5t + 1","2t² + 1.9t + 1","t² + 0.5t + 7","0.75t⁴ + 0.5t + 1"],0],["Add: (1/2)x² + (3/4)x + 2 and (1/3)x² - (1/4)x - 5",["(5/6)x² + (1/2)x - 3","(2/5)x² + x - 3","(5/6)x² + x + 7","(1/6)x² + (1/2)x - 3"],0],["If P(x)=4x²-3x+7 and Q(x)=-x²+5x-2, find P(x)+Q(x).",["3x² + 2x + 5","5x² + 2x + 9","3x² - 8x + 5","-4x⁴ - 15x² - 14"],0],["Add: (7r⁵ - 2r³ + r) + (-4r⁵ + 6r² - 3r)",["3r⁵ - 2r³ + 6r² - 2r","11r⁵ - 2r³ + 6r² - 2r","3r⁵ + 4r³ - 2r","3r¹⁰ - 2r³ + 6r² - 2r"],0]]],["EXAM-STYLE PRACTICE","Use polynomial sums in test-style algebra and context",[["Which expression is equivalent to (3x² - 4x + 9) + (5x² + x - 12)?",["8x² - 3x - 3","8x² - 5x + 21","2x² - 3x - 3","15x⁴ - 3x - 3"],0],["The lengths of two trail sections are (2x²+3x+1) km and (x²-5x+4) km. What is their total length?",["3x² - 2x + 5 km","3x² + 8x + 5 km","x² - 2x + 3 km","2x⁴ - 2x + 4 km"],0],["For A(x)=2x³-x²+4 and B(x)=-5x³+6x²-7x, what is A(x)+B(x)?",["-3x³ + 5x² - 7x + 4","7x³ + 5x² - 7x + 4","-3x³ - 7x² - 7x + 4","-10x⁶ + 5x⁴ - 7x + 4"],0],["A school records (4n²+2n+18) morning visits and (3n²-5n+12) afternoon visits. Which polynomial represents the total?",["7n² - 3n + 30","7n² + 7n + 30","n² - 3n + 6","12n⁴ - 3n + 216"],0],["If the sum of two polynomials is 6x³+2x²-5x+9 and one polynomial is 2x³-x²+x+4, which polynomial could be the other?",["4x³ + 3x² - 6x + 5","8x³ + x² - 4x + 13","4x³ + x² - 4x + 5","4x³ + 3x² + 6x + 5"],0]]],["CHALLENGE PROBLEMS","Track several powers and parameters accurately",[["Add: (2a⁴b - 3a²b² + 5ab³) + (-7a⁴b + 8a²b² - 2ab³)",["-5a⁴b + 5a²b² + 3ab³","9a⁴b + 5a²b² + 3ab³","-5a⁴b - 11a²b² + 7ab³","-5a⁸b² + 5a⁴b⁴ + 3a²b⁶"],0],["For P(x)=kx²+3x-4 and Q(x)=(5-k)x²-8x+9, simplify P(x)+Q(x).",["5x² - 5x + 5","(2k+5)x² - 5x + 5","5x² + 11x - 13","kx⁴ - 5x + 5"],0]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});if(n!==18||groups[0][2].length!==3||groups[1][2].length!==8||groups[2][2].length!==5||groups[3][2].length!==2)throw new Error('Problems format must be exactly 3/8/5/2 = 18 questions');document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
