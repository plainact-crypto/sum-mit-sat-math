<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Systems with Parameters — Practice Problems | SUMMIT MATH</title><style>.practice-wrap{width:min(980px,100%);margin:auto}.practice-head{text-align:center;margin-bottom:30px}.practice-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.practice-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.practice-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.practice-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.question{padding:18px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qrow{display:flex;gap:12px}.qnum{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.qbody{flex:1}.qbody h3{margin:3px 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.check-btn{margin-top:10px;border:0;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:800}.feedback{margin-top:10px;font-weight:750;font-size:13px;min-height:20px}.feedback.ok{color:#198754}.feedback.no{color:#c33}.practice-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.practice-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}@media(max-width:650px){.practice-section{padding:20px 16px}.choices{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="practice-wrap"><div class="practice-head"><div class="crumb">Algebra · Systems of Linear Equations</div><div class="page-type">PRACTICE PROBLEMS</div><h1>Systems with Parameters</h1><div class="practice-meta"><span class="practice-pill">18 questions</span><span class="practice-pill">Easy → Challenge</span><span class="practice-pill">Instant correctness only</span></div></div><div id="sets"></div><div class="practice-footer"><a href="../explanation/">← Back to Explanation</a><a href="../answers/">View Full Answers &amp; Solutions →</a></div></div></main><script>const groups=[["SKILL CHECK","Match parameter values to solution counts",[["For 2x + y = 7 and kx + 2y = 14, what value of k gives infinitely many solutions?",["2","4","7","14"],1],["For 2x + y = 7 and 4x + 2y = c, which value of c gives no solution?",["10","14","7","28"],0],["For 2x + y = 7 and kx + 2y = 14, which value of k guarantees one solution?",["4","6","0 only","14 only"],1]]],["CORE PRACTICE","Scale equations and compare coefficients",[["For 3x + 2y = 8 and 6x + ay = 16, what value of a gives infinitely many solutions?",["2","3","4","6"],2],["For 3x + 2y = 8 and 6x + 4y = m, what value of m gives infinitely many solutions?",["8","12","16","24"],2],["For 5x - y = 9 and 15x - 3y = m, which value of m gives no solution?",["18","27","36","45"],0],["For ax + 3y = 12 and 4x + 6y = 24, what value of a gives infinitely many solutions?",["1","2","3","4"],1],["For 4x + 2y = 10 and px + y = 5, what value of p gives infinitely many solutions?",["1","2","4","5"],1],["For x + 3y = 5 and 2x + ky = 10, what value of k makes the equations identical?",["3","5","6","10"],2],["For x + 3y = 5 and 2x + 6y = c, which value of c gives no solution?",["5","8","10","12"],1],["The system ax + 2y = 7 and 6x + 4y = 20 has no solution for what value of a?",["2","3","4","6"],1]]],["EXAM-STYLE PRACTICE","Reason from parameter conditions",[["A system is 4x - 2y = 6 and 2kx - 4y = 12. What value of k makes the equations identical?",["2","4","6","8"],1],["The equations 2x + by = 9 and 6x + 12y = 27 have infinitely many solutions. Find b.",["2","3","4","6"],2],["For 7x + 2y = 11 and 21x + 6y = q, which statement is true?",["q=33 gives infinitely many solutions","q=33 gives no solution","every q gives one solution","q=11 gives infinitely many solutions"],0],["For 3x + ky = 8 and 6x + 10y = 19, what value of k gives no solution?",["2","5","8","10"],1],["A pair of pricing models is C = 6n + 15 and C = pn + 25. What value of p makes it impossible for the prices to be equal?",["0","6","15","25"],1]]],["CHALLENGE PROBLEMS","Recover parameters from exact system behavior",[["For (a+1)x + 4y = 12 and 6x + 8y = 24, find a so the system has infinitely many solutions.",["1","2","3","5"],1],["For 2x + 3y = 7 and kx + 9y = 25, find k so the system has no solution.",["3","6","9","12"],1]]]];let n=0;const root=document.getElementById('sets');groups.forEach(g=>{const sec=document.createElement('section');sec.className='practice-section';sec.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(item=>{n++;const q=document.createElement('div');q.className='question';q.dataset.answer=''+item[2];q.innerHTML='<div class="qrow"><span class="qnum">'+n+'</span><div class="qbody"><h3>'+item[0]+'</h3><div class="choices">'+item[1].map((c,i)=>'<label class="choice"><input type="radio" name="q'+n+'" value="'+i+'"> '+String.fromCharCode(65+i)+') '+c+'</label>').join('')+'</div><button class="check-btn">Check Answer</button><div class="feedback"></div></div></div>';sec.appendChild(q)});root.appendChild(sec)});document.querySelectorAll('.question').forEach(q=>q.querySelector('.check-btn').onclick=()=>{const r=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!r){f.textContent='Choose an answer first.';f.className='feedback no';return}const ok=r.value===q.dataset.answer;f.textContent=ok?'Correct ✓':'Not quite — try again.';f.className='feedback '+(ok?'ok':'no')});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('summit-theme',next)};</script></body></html>
