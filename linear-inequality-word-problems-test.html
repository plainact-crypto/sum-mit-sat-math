<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Linear Inequality Word Problems — Lesson Test | SUMMIT MATH</title><style>.test-wrap{width:min(900px,100%);margin:auto}.test-head{text-align:center;margin-bottom:28px}.test-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.test-card{margin:16px 0;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}.level{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:11px;border:1px solid var(--line);border-radius:12px}.submit{display:block;margin:26px auto;border:0;background:var(--text);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:850}.result{display:none;margin:26px 0;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.review{padding:12px 0;border-top:1px solid var(--line)}.review:first-of-type{border-top:0}@media(max-width:650px){.test-card{padding:18px 15px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="test-wrap"><div class="test-head"><div class="crumb">Algebra · Linear Inequalities</div><div class="page-type">LESSON TEST</div><h1>Linear Inequality Word Problems</h1><p>Answer all five questions. Results and explanations appear only after Submit Test.</p></div><div id="questions"></div><button class="submit" id="submit">Submit Test</button><section class="result" id="result"></section><div class="practice-footer"><a href="../answers/">← Answers &amp; Solutions</a><a href="../explanation/">Review Explanation →</a></div></div></main><script>const qs=[{level:'EASY',q:'A student has read 27 pages and wants to read at least 65 pages in total. If x is the number of additional pages, which inequality models the goal?',c:['27 + x ≥ 65','27 + x ≤ 65','27x ≥ 65','x - 27 ≥ 65'],a:0,why:'At least means the total must be greater than or equal to 65, so 27 + x ≥ 65.'},{level:'EASY-MEDIUM',q:'A museum charges $8 admission plus $3 per audio guide. You can spend no more than $26. What is the greatest number of guides you can rent?',c:['5','6','7','8'],a:1,why:'8 + 3g ≤ 26 gives 3g ≤ 18, so g ≤ 6. The greatest whole number is 6.'},{level:'MEDIUM',q:'An account starts with $250. Each purchase removes $28. The balance must stay at least $82. What is the greatest number of purchases?',c:['5','6','7','8'],a:1,why:'250 - 28p ≥ 82 gives -28p ≥ -168. Dividing by -28 reverses the inequality, so p ≤ 6.'},{level:'HARD',q:'A delivery service charges a $7.50 base fee plus $2.25 per kilometer. A customer wants the total to be less than $30. Which statement is correct?',c:['d < 10','d ≤ 10','d > 10','d ≥ 10'],a:0,why:'7.5 + 2.25d < 30 gives 2.25d < 22.5, so d < 10 kilometers.'},{level:'HARD / EXAM-STYLE',q:'A club sells kits for $42 each. Each kit costs $19 to make, and fixed event costs are $310. The club wants profit to be more than $610. What is the least whole number of kits it must sell?',c:['39','40','41','42'],a:2,why:'Profit is 42k - 19k - 310 = 23k - 310. Require 23k - 310 > 610, so 23k > 920 and k > 40. Therefore the least whole number is 41.'}];const root=document.getElementById('questions');qs.forEach((x,i)=>{const d=document.createElement('section');d.className='test-card';d.innerHTML='<div class="level">'+x.level+'</div><h3>'+(i+1)+'. '+x.q+'</h3><div class="choices">'+x.c.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+v+'</label>').join('')+'</div>';root.appendChild(d)});document.getElementById('submit').onclick=()=>{let score=0;const reviews=[];qs.forEach((x,i)=>{const r=document.querySelector('input[name="q'+i+'"]:checked');const picked=r?Number(r.value):-1;const ok=picked===x.a;if(ok)score++;reviews.push('<div class="review"><b>Q'+(i+1)+' — '+(ok?'Correct ✓':'Incorrect')+'</b><div>Correct answer: '+String.fromCharCode(65+x.a)+') '+x.c[x.a]+'</div><div>'+x.why+'</div></div>')});const pct=score*20;const label=score===5?'Excellent':score===4?'Strong':score===3?'Developing':score===2?'Needs Review':'Review the Lesson';const box=document.getElementById('result');box.style.display='block';box.innerHTML='<h2>'+score+'/5 · '+pct+'% · '+label+'</h2>'+reviews.join('');box.scrollIntoView({behavior:'smooth',block:'start'})};(()=>{const s=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=s;document.getElementById('themeToggle')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)})})();</script></body></html>
