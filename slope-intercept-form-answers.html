<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Slope-Intercept Form — Answers & Solutions | SUMMIT SAT MATH</title><style>.answers-wrap{width:min(980px,100%);margin:auto}.answers-head{text-align:center;margin-bottom:30px}.answers-head h1{font-size:clamp(34px,5vw,54px);margin:10px auto 12px}.answers-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.answers-pill{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.answers-section{margin:18px 0;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.solution{padding:20px 0;border-top:1px solid var(--line)}.solution:first-of-type{border-top:0}.srow{display:flex;gap:12px}.snum{min-width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--blue)}.sbody{flex:1}.sbody h3{margin:3px 0 10px;font-size:17px}.answer-badge{display:inline-flex;padding:8px 11px;border-radius:999px;background:var(--surface2);font-weight:800;margin-bottom:10px}.work{display:grid;gap:7px}.work code{display:block;padding:10px 12px;border-radius:10px;background:var(--surface2);white-space:normal}.answers-footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:28px}.answers-footer a{padding:13px 17px;border-radius:13px;border:1px solid var(--line);font-weight:800}.answers-footer .primary{background:var(--text);color:var(--bg)}@media(max-width:650px){.answers-section{padding:20px 16px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span class="brand-copy">SUMMIT<small>SAT MATH</small></span></a><nav><a href="/">Home</a><a href="/#subjects">Subjects</a><a href="/#subjects">Practice</a><a href="/#subjects">Progress</a></nav><div class="actions"><button class="lang">EN <span>|</span> عربي</button><button id="themeToggle" class="theme">◐</button></div></header><main class="page-shell"><div class="answers-wrap"><div class="answers-head"><div class="crumb">Algebra · Linear Equations in Two Variables</div><div class="page-type">ANSWERS & SOLUTIONS</div><h1>Slope-Intercept Form</h1><div class="answers-meta"><span class="answers-pill">18 complete solutions</span><span class="answers-pill">Matched to Practice Problems</span></div></div><div id="answers"></div><div class="answers-footer"><a href="../problems/">← Back to Practice Problems</a><a href="../explanation/">Review Explanation</a><a class="primary" href="../test/">Take the Lesson Test →</a></div></div></main><script>const groups=[['01 · SKILL CHECK','Questions 1–3',[['In y = 4x + 7, what is the slope?','A) 4',['In y = mx + b, m is the slope. Here m = 4.']],['In y = −3x + 5, what is the y-intercept value?','C) 5',['In y = mx + b, b is the y-intercept value. Here b = 5.']],['What is the y-intercept point of y = (1/2)x − 6?','B) (0, −6)',['At the y-intercept, x = 0, so y = −6.']]]],['02 · CORE PRACTICE','Questions 4–11',[['For y = 9x, what is b?','A) 0',['Rewrite as y = 9x + 0, so b = 0.']],['For y = 12, what is the slope?','A) 0',['A constant y-value is a horizontal line, so its slope is 0.']],['Which equation has slope −2 and y-intercept 8?','B) y = −2x + 8',['Match m = −2 and b = 8 in y = mx + b.']],['Which equation has slope 3/5 and passes through (0, −4)?','A) y = (3/5)x − 4',['The point (0, −4) gives b = −4, with m = 3/5.']],['In y = −x + 11, what is m?','A) −1',['The coefficient of x is −1.']],['A line has equation y = 2x − 9. By how much does y change when x increases by 1?','B) y increases by 2',['Slope 2 means Δy/Δx = 2/1.']],['Which statement is true for y = −(3/4)x + 2?','B) The line falls 3 for every 4 units right',['Slope −3/4 means y decreases 3 when x increases 4.']],['Which equation represents a horizontal line crossing the y-axis at −5?','C) y = −5',['A horizontal line has slope 0 and constant y-value −5.']]]],['03 · SAT-STYLE PRACTICE','Questions 12–16',[['A taxi ride costs a $4 starting fee plus $2.50 per mile.','B) y = 2.5x + 4',['Rate per mile is the slope 2.5; starting fee is the intercept 4.']],['A tank contains 60 liters and drains at 3 liters per minute.','C) y = −3x + 60',['The amount starts at 60 and decreases by 3 each minute.']],['In y = 18x + 120, what does 18 represent?','C) The amount added each week',['The slope 18 is the weekly rate of change.']],['In y = −5x + 90, what is the initial value?','C) 90',['At x = 0, y = 90, so the initial value is 90.']],['For y = 25x + 40, what is the total cost after 4 months?','C) $140',['y = 25(4) + 40 = 100 + 40 = 140.']]]],['04 · CHALLENGE PROBLEMS','Questions 17–18',[['For 2y = −6x + 14, what is the slope after solving for y?','B) −3',['Divide every term by 2: y = −3x + 7, so m = −3.']],['A line has slope 5/2 and y-intercept −3. What is y when x = 4?','B) 7',['y = (5/2)(4) − 3 = 10 − 3 = 7.']]]]];let n=0,root=document.getElementById('answers');groups.forEach(g=>{const s=document.createElement('section');s.className='answers-section';s.innerHTML='<span class="section-kicker">'+g[0]+'</span><h2>'+g[1]+'</h2>';g[2].forEach(q=>{n++;s.innerHTML+='<div class="solution"><div class="srow"><span class="snum">'+n+'</span><div class="sbody"><h3>'+q[0]+'</h3><div class="answer-badge">Answer: '+q[1]+'</div><div class="work">'+q[2].map(x=>'<code>'+x+'</code>').join('')+'</div></div></div></div>'});root.appendChild(s)});const saved=localStorage.getItem('summit-theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('summit-theme',n)};</script></body></html>
