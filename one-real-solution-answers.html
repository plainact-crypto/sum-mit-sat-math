<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>One Real Solution — Answers | SUMMIT MATH</title></head><body><main class="page-shell"><section class="lesson-card"><div class="crumb">Advanced Math · Quadratic Equations</div><div class="page-type">ANSWERS</div><div class="lesson-title">One Real Solution</div><p>Exact answers to the 18 current Practice Problems.</p><div id="answers"></div><a href="../problems/">← Back to Practice Problems</a><!-- QA: exact 1-to-1 with current 18 Problems --></section></main><script>const groups=[["SKILL CHECK",[["Which equation has exactly one real solution?","x² − 6x + 9 = 0","It factors as (x−3)²=0, so x=3 is a repeated root. Equivalently, D=36−36=0."],["How many distinct real solutions does 4x² + 12x + 9 = 0 have?","1","D=12²−4(4)(9)=144−144=0, so there is one repeated real solution."],["If a quadratic equation has exactly one real solution, what must its discriminant equal?","0","Exactly one real solution occurs when D=b²−4ac=0."]]],["CORE PRACTICE",[["Find the repeated real solution of x² − 10x + 25 = 0.","5","x²−10x+25=(x−5)², so the repeated solution is x=5."],["Which quadratic has exactly one real solution?","9x² − 12x + 4 = 0","D=(−12)²−4(9)(4)=144−144=0. The other choices have discriminants 25, −3, and 36."],["Solve 25x² + 20x + 4 = 0.","x = −2/5","25x²+20x+4=(5x+2)², so 5x+2=0 and x=−2/5."],["For x² + 14x + 49 = 0, which statement is true?","The equation has one real solution, x = −7.","x²+14x+49=(x+7)², so the repeated solution is x=−7."],["What value of c makes x² − 12x + c = 0 have exactly one real solution?","36","Set D=0: (−12)²−4c=144−4c=0, giving c=36."],["The equation 2x² + bx + 8 = 0 has exactly one real solution. Which values of b are possible?","b = ±8","Set D=0: b²−4(2)(8)=b²−64=0, so b=±8."],["If 3x² − 18x + 27 = 0 has one repeated root, what is that root?","3","Divide by 3: x²−6x+9=(x−3)²=0, so x=3."],["Which factored equation represents a quadratic with exactly one real solution?","(x − 4)² = 0","Both factors are identical, so the only real solution is x=4, repeated twice."]]],["EXAM-STYLE PRACTICE",[["The equation x² + kx + 16 = 0 has exactly one real solution and k < 0. What is k?","−8","Set D=0: k²−64=0, so k=±8. The condition k<0 selects k=−8."],["A test-style quadratic is 4x² + px + 9 = 0. If it has exactly one real solution, which values of p are possible?","p = ±12","Set D=0: p²−4(4)(9)=p²−144=0, so p=±12."],["The graph of y = x² − 6x + m touches the x-axis at exactly one point. What is m?","9","Touching the x-axis once means D=0: (−6)²−4m=36−4m=0, so m=9. Then y=(x−3)²."],["A square has side length x + 2 and area 25 square units. If x is restricted so that x + 2 ≥ 0, what is the single allowed real value of x?","3","(x+2)²=25 gives x+2=±5. The side-length restriction requires x+2≥0, so x+2=5 and x=3."],["For what value of q does 3x² − 12x + q = 0 have exactly one real solution?","12","Set D=0: (−12)²−4(3)q=144−12q=0, giving q=12."]]],["CHALLENGE PROBLEMS",[["The equation (r + 1)x² − 6x + 3 = 0 is quadratic and has exactly one real solution. What is r?","2","Set D=0: 36−4(r+1)(3)=36−12(r+1)=0, so r+1=3 and r=2. Then r+1=3≠0, so it remains quadratic."],["A height model is h(t) = −4t² + 16t + s. For the graph to touch h = 0 at exactly one time value, what must s equal?","−16","Touching h=0 once means D=0: 16²−4(−4)s=256+16s=0, so s=−16. The repeated time is t=2, and h(2)=0."]]]];let n=0,root=document.getElementById('answers');groups.forEach(g=>{let s=document.createElement('section');s.className='lesson-section';s.innerHTML='<h2>'+g[0]+'</h2>';g[1].forEach(a=>{n++;s.innerHTML+='<div class="answer"><b>'+n+'. '+a[0]+'</b><p><strong>Answer:</strong> '+a[1]+'</p><p>'+a[2]+'</p></div>'});root.appendChild(s)});if(n!==18||groups[0][1].length!==3||groups[1][1].length!==8||groups[2][1].length!==5||groups[3][1].length!==2)throw Error('Answers must match current Problems 3/8/5/2');</script></body></html>
